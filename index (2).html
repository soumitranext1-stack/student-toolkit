<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14182b">
<title>Study Game</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><b>Study Game</b><span id="st" class="st"><i></i><em>Local mode</em></span></div>
    <div class="row" style="gap:6px">
      <span id="devBadge" class="tg l" hidden>DEV</span>
      <button class="icon-btn" id="langBtn" title="Language">🌐 <span id="langCode">EN</span></button>
      <button class="icon-btn" id="themeBtn" title="Theme">🌙</button>
      <span class="lvl-pill">LVL <span class="lvlval">1</span></span>
      <div class="coin">🪙 <span class="coinval">0</span></div>
    </div>
  </header>

  <main>
    <section id="v-tools" class="view on">
      <div id="noticeBox" class="notice" hidden></div><div class="row dev-only" style="justify-content:flex-end;margin-bottom:8px" hidden><button class="btn sm" id="noticeBtn">📌 Set Notice</button></div><div class="poster-track" id="posterTrack"></div>
      <h2 id="hHome" data-i="tools">Student Tools</h2>
      <div class="grid" id="toolGrid"></div>

      <div class="row" style="justify-content:space-between;margin:18px 0 10px">
        <h2 style="margin:0" data-i="poems">Poems &amp; Writing Wall</h2>
        <button class="btn sm" id="openPoemReqBtn" data-i="req">Request Poem</button>
      </div>
      <div class="list" id="poemList"></div>
    </section>

    <section id="v-games" class="view">
      <h2 data-i="gamesH">Games Hub</h2>
      <div class="grid" id="gameSlotsGrid"></div>
    </section>

    <section id="v-ranking" class="view">
      <div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0" data-i="lb">Daily Leaderboard</h2><button class="btn sm dev-only" id="addRewardBtn" hidden>+ Reward</button></div>
      <div id="podiumSection"></div><div class="list" id="rankList"></div>
    </section>

    <section id="v-tasks" class="view">
      <div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0" data-i="d5">Daily 5 Tasks</h2><button class="btn sm dev-only" id="addTaskBtn" hidden>+ Task</button></div>
      <div class="list" id="taskList"></div>
    </section>

    <section id="v-store" class="view">
      <div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0" data-i="storeH">Store</h2><button class="btn sm dev-only" id="addStoreBtn" hidden>+ Item</button></div>
      <div class="row wrap" id="storeTabs" style="margin-bottom:10px;gap:6px"></div><div class="list" id="storeList"></div>
    </section>

    <section id="v-chat" class="view">
      <div class="row" style="justify-content:space-between;margin-bottom:12px"><h2 style="margin:0" data-i="msgs">Messages</h2>
        <div class="row"><button class="btn red sm dev-only" id="clearDevInboxBtn" hidden>Clear inbox</button><button class="btn sm" id="findBtn" data-i="addf">Add friend</button></div>
      </div>
      <div class="list" id="chatList"></div>
    </section>

    <section id="v-profile" class="view"></section>
  </main>

  <nav id="nav">
    <button data-tab="tools" class="on"><span>🏠</span><em>Home</em></button>
    <button data-tab="games"><span>🎮</span><em>Games</em></button>
    <button data-tab="ranking"><span>🏆</span><em>Rank</em></button>
    <button data-tab="tasks"><span>✅</span><em>Tasks</em></button>
    <button data-tab="store"><span>🛍️</span><em>Store</em></button>
    <button data-tab="chat"><span>💬</span><span id="chatNavDot" class="nav-dot" hidden></span><em>Chat</em></button>
    <button data-tab="profile"><span>👤</span><em>Profile</em></button>
  </nav>

  <div id="thread" class="thread" hidden>
    <div class="thh" id="thHead"></div><div class="msgs" id="msgs"></div>
    <div class="comp"><button class="btn ghost" id="chBtn" title="60s MCQ Duel">🎯</button><input id="msgIn" placeholder="Type a message" maxlength="500" autocomplete="off"><button class="btn" id="sendBtn">Send</button></div>
  </div>
  <div id="modals"></div>
  <div id="banBox" class="ban-screen" hidden>
    <div class="card" style="max-width:380px"><div style="font-size:42px;margin-bottom:8px">🚫</div><h2 style="margin-bottom:6px">Account Suspended</h2><p style="color:var(--mu);font-size:14px">Your access has been restricted by Developer.</p><p style="margin-top:10px;font-size:12px;color:var(--mu)">UID: <b id="banUid"></b></p><button class="btn ghost full" id="banLogin">Login / Switch account</button></div>
  </div>
</div>
<script src="js/core.js?v=1"></script>
<script src="js/firebase.js?v=1"></script>
<script src="js/home.js?v=1"></script>
<script src="js/games.js?v=1"></script>
<script src="js/ranking.js?v=1"></script>
<script src="js/tasks.js?v=1"></script>
<script src="js/store.js?v=1"></script>
<script src="js/chat.js?v=1"></script>
<script src="js/profile.js?v=1"></script>
<script src="js/boot.js?v=1"></script>
</body>
</html>
