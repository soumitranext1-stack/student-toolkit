<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Smart ID Card Print Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Hind+Siliguri:wght@500;700&family=Noto+Sans+Devanagari:wght@500;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <style>
    * {
      box-sizing: border-box; margin: 0; padding: 0;
      font-family: 'Plus Jakarta Sans', 'Noto Sans Devanagari', 'Hind Siliguri', sans-serif;
      -webkit-tap-highlight-color: transparent;
    }
    body {
      background: #03050a; color: #f8fafc; min-height: 100vh;
      padding-bottom: 92px; overflow-x: hidden; position: relative;
    }

    /* GLOWING AMBIENT ORBS */
    .orb-1, .orb-2 {
      position: fixed; border-radius: 50%; filter: blur(95px); z-index: -1; opacity: 0.4;
      animation: orbDrift 9s ease-in-out infinite alternate;
    }
    .orb-1 { width: 250px; height: 250px; background: #10b981; top: -50px; left: -50px; }
    .orb-2 { width: 270px; height: 270px; background: #2563eb; bottom: -60px; right: -60px; animation-delay: 2.5s; }
    @keyframes orbDrift {
      from { transform: translate(0, 0) scale(1); }
      to { transform: translate(22px, 26px) scale(1.1); }
    }

    /* TOP BAR */
    .topbar {
      background: rgba(9, 13, 24, 0.92); backdrop-filter: blur(18px);
      padding: 11px 12px; display: flex; justify-content: space-between; align-items: center;
      border-bottom: 1px solid rgba(255,255,255,0.08); position: sticky; top: 0; z-index: 90; gap: 8px;
    }
    .nav-btn {
      background: rgba(30, 41, 59, 0.88); color: #fff; border: 1px solid rgba(255,255,255,0.14);
      padding: 7px 11px; border-radius: 11px; font-weight: 700; font-size: 0.76rem; cursor: pointer;
    }
    .brand {
      font-size: 0.92rem; font-weight: 800;
      background: linear-gradient(90deg, #34d399, #38bdf8, #a78bfa);
      -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    }
    .lang-trigger {
      background: rgba(15, 23, 42, 0.95); color: #e2e8f0;
      border: 1px solid rgba(56, 189, 248, 0.45); border-radius: 16px;
      padding: 6px 10px; font-size: 0.72rem; font-weight: 800;
      cursor: pointer; display: flex; align-items: center; gap: 5px;
    }

    .container { max-width: 540px; margin: 0 auto; padding: 14px; }

    /* VISUALLY HIDDEN BUT 100% RELIABLE FILE INPUTS */
    .safe-file-input {
      position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
      overflow: hidden; clip: rect(0, 0, 0, 0); border: 0; opacity: 0;
    }

    /* UPLOAD CARDS GRID (FRONT & BACK) */
    .sides-grid {
      display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; margin-bottom: 14px;
    }
    .side-card {
      background: rgba(13, 19, 34, 0.92); border: 1.5px solid rgba(255,255,255,0.1);
      border-radius: 18px; padding: 12px; text-align: center;
      box-shadow: 0 10px 24px rgba(0,0,0,0.45);
    }
    .side-title {
      font-size: 0.82rem; font-weight: 800; color: #38bdf8; margin-bottom: 8px;
    }
    .thumb-box {
      width: 100%; aspect-ratio: 85.6 / 54; background: #060912;
      border: 1.5px dashed rgba(148, 163, 184, 0.35); border-radius: 10px;
      display: flex; align-items: center; justify-content: center;
      overflow: hidden; margin-bottom: 10px; position: relative;
    }
    .thumb-box img {
      width: 100%; height: 100%; object-fit: cover; display: none;
    }
    .thumb-ph { font-size: 0.72rem; color: #64748b; font-weight: 700; padding: 6px; }

    .pick-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 6px;
    }
    .pick-btn {
      display: flex; align-items: center; justify-content: center; gap: 4px;
      padding: 8px 6px; border-radius: 10px; font-size: 0.72rem; font-weight: 800;
      color: #fff; cursor: pointer; user-select: none; transition: transform 0.15s ease;
    }
    .pick-btn:active { transform: scale(0.95); }
    .pick-cam { background: linear-gradient(135deg, #059669, #10b981); }
    .pick-gal { background: linear-gradient(135deg, #2563eb, #7c3aed); }

    /* SETTINGS PANEL */
    .panel {
      background: rgba(13, 19, 34, 0.9); border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px; padding: 14px; margin-bottom: 14px;
    }
    .ctrl-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
    .ctrl-box {
      background: #060912; border: 1px solid rgba(255,255,255,0.08);
      border-radius: 12px; padding: 9px 10px;
    }
    .ctrl-box label { display: block; font-size: 0.68rem; font-weight: 700; color: #94a3b8; margin-bottom: 5px; }
    .ctrl-select, .ctrl-range {
      width: 100%; background: #0f172a; color: #fff; border: 1px solid #334155;
      border-radius: 8px; padding: 6px 8px; font-size: 0.78rem; font-weight: 700; outline: none;
    }

    /* A4 PRINT SHEET PREVIEW */
    .a4-wrap {
      overflow-x: auto; background: #070b16; border: 1px solid rgba(255,255,255,0.1);
      border-radius: 18px; padding: 12px; text-align: center;
    }
    #a4Sheet {
      display: inline-block; width: 356px; min-height: 504px;
      background: #ffffff; padding: 16px 12px; border-radius: 4px;
      box-shadow: 0 14px 36px rgba(0,0,0,0.85); color: #0f172a;
    }
    .card-pair-row {
      display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 12px;
    }
    .card-slot {
      width: 100%; aspect-ratio: 85.6 / 54;
      border: 1px dashed #94a3b8; border-radius: 6px;
      background: #f8fafc; overflow: hidden;
      display: flex; align-items: center; justify-content: center;
      position: relative;
    }
    .card-slot img { width: 100%; height: 100%; object-fit: cover; }
    .card-slot-empty { font-size: 0.65rem; color: #94a3b8; font-weight: 700; }

    /* BOTTOM DOCK */
    .bottom-dock {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: rgba(9, 13, 24, 0.96); backdrop-filter: blur(16px);
      border-top: 1px solid rgba(255,255,255,0.1); padding: 9px 12px;
      display: flex; justify-content: space-around; gap: 8px; z-index: 95;
    }
    .dock-btn {
      flex: 1; background: #1e293b; color: #fff; border: 1px solid #334155;
      padding: 10px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: 800; cursor: pointer;
    }
    .dock-btn.primary { background: linear-gradient(135deg, #2563eb, #7c3aed); border: none; }
    .dock-btn.success { background: linear-gradient(135deg, #059669, #10b981); border: none; }

    /* MODALS */
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.9); backdrop-filter: blur(8px);
      z-index: 150; display: none; align-items: center; justify-content: center; padding: 14px;
    }
    .modal-box {
      background: #0f172a; border: 1px solid rgba(56, 189, 248, 0.35); border-radius: 22px;
      padding: 16px; width: 100%; max-width: 430px; max-height: 90vh; overflow-y: auto;
    }
    .crop-stage { max-height: 310px; overflow: hidden; background: #000; border-radius: 12px; margin: 10px 0; }
    .crop-stage img { max-width: 100%; display: block; }
    .crop-tools { display: flex; gap: 8px; margin-bottom: 10px; }
    .m-btn { flex: 1; padding: 11px; border: none; border-radius: 12px; font-weight: 800; color: #fff; cursor: pointer; font-size: 0.82rem; }
    .x-btn {
      width: 28px; height: 28px; border-radius: 50%; background: rgba(239,68,68,0.2);
      border: 1px solid #ef4444; color: #fca5a5; font-weight: 900; cursor: pointer;
    }
    .lang-list { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; margin-top: 10px; }
    .lang-item {
      background: #1e293b; border: 1px solid #334155; color: #f8fafc;
      padding: 10px; border-radius: 12px; font-size: 0.8rem; font-weight: 700;
      cursor: pointer; display: flex; justify-content: space-between; align-items: center;
    }
    .lang-item.active { background: linear-gradient(135deg, #2563eb, #7c3aed); border-color: #93c5fd; }
  </style>
</head>
<body>

<div class="orb-1"></div>
<div class="orb-2"></div>

<div class="topbar">
  <button class="nav-btn" onclick="location.href='index.html'" id="uiHome">← Home</button>
  <span class="brand" id="uiTitle">Smart ID Card Print</span>
  <button class="lang-trigger" onclick="openLangModal()">
    <span>🌐</span>
    <span id="curLangCode">EN</span>
  </button>
</div>

<div class="container">

  <!-- FRONT & BACK UPLOAD CARDS WITH WORKING CAMERA + GALLERY -->
  <div class="sides-grid">
    <!-- FRONT SIDE -->
    <div class="side-card">
      <div class="side-title" id="uiFrontTitle">1. Front Side</div>
      <div class="thumb-box">
        <img id="frontThumb" />
        <span class="thumb-ph" id="frontPh">Front ID Photo</span>
      </div>
      <div class="pick-row">
        <label class="pick-btn pick-cam" for="frontCamInput" id="uiCam1">📷 Camera</label>
        <label class="pick-btn pick-gal" for="frontGalInput" id="uiGal1">🖼️ Gallery</label>
      </div>
      <input type="file" id="frontCamInput" class="safe-file-input" accept="image/*" capture="environment" onchange="handleFilePick(event, 'front')" />
      <input type="file" id="frontGalInput" class="safe-file-input" accept="image/*" onchange="handleFilePick(event, 'front')" />
    </div>

    <!-- BACK SIDE -->
    <div class="side-card">
      <div class="side-title" id="uiBackTitle">2. Back Side</div>
      <div class="thumb-box">
        <img id="backThumb" />
        <span class="thumb-ph" id="backPh">Back ID Photo</span>
      </div>
      <div class="pick-row">
        <label class="pick-btn pick-cam" for="backCamInput" id="uiCam2">📷 Camera</label>
        <label class="pick-btn pick-gal" for="backGalInput" id="uiGal2">🖼️ Gallery</label>
      </div>
      <input type="file" id="backCamInput" class="safe-file-input" accept="image/*" capture="environment" onchange="handleFilePick(event, 'back')" />
      <input type="file" id="backGalInput" class="safe-file-input" accept="image/*" onchange="handleFilePick(event, 'back')" />
    </div>
  </div>

  <!-- ENHANCEMENT & A4 COPY SETTINGS -->
  <div class="panel">
    <div class="ctrl-grid">
      <div class="ctrl-box">
        <label id="uiCopiesLbl">Copies on A4 Sheet</label>
        <select class="ctrl-select" id="copyCount" onchange="renderA4Sheet()">
          <option value="1">1 Set (Front + Back)</option>
          <option value="2">2 Sets (4 Cards)</option>
          <option value="4">4 Sets (Full A4)</option>
        </select>
      </div>

      <div class="ctrl-box">
        <label id="uiBorderLbl">Cutting Border</label>
        <select class="ctrl-select" id="borderStyle" onchange="renderA4Sheet()">
          <option value="dashed">Dashed Cut Line</option>
          <option value="solid">Solid Thin Border</option>
          <option value="none">No Border</option>
        </select>
      </div>

      <div class="ctrl-box">
        <label id="uiBrightLbl">Brightness: <span id="bVal">105</span>%</label>
        <input type="range" class="ctrl-range" id="brightRange" min="80" max="145" value="105" oninput="updateFilters()" />
      </div>

      <div class="ctrl-box">
        <label id="uiContLbl">Contrast: <span id="cVal">110</span>%</label>
        <input type="range" class="ctrl-range" id="contRange" min="80" max="150" value="110" oninput="updateFilters()" />
      </div>
    </div>
  </div>

  <!-- LIVE A4 SHEET PREVIEW -->
  <div class="a4-wrap">
    <div id="a4Sheet"></div>
  </div>

</div>

<!-- BOTTOM DOCK -->
<div class="bottom-dock">
  <button class="dock-btn" onclick="resetAll()" id="uiReset">🗑️ Reset</button>
  <button class="dock-btn primary" onclick="downloadA4Png()" id="uiSaveImg">🖼️ Save PNG</button>
  <button class="dock-btn success" onclick="downloadA4Pdf()" id="uiSavePdf">⬇️ A4 PDF</button>
</div>

<!-- SMART ID CROP MODAL -->
<div class="modal" id="cropModal">
  <div class="modal-box">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="font-size:0.95rem; color:#34d399;" id="uiCropTitle">✂️ Crop ID Card (85.6 × 54 mm)</h3>
      <button class="x-btn" onclick="closeCropModal()">✕</button>
    </div>
    <div class="crop-stage"><img id="cropTargetImg" /></div>
    <div class="crop-tools">
      <button class="m-btn" style="background:#1e293b; border:1px solid #334155;" onclick="rotateCrop(-90)">↺ Rotate Left</button>
      <button class="m-btn" style="background:#1e293b; border:1px solid #334155;" onclick="rotateCrop(90)">↻ Rotate Right</button>
    </div>
    <div style="display:flex; gap:8px;">
      <button class="m-btn" style="background:#334155;" onclick="closeCropModal()">Cancel</button>
      <button class="m-btn" style="background:linear-gradient(135deg,#059669,#10b981);" onclick="applyCroppedCard()">✓ Apply Card</button>
    </div>
  </div>
</div>

<!-- LANGUAGE PICKER MODAL -->
<div class="modal" id="langModal">
  <div class="modal-box">
    <div style="display:flex; justify-content:space-between; align-items:center;">
      <h3 style="font-size:0.96rem; color:#38bdf8;">Select Language</h3>
      <button class="x-btn" onclick="closeLangModal()">✕</button>
    </div>
    <div class="lang-list" id="langListGrid"></div>
  </div>
</div>

<script>
  const langs = [
    { code: "en", label: "English", native: "English", ui: { home: "← Home", title: "Smart ID Card Print", front: "1. Front Side", back: "2. Back Side", cam: "📷 Camera", gal: "🖼️ Gallery", copies: "Copies on A4 Sheet", border: "Cutting Border", reset: "🗑️ Reset", img: "🖼️ Save PNG", pdf: "⬇️ A4 PDF" } },
    { code: "hi", label: "Hindi", native: "हिन्दी", ui: { home: "← होम", title: "स्मार्ट ID कार्ड प्रिंट", front: "1. आगे का हिस्सा (Front)", back: "2. पीछे का हिस्सा (Back)", cam: "📷 कैमरा", gal: "🖼️ गैलरी", copies: "A4 पेज पर कॉपी", border: "कटिंग बॉर्डर", reset: "🗑️ रीसेट", img: "🖼️ PNG सेव", pdf: "⬇️ A4 PDF" } },
    { code: "bn", label: "Bengali", native: "বাংলা", ui: { home: "← হোম", title: "স্মার্ট ID কার্ড প্রিন্ট", front: "১. সামনের দিক (Front)", back: "২. পিছনের দিক (Back)", cam: "📷 ক্যামেরা", gal: "🖼️ গ্যালারি", copies: "A4 পেজে কপি", border: "কাটিং বর্ডার", reset: "🗑️ রিসেট", img: "🖼️ PNG সেভ", pdf: "⬇️ A4 PDF" } },
    { code: "mr", label: "Marathi", native: "मराठी", ui: { home: "← मुख्यपृष्ठ", title: "स्मार्ट ID कार्ड प्रिंट", front: "१. पुढील बाजू", back: "२. मागील बाजू", cam: "📷 कॅमेरा", gal: "🖼️ गॅलरी", copies: "A4 वर प्रती", border: "कटिंग बॉर्डर", reset: "🗑️ रीसेट", img: "🖼️ PNG सेव्ह", pdf: "⬇️ A4 PDF" } },
    { code: "gu", label: "Gujarati", native: "ગુજરાતી", ui: { home: "← હોમ", title: "સ્માર્ટ ID કાર્ડ પ્રિન્ટ", front: "૧. આગળની બાજુ", back: "૨. પાછળની બાજુ", cam: "📷 કેમેરા", gal: "🖼️ ગેલેરી", copies: "A4 પર કોપી", border: "કટિંગ બોર્ડર", reset: "🗑️ રીસેટ", img: "🖼️ PNG સેવ", pdf: "⬇️ A4 PDF" } },
    { code: "ta", label: "Tamil", native: "தமிழ்", ui: { home: "← முகப்பு", title: "ஸ்மார்ட் ID கார்டு பிரிண்ட்", front: "1. முன் பக்கம்", back: "2. பின் பக்கம்", cam: "📷 கேமரா", gal: "🖼️ கேலரி", copies: "A4 நகல்கள்", border: "வெட்டு கோடு", reset: "🗑️ மீட்டமை", img: "🖼️ PNG சேமி", pdf: "⬇️ A4 PDF" } },
    { code: "te", label: "Telugu", native: "తెలుగు", ui: { home: "← హోమ్", title: "స్మార్ట్ ID కార్డ్ ప్రింట్", front: "1. ముందు వైపు", back: "2. వెనుక వైపు", cam: "📷 కెమెరా", gal: "🖼️ గ్యాలరీ", copies: "A4 కాపీలు", border: "కటింగ్ బోర్డర్", reset: "🗑️ రీసెట్", img: "🖼️ PNG సేవ్", pdf: "⬇️ A4 PDF" } }
  ];

  let curLang = langs[0];
  let frontImgData = "";
  let backImgData = "";
  let activeSide = "front";
  let cropper = null;

  function openLangModal() {
    document.getElementById("langListGrid").innerHTML = langs.map(l => `
      <button class="lang-item ${l.code === curLang.code ? 'active' : ''}" onclick="setLang('${l.code}')">
        <span>${l.native}</span><span style="font-size:0.68rem;opacity:0.8;">${l.label}</span>
      </button>
    `).join("");
    document.getElementById("langModal").style.display = "flex";
  }
  function closeLangModal() { document.getElementById("langModal").style.display = "none"; }

  function setLang(code) {
    curLang = langs.find(l => l.code === code) || langs[0];
    document.getElementById("curLangCode").innerText = curLang.code.toUpperCase();
    const u = curLang.ui;
    document.getElementById("uiHome").innerText = u.home;
    document.getElementById("uiTitle").innerText = u.title;
    document.getElementById("uiFrontTitle").innerText = u.front;
    document.getElementById("uiBackTitle").innerText = u.back;
    document.getElementById("uiCam1").innerText = u.cam;
    document.getElementById("uiCam2").innerText = u.cam;
    document.getElementById("uiGal1").innerText = u.gal;
    document.getElementById("uiGal2").innerText = u.gal;
    document.getElementById("uiCopiesLbl").innerText = u.copies;
    document.getElementById("uiBorderLbl").innerText = u.border;
    document.getElementById("uiReset").innerText = u.reset;
    document.getElementById("uiSaveImg").innerText = u.img;
    document.getElementById("uiSavePdf").innerText = u.pdf;
    closeLangModal();
  }

  /* HANDLE CAMERA OR GALLERY IMAGE SELECTION */
  function handleFilePick(e, side) {
    const file = e.target.files && e.target.files[0];
    if (!file) return;
    activeSide = side;

    const reader = new FileReader();
    reader.onload = (ev) => {
      const target = document.getElementById("cropTargetImg");
      target.onload = () => {
        document.getElementById("cropModal").style.display = "flex";
        if (cropper) cropper.destroy();
        cropper = new Cropper(target, {
          aspectRatio: 85.6 / 54,
          viewMode: 1,
          autoCropArea: 0.92,
          responsive: true
        });
      };
      target.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    e.target.value = "";
  }

  function rotateCrop(deg) {
    if (cropper) cropper.rotate(deg);
  }

  function closeCropModal() {
    document.getElementById("cropModal").style.display = "none";
    if (cropper) {
      cropper.destroy();
      cropper = null;
    }
  }

  function applyCroppedCard() {
    if (!cropper) return;
    const canvas = cropper.getCroppedCanvas({ width: 1012, height: 638 });
    const dataUrl = canvas.toDataURL("image/jpeg", 0.95);

    if (activeSide === "front") {
      frontImgData = dataUrl;
      const thumb = document.getElementById("frontThumb");
      thumb.src = dataUrl;
      thumb.style.display = "block";
      document.getElementById("frontPh").style.display = "none";
    } else {
      backImgData = dataUrl;
      const thumb = document.getElementById("backThumb");
      thumb.src = dataUrl;
      thumb.style.display = "block";
      document.getElementById("backPh").style.display = "none";
    }
    closeCropModal();
    renderA4Sheet();
  }

  function updateFilters() {
    document.getElementById("bVal").innerText = document.getElementById("brightRange").value;
    document.getElementById("cVal").innerText = document.getElementById("contRange").value;
    renderA4Sheet();
  }

  function renderA4Sheet() {
    const copies = parseInt(document.getElementById("copyCount").value, 10) || 1;
    const borderType = document.getElementById("borderStyle").value;
    const bright = document.getElementById("brightRange").value;
    const cont = document.getElementById("contRange").value;
    const filterCss = `brightness(${bright}%) contrast(${cont}%)`;

    let borderCss = "1px dashed #94a3b8";
    if (borderType === "solid") borderCss = "1px solid #334155";
    if (borderType === "none") borderCss = "none";

    let html = "";
    for (let i = 0; i < copies; i++) {
      html += `<div class="card-pair-row">
        <div class="card-slot" style="border:${borderCss};">
          ${frontImgData ? `<img src="${frontImgData}" style="filter:${filterCss};" />` : `<span class="card-slot-empty">FRONT</span>`}
        </div>
        <div class="card-slot" style="border:${borderCss};">
          ${backImgData ? `<img src="${backImgData}" style="filter:${filterCss};" />` : `<span class="card-slot-empty">BACK</span>`}
        </div>
      </div>`;
    }
    document.getElementById("a4Sheet").innerHTML = html;
  }

  function resetAll() {
    frontImgData = "";
    backImgData = "";
    document.getElementById("frontThumb").style.display = "none";
    document.getElementById("frontPh").style.display = "block";
    document.getElementById("backThumb").style.display = "none";
    document.getElementById("backPh").style.display = "block";
    document.getElementById("brightRange").value = 105;
    document.getElementById("contRange").value = 110;
    updateFilters();
  }

  function downloadA4Pdf() {
    if (!frontImgData && !backImgData) {
      alert("Please upload Front or Back ID photo first.");
      return;
    }
    const sheet = document.getElementById("a4Sheet");
    html2pdf().set({
      margin: 4,
      filename: "Smart_ID_Card_A4.pdf",
      image: { type: "jpeg", quality: 0.98 },
      html2canvas: { scale: 2.5, useCORS: true },
      jsPDF: { unit: "mm", format: "a4", orientation: "portrait" }
    }).from(sheet).save();
  }

  function downloadA4Png() {
    if (!frontImgData && !backImgData) {
      alert("Please upload Front or Back ID photo first.");
      return;
    }
    html2canvas(document.getElementById("a4Sheet"), { scale: 2.5, useCORS: true }).then(canvas => {
      const a = document.createElement("a");
      a.href = canvas.toDataURL("image/png");
      a.download = "Smart_ID_Card_A4.png";
      a.click();
    });
  }

  renderA4Sheet();
</script>
</body>
</html>
