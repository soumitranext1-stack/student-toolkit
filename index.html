<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0f1a">
<title>Study Game</title>
<meta name="description" content="Student tools, study mini-games, daily leaderboard, glowing cosmetics store, world chat, and reward tasks.">
<meta property="og:title" content="Study Game">
<meta property="og:description" content="Student tools, study mini-games, daily leaderboard, glowing cosmetics store, world chat, and reward tasks.">
<meta property="og:type" content="website">
<meta name="twitter:card" content="summary_large_image">
<link rel="icon" type="image/svg+xml" href="favicon.svg?v=5">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap" rel="stylesheet">
<link rel="stylesheet" href="style.css?v=5">
<link rel="stylesheet" href="fx-pack.css?v=5">
</head>
<body>
<div id="app">
  <header>
    <div class="brand">
      <span class="brand-mark" aria-hidden="true">
        <svg viewBox="0 0 64 64" width="26" height="26" fill="none">
          <defs>
            <linearGradient id="hdrSgBg" x1="8" y1="6" x2="56" y2="58" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#4f6ef7"/>
              <stop offset="55%" stop-color="#6c7eff"/>
              <stop offset="100%" stop-color="#0ea5e9"/>
            </linearGradient>
            <linearGradient id="hdrSgGold" x1="20" y1="12" x2="44" y2="34" gradientUnits="userSpaceOnUse">
              <stop offset="0%" stop-color="#fef08a"/>
              <stop offset="100%" stop-color="#f59e0b"/>
            </linearGradient>
          </defs>
          <rect x="4" y="4" width="56" height="56" rx="16" fill="url(#hdrSgBg)"/>
          <rect x="5" y="5" width="54" height="54" rx="15" stroke="#ffffff" stroke-opacity="0.22" stroke-width="2"/>
          <path d="M16 40V25c0-1.5 1.4-2.6 2.9-2.1 4.7 1.5 9.2 3.4 13.1 6.1 3.9-2.7 8.4-4.6 13.1-6.1 1.5-.5 2.9.6 2.9 2.1v15c0 1.4-1.3 2.4-2.6 2-4.6-1.3-9.1-1-13.4 1.5-4.3-2.5-8.8-2.8-13.4-1.5-1.3.4-2.6-.6-2.6-2z" fill="#ffffff"/>
          <path d="M32 29v14.5" stroke="#4f6ef7" stroke-width="2.4" stroke-linecap="round"/>
          <path d="M32 10.5l2.5 5.4 5.9.7-4.4 4 1.2 5.8-5.2-2.9-5.2 2.9 1.2-5.8-4.4-4 5.9-.7 2.5-5.4z" fill="url(#hdrSgGold)"/>
        </svg>
      </span>
      <b>Study Game</b>
      <span id="st" class="st"><i></i><em>Local mode</em></span>
    </div>
    <div class="row" style="gap:6px">
      <span id="devBadge" class="tg p-tag-dev-sig" hidden>DEV</span>
      <button class="icon-btn" id="sfxBtn" title="Sound FX: On (tap to mute)" aria-label="Mute Sound FX" aria-pressed="false">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M11 5L6 9H2v6h4l5 4V5z"/><path d="M15.5 8.5a5 5 0 0 1 0 7"/><path d="M19 5.5a9.5 9.5 0 0 1 0 13"/></svg>
      </button>
      <button class="icon-btn" id="langBtn" title="Language" aria-label="Change language">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a14 14 0 0 1 0 18M12 3a14 14 0 0 0 0 18"/></svg>
        <span id="langCode">EN</span>
      </button>
      <button class="icon-btn" id="themeBtn" title="Toggle theme" aria-label="Toggle dark or light theme"></button>
      <span class="lvl-pill">LVL <span class="lvlval">1</span></span>
      <div class="coin">
        <svg viewBox="0 0 24 24" fill="none" aria-hidden="true"><circle cx="12" cy="12" r="9.5" fill="#ffd36b" stroke="#b45309" stroke-width="1.8"/><circle cx="12" cy="12" r="6" stroke="#92400e" stroke-width="1.3"/></svg>
        <span class="coinval">0</span>
      </div>
    </div>
  </header>

  <main>
    <section id="v-tools" class="view on">
      <div id="noticeBox" class="notice" hidden></div>
      <div class="row dev-only" style="justify-content:flex-end;margin-bottom:8px" hidden>
        <button class="btn sm" id="noticeBtn">Set Notice</button>
      </div>
      <div class="poster-track" id="posterTrack"></div>
      <h2 id="hHome" data-i="tools">Student Tools</h2>
      <div class="grid" id="toolGrid"></div>

      <div class="row" style="justify-content:space-between;margin:18px 0 10px">
        <h2 style="margin:0" data-i="poems">Poems &amp; Writing Wall</h2>
        <button class="btn sm" id="openPoemReqBtn" data-i="req">Request Poem</button>
      </div>
      <div class="list" id="poemList"></div>
    </section>

    <section id="v-games" class="view">
      <div class="row" style="justify-content:space-between;margin-bottom:10px;flex-wrap:wrap">
        <h2 style="margin:0" data-i="gamesH">Games Hub</h2>
        <div class="row" style="gap:6px">
          <button class="btn sm" id="mpCreateBtn" type="button">+ Live Room</button>
          <button class="btn gold sm" id="gamesGiftBtn" type="button">Send Gift</button>
        </div>
      </div>
      <div id="mpRoomsHost"></div>
      <div class="grid" id="gameSlotsGrid"></div>
    </section>

    <section id="v-ranking" class="view">
      <div class="row" style="justify-content:space-between;margin-bottom:10px;flex-wrap:wrap">
        <h2 style="margin:0" data-i="lb">Daily Leaderboard</h2>
        <div class="row dev-only" hidden>
          <button class="btn ghost sm" id="resetRewardsBtn">Reset Defaults</button>
          <button class="btn sm" id="addRewardBtn">+ Reward</button>
        </div>
      </div>
      <div id="podiumSection"></div>
      <div class="list" id="rankList"></div>
    </section>

    <section id="v-tasks" class="view">
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <h2 style="margin:0" data-i="d5">Daily 5 Tasks</h2>
        <button class="btn sm dev-only" id="addTaskBtn" hidden>+ Task</button>
      </div>
      <div class="list" id="taskList"></div>
    </section>

    <section id="v-store" class="view">
      <div class="row" style="justify-content:space-between;margin-bottom:10px">
        <h2 style="margin:0" data-i="storeH">Store</h2>
        <button class="btn sm dev-only" id="addStoreBtn" hidden>+ Item</button>
      </div>
      <div class="row wrap" id="storeTabs" style="margin-bottom:10px;gap:6px"></div>
      <div class="list" id="storeList"></div>
    </section>

    <section id="v-chat" class="view">
      <div class="row" style="justify-content:space-between;margin-bottom:12px">
        <h2 style="margin:0" data-i="msgs">Messages</h2>
        <div class="row">
          <button class="btn red sm dev-only" id="clearDevInboxBtn" hidden>Clear inbox</button>
          <button class="btn sm" id="findBtn" data-i="addf">Add friend</button>
        </div>
      </div>
      <div class="list" id="chatList"></div>
    </section>

    <section id="v-profile" class="view"></section>
  </main>

  <nav id="nav" aria-label="Primary navigation">
    <button data-tab="tools" class="on">
      <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 10.5L12 3l9 7.5"/><path d="M5 9.5V20h14V9.5"/><path d="M9.5 20v-6h5v6"/></svg></span>
      <em>Home</em>
    </button>
    <button data-tab="games">
      <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2.5" y="6" width="19" height="12" rx="4"/><path d="M7 12h4M9 10v4M15.5 11h.01M17.5 13h.01"/></svg></span>
      <em>Games</em>
    </button>
    <button data-tab="ranking">
      <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9H4a2 2 0 0 1 0-4h2"/><path d="M18 9h2a2 2 0 0 0 0-4h-2"/><path d="M4 21h16"/><path d="M10 15v6M14 15v6"/><path d="M18 3H6v6a6 6 0 0 0 12 0V3z"/></svg></span>
      <em>Rank</em>
    </button>
    <button data-tab="tasks">
      <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="3.5" width="17" height="17" rx="3.5"/><path d="M8.5 12.2l2.4 2.4 4.8-5"/></svg></span>
      <em>Tasks</em>
    </button>
    <button data-tab="store">
      <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M6 7h12l1 13H5L6 7z"/><path d="M9 7V5.5a3 3 0 0 1 6 0V7"/></svg></span>
      <em>Store</em>
    </button>
    <button data-tab="chat">
      <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z"/></svg></span>
      <span id="chatNavDot" class="nav-dot" hidden></span>
      <em>Chat</em>
    </button>
    <button data-tab="profile">
      <span class="nav-ico"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8.5" r="4"/><path d="M4.5 20.5c1.5-3.8 4.4-5.5 7.5-5.5s6 1.7 7.5 5.5"/></svg></span>
      <em>Profile</em>
    </button>
  </nav>

  <div id="thread" class="thread" hidden>
    <div class="thh" id="thHead"></div>
    <div class="msgs" id="msgs"></div>
    <div class="comp">
      <button class="btn ghost sm" id="chBtn" title="60s MCQ Duel" aria-label="Send 60s MCQ Duel">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1.5" fill="currentColor"/></svg>
      </button>
      <button class="btn gold sm" id="giftBtn" title="Send Gift" aria-label="Send Gift">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13"/><path d="M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C10 3 12 8 12 8s2-5 4.5-5a2.5 2.5 0 0 1 0 5"/></svg>
      </button>
      <button class="btn crimson sm dev-only" id="rpBtn" title="Send Developer Red Packet" aria-label="Send Developer Red Packet" hidden>
        <svg viewBox="0 0 24 24" fill="none"><rect x="4" y="2.5" width="16" height="19" rx="3" fill="#dc2626" stroke="#ffd36b" stroke-width="1.8"/><path d="M4 8.5c3 3 13 3 16 0" stroke="#ffd36b" stroke-width="1.6"/><circle cx="12" cy="11.5" r="2.6" fill="#ffd36b"/></svg>
      </button>
      <input id="msgIn" placeholder="Type a message" maxlength="500" autocomplete="off">
      <button class="btn" id="sendBtn">Send</button>
    </div>
  </div>
  <div id="modals"></div>
  <div id="banBox" class="ban-screen" hidden>
    <div class="card" style="max-width:380px;text-align:center">
      <h2 style="margin-bottom:6px;color:var(--bad)">Account Suspended</h2>
      <p style="color:var(--mu);font-size:14px">Your access has been restricted by Developer.</p>
      <p style="margin-top:10px;font-size:12px;color:var(--mu)">UID: <b id="banUid"></b></p>
      <button class="btn ghost full" id="banLogin">Login / Switch account</button>
    </div>
  </div>
</div>
<script src="sfx.js?v=5"></script>
<script src="fx-avatars.js?v=5"></script>
<script src="fx-frames.js?v=5"></script>
<script src="core.js?v=5"></script>
<script src="gifts.js?v=5"></script>
<script src="firebase.js?v=5"></script>
<script src="home.js?v=5"></script>
<script src="games.js?v=5"></script>
<script src="ranking.js?v=5"></script>
<script src="tasks.js?v=5"></script>
<script src="store.js?v=5"></script>
<script src="chat.js?v=5"></script>
<script src="profile.js?v=5"></script>
<script src="boot.js?v=5"></script>
</body>
</html>
