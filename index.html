<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0c0e1a">
<title>Study Game</title>
<style>
:root{--bg:#0c0e1a;--s1:#151930;--s2:#1c2140;--ln:#2a3159;--tx:#e9ecff;--mu:#8e95bf;--ac:#7b8cff;--coin:#ffc53d;--red:#ff4d6a;--gold:#ffd36b;--ok:#35e0b5}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:#070812;color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--ln);background:var(--s1)}
.brand{display:flex;flex-direction:column;gap:2px}.brand b{font-size:19px;letter-spacing:.3px}
.st{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mu)}.st i{width:7px;height:7px;border-radius:50%;background:#777}.st.on i{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.coin{background:#2b2410;border:1px solid #5a4716;color:var(--coin);padding:5px 11px;border-radius:99px;font-weight:700}
.lvl-pill{background:#1d2554;border:1px solid #4856a8;color:#b8c4ff;padding:4px 9px;border-radius:99px;font-size:12px;font-weight:800}
main{flex:1;overflow-y:auto;padding:14px 14px 96px}
.view{display:none}.view.on{display:block}
h2{font-size:18px;margin:2px 0 12px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:var(--s1);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;background:none;border:0;padding:9px 0 8px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:11px;cursor:pointer}
nav button span{font-size:19px}nav button.on{color:var(--ac)}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:14px}
.tool{cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:122px;text-decoration:none}
.tool .art{width:46px;height:46px;border-radius:14px;display:grid;place-items:center;background:linear-gradient(145deg,#222952,#131830);border:1px solid #394278}
.tool b{font-size:15px}.tool small{color:var(--mu)}
.tool:active{transform:scale(.98)}
.btn{background:var(--ac);color:#0b0e24;border:0;border-radius:12px;padding:11px 16px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--s2);color:var(--tx);border:1px solid var(--ln)}.btn.red{background:var(--red);color:#fff}.btn.ok{background:var(--ok);color:#06211a}.btn.full{width:100%;margin-top:10px}.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:7px 11px;font-size:12px;border-radius:10px}
.row{display:flex;align-items:center;gap:10px}.row.wrap{flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:10px}
.rk{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;cursor:pointer}.rk.me{border-color:var(--ac)}
.mid{flex:1;min-width:0}.mid b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mid small{color:var(--mu);font-size:12px}
.cn{color:var(--coin);font-weight:700;white-space:nowrap}

.podium-wrap{background:linear-gradient(160deg,#251647,#121733,#2c1638);border:1px solid #44397a;border-radius:20px;padding:14px 10px;margin-bottom:12px}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end}
.pod{background:linear-gradient(180deg,#1e2447,#12162c);border:1px solid #3a4378;border-radius:16px;padding:10px 6px;text-align:center;cursor:pointer}
.pod.p1{border-color:#ffd36b;box-shadow:0 0 18px #ffc53d44;transform:translateY(-6px)}
.pod.p2{border-color:#80d8ff}.pod.p3{border-color:#ff9e5e}
.pod .rk-pill{display:inline-block;font-size:11px;font-weight:900;padding:2px 8px;border-radius:99px;margin-bottom:4px;color:#151005}
.p1 .rk-pill{background:linear-gradient(90deg,#ffe27a,#f59e0b)}
.p2 .rk-pill{background:linear-gradient(90deg,#e0f2fe,#60a5fa)}
.p3 .rk-pill{background:linear-gradient(90deg,#ffedd5,#fb923c)}
.pod b{display:block;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:4px}
.pod .pts{font-size:12px;font-weight:800;color:var(--coin);margin-top:2px}
.rw-strip{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.rw-card{background:#12162d;border:1px solid #333b6e;border-radius:12px;padding:8px;text-align:center}
.rw-card .ico{font-size:18px;display:block}.rw-card small{display:block;color:var(--mu);font-size:11px}.rw-card b{color:var(--coin);font-size:12px}
.badge{width:34px;text-align:center;font-weight:800;color:var(--mu)}

.av-wrap{position:relative;display:inline-grid;place-items:center;flex:none;width:calc(var(--s) + 18px);height:calc(var(--s) + 18px)}
.av{width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;background:var(--s2);font-size:calc(var(--s)*.5);border:2px solid #343c68;position:relative;z-index:2;overflow:hidden}
.ring-svg{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.f-top-tag{position:absolute;top:-5px;left:50%;transform:translateX(-50%);z-index:4;font-size:9px;font-weight:900;padding:1px 6px;border-radius:99px;white-space:nowrap;border:1px solid #fff5}
.f-bot-tag{position:absolute;bottom:-4px;left:50%;transform:translateX(-50%);z-index:4;font-size:9px;font-weight:900;padding:1px 6px;border-radius:6px;white-space:nowrap}
.spin-cw{animation:cw 7s linear infinite;transform-origin:center}.spin-ccw{animation:ccw 9s linear infinite;transform-origin:center}.pulse-fx{animation:pf 1.8s ease-in-out infinite alternate;transform-origin:center}
@keyframes cw{to{transform:rotate(360deg)}}@keyframes ccw{to{transform:rotate(-360deg)}}@keyframes pf{from{transform:scale(.95)}to{transform:scale(1.05)}}

.bn-box{border-radius:16px;padding:14px;border:1px solid var(--ln);background:var(--s2);position:relative;overflow:hidden}
.bn-default{background:linear-gradient(135deg,#181e3b,#222952)}
.bn-aurora{background:linear-gradient(120deg,#0f3b3a,#1b2454,#143a52);background-size:200% 200%;animation:bgShift 5s ease infinite}
.bn-crimson{background:linear-gradient(120deg,#471224,#26133b,#59142b);background-size:200% 200%;animation:bgShift 4.5s ease infinite}
.bn-solar{background:linear-gradient(120deg,#472b0c,#2e1838,#5c360b);background-size:200% 200%;animation:bgShift 4.5s ease infinite}
.bn-galaxy{background:linear-gradient(120deg,#251147,#0d2b4f,#471238);background-size:220% 220%;animation:bgShift 5s ease infinite}
.bn-dev{background:linear-gradient(135deg,#40101f,#2c2108);border:1.5px solid var(--gold);box-shadow:0 0 18px #ff4d6a55}
@keyframes bgShift{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}

.anim-shine{background:linear-gradient(90deg,#ffffff,#ffd36b,#35e0b5,#ffffff);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:textFlow 3s linear infinite;text-shadow:0 0 14px #ffd36b55}
.anim-firetxt{background:linear-gradient(90deg,#ffea75,#ff6a1a,#ff264d,#ffea75);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:textFlow 2.2s linear infinite;text-shadow:0 0 14px #ff550066}
.anim-royal-txt{background:linear-gradient(90deg,#e1bee7,#82b1ff,#ffd180,#e1bee7);background-size:220% auto;-webkit-background-clip:text;background-clip:text;color:transparent!important;animation:textFlow 2.8s linear infinite;text-shadow:0 0 14px #a88bff66}
@keyframes textFlow{to{background-position:220% center}}

.bio-glow-gold{color:#fff4c2;text-shadow:0 0 10px #ffd36b99;border-left:3px solid #ffd36b;padding-left:8px}
.bio-glow-cyan{color:#c9fff6;text-shadow:0 0 10px #2ee6c599;border-left:3px solid #2ee6c5;padding-left:8px}
.bio-glow-rose{color:#ffd6e0;text-shadow:0 0 10px #ff4d6a99;border-left:3px solid #ff4d6a;padding-left:8px}

.tag-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.p-tag{font-size:11px;font-weight:800;padding:4px 9px;border-radius:99px;border:1px solid #ffffff3b;background:linear-gradient(135deg,#2a3263,#181d3b);color:#ffe89e;box-shadow:0 0 10px #7b8cff55}
.p-tag.gold{background:linear-gradient(90deg,#ffe27a,#f59e0b);color:#1a1204;box-shadow:0 0 12px #ffd36b88}
.p-tag.rose{background:linear-gradient(90deg,#ff4d6a,#a855f7);color:#fff;box-shadow:0 0 12px #ff4d6a88}
.p-tag.cyan{background:linear-gradient(90deg,#2ee6c5,#3b82f6);color:#061726;box-shadow:0 0 12px #2ee6c588}

.prod-stage{height:92px;border-radius:14px;display:flex;align-items:center;justify-content:center;gap:12px;margin-bottom:10px;border:1px solid #353f75;background:radial-gradient(circle at top,#242c5c,#11152b)}
.dot-on{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);box-shadow:0 0 8px var(--ok);margin-right:4px}
.dot-off{display:inline-block;width:8px;height:8px;border-radius:50%;background:#6e759c;margin-right:4px}
.task{display:flex;gap:12px;align-items:center}.task p{color:var(--mu);font-size:13px}.chip{color:var(--coin);font-weight:700;font-size:13px}
.exp-chip{color:#6ee7b7;font-weight:700;font-size:12px}
.dur-pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:#262d59;color:#a5b4fc;border:1px solid #3b4685}
.empty{color:var(--mu);text-align:center;padding:28px 10px}
label{display:block;color:var(--mu);font-size:12px;margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--s2);border:1px solid var(--ln);border-radius:11px;padding:10px 12px;font-size:16px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--ac)}
textarea{resize:vertical;min-height:70px}
.pick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.pick button{background:none;border:2px solid transparent;border-radius:12px;padding:3px;cursor:pointer;display:grid;place-items:center}
.pick button.on{border-color:var(--ac);background:var(--s2)}
.pf{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:6px}
.mb{position:fixed;inset:0;background:#000b;display:flex;align-items:flex-end;justify-content:center;z-index:60}
.sheet{width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;background:var(--s1);border-radius:20px 20px 0 0;border:1px solid var(--ln);animation:up .18s ease-out}
.sh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--ln)}.sh h3{font-size:17px}
.x{background:var(--s2);border:0;border-radius:50%;width:32px;height:32px;cursor:pointer}
.sb{padding:14px 16px calc(18px + env(safe-area-inset-bottom));overflow:auto}
@keyframes up{from{transform:translateY(30px);opacity:.4}}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--ln);background:var(--s2);cursor:pointer;font-size:13px}.tabs button.on{background:var(--ac);color:#0b0e24;font-weight:700}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:#fff;color:#10132b;padding:10px 16px;border-radius:99px;font-weight:600;z-index:90;max-width:90%;box-shadow:0 6px 24px #0008}

.ad{text-align:center}.adbox{height:150px;border-radius:14px;background:repeating-linear-gradient(45deg,#1c2140,#1c2140 12px,#222850 12px,#222850 24px);display:grid;place-content:center;gap:4px;font-size:19px;margin-bottom:12px}.bar{height:8px;background:var(--s2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:var(--coin);transition:width 1s linear}

.dev{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;cursor:pointer;background:linear-gradient(135deg,#40101f,#2c2108);border:1.5px solid var(--gold);box-shadow:0 0 18px #ff4d6a55;animation:glow 2.8s ease-in-out infinite alternate}
@keyframes glow{to{box-shadow:0 0 26px #ffd36b66,0 0 10px #ff4d6a88}}
.tags{display:flex;gap:6px;margin-top:3px;flex-wrap:wrap}
.tg{font-size:10px;font-weight:800;padding:2px 7px;border-radius:6px;letter-spacing:.4px}.tg.d{background:linear-gradient(90deg,var(--red),#c2185b);color:#fff}.tg.l{background:linear-gradient(90deg,#ffe27a,#f2a900);color:#1a1305}
.th{display:flex;align-items:center;gap:12px;padding:11px 12px;background:var(--s1);border:1px solid var(--ln);border-radius:14px;cursor:pointer}
.thread{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;max-width:520px;background:var(--bg);z-index:40;display:flex;flex-direction:column}
.thh{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:var(--s1);border-bottom:1px solid var(--ln)}
.thh.dv{background:linear-gradient(135deg,#40101f,#2c2108);border-bottom:1.5px solid var(--gold)}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{display:flex;flex-direction:column;max-width:82%}.m.out{align-self:flex-end;align-items:flex-end}.m.in{align-self:flex-start}
.bub{padding:9px 13px;border-radius:16px;word-break:break-word;white-space:pre-wrap}.m.out .bub{background:var(--ac);color:#0b0e24;border-bottom-right-radius:4px}.m.in .bub{background:var(--s2);border-bottom-left-radius:4px}
.bub.fire-border{background:linear-gradient(135deg,#2b0b12,#361608)!important;color:#fff3d6!important;border:2px solid #ff7b1c;box-shadow:0 0 12px #ff4500aa,0 0 22px #ff1e4266;animation:fireEdge 1.2s ease-in-out infinite alternate}
@keyframes fireEdge{0%{border-color:#ff8c1a;box-shadow:0 0 10px #ff550099}100%{border-color:#ffd23f;box-shadow:0 0 18px #ff3b00dd}}
.m time{font-size:10px;color:var(--mu);margin-top:2px}
.chal{background:linear-gradient(135deg,#251a52,#14284d);border:1px solid var(--ac);border-radius:16px;padding:12px;min-width:230px}
.chal b{display:block;margin-bottom:2px}.chal p{color:var(--mu);font-size:13px;margin-bottom:8px}.chal .rw{color:var(--coin);font-weight:700}
.comp{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--s1);border-top:1px solid var(--ln);align-items:center}
.comp input{flex:1}.comp .btn{padding:10px 14px}
.opt{display:block;width:100%;text-align:left;margin-top:8px;padding:12px;border-radius:12px;border:1px solid var(--ln);background:var(--s2);cursor:pointer}
.opt.ok{border-color:var(--ok);background:#12382f}.opt.bad{border-color:var(--red);background:#40141f}
.ban-screen{position:fixed;inset:0;background:#090a12;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><b>Study Game</b><span id="st" class="st"><i></i><em>Local mode</em></span></div>
    <div class="row">
      <span id="devBadge" class="tg l" hidden>DEV MODE</span>
      <span class="lvl-pill">LVL <span class="lvlval">1</span></span>
      <div class="coin">🪙 <span class="coinval">0</span></div>
    </div>
  </header>
  <main>
    <section id="v-tools" class="view on"><h2>Student tools</h2><div class="grid" id="toolGrid"></div></section>
    <section id="v-ranking" class="view">
      <div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">Leaderboard</h2><button class="btn sm dev-only" id="addRewardBtn" hidden>+ Reward</button></div>
      <div id="podiumSection"></div><div class="list" id="rankList"></div>
    </section>
    <section id="v-tasks" class="view">
      <div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">Daily 5 Tasks</h2><button class="btn sm dev-only" id="addTaskBtn" hidden>+ Task</button></div>
      <div class="list" id="taskList"></div>
    </section>
    <section id="v-store" class="view">
      <div class="row" style="justify-content:space-between;margin-bottom:10px"><h2 style="margin:0">Store (1D / 2D / 1W)</h2><button class="btn sm dev-only" id="addStoreBtn" hidden>+ Item</button></div>
      <div class="list" id="storeList"></div>
    </section>
    <section id="v-chat" class="view">
      <div class="row" style="justify-content:space-between;margin-bottom:12px"><h2 style="margin:0">Messages</h2>
        <div class="row"><button class="btn red sm dev-only" id="clearDevInboxBtn" hidden>Clear inbox</button><button class="btn sm" id="findBtn">Add friend</button></div>
      </div>
      <div class="list" id="chatList"></div>
    </section>
    <section id="v-profile" class="view"></section>
  </main>
  <nav id="nav">
    <button data-tab="tools" class="on"><span>🧰</span>Tools</button>
    <button data-tab="ranking"><span>🏆</span>Rank</button>
    <button data-tab="tasks"><span>✅</span>Tasks</button>
    <button data-tab="store"><span>🛍️</span>Store</button>
    <button data-tab="chat"><span>💬</span>Chat</button>
    <button data-tab="profile"><span>👤</span>Profile</button>
  </nav>
  <div id="thread" class="thread" hidden>
    <div class="thh" id="thHead"></div><div class="msgs" id="msgs"></div>
    <div class="comp"><button class="btn ghost" id="chBtn" title="60s MCQ Coin Duel">🎯</button><input id="msgIn" placeholder="Type a message" maxlength="500" autocomplete="off"><button class="btn" id="sendBtn">Send</button></div>
  </div>
  <div id="modals"></div>
  <div id="banBox" class="ban-screen" hidden>
    <div class="card" style="max-width:380px"><div style="font-size:42px;margin-bottom:8px">🚫</div><h2 style="margin-bottom:6px">Account Suspended</h2><p style="color:var(--mu);font-size:14px">Your access has been restricted by Developer.</p><p style="margin-top:10px;font-size:12px;color:var(--mu)">UID: <b id="banUid"></b></p></div>
  </div>
</div>

const ls={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch{return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch{}}};

function isDevAccount(u){
  return Boolean(u && (u.uid===DEV_UID || String(u.accountId||'').toLowerCase()===DEV_LOGIN_ID));
}

/* Strictly lock Developer avatar and 'dev' frame to Developer only */
function sanitizeUserAppearance(u){
  const copy={...u};
  if(!isDevAccount(copy)){
    if(copy.frame==='dev')copy.frame='none';
    if(copy.avatar===DEV_AVATAR)copy.avatar='🦊';
  }
  return copy;
}

function isUnlocked(key){
  if(key==='frame:dev')return devMode;
  if(devMode)return true;
  if(['frame:none','banner:bn-default','text:','bio:'].includes(key))return true;
  return Number(me.tempUnlocks[key]||0)>Date.now();
}
function cleanExpiredUnlocks(){
  let changed=false;
  for(const [k,exp] of Object.entries(me.tempUnlocks||{})){
    if(Number(exp)<=Date.now()){
      delete me.tempUnlocks[k];
      if(me.frame&&k==='frame:'+me.frame)me.frame='none';
      if(me.banner&&k==='banner:'+me.banner)me.banner='bn-default';
      if(me.textStyle&&k==='text:'+me.textStyle)me.textStyle='';
      if(me.bioStyle&&k==='bio:'+me.bioStyle)me.bioStyle='';
      changed=true;
    }
  }
  if(!devMode&&me.frame==='dev'){me.frame='none';changed=true}
  if(!devMode&&me.avatar===DEV_AVATAR){me.avatar='🦊';changed=true}
  if(changed)saveMe();
}

function getDaily5Tasks(){
  const d=today();
  const saved=ls.get('sg_daily5_'+d,null);
  if(Array.isArray(saved)&&saved.length>=5)return saved;
  const copy=[...FIXED_TASK_POOL];
  let seed=d.split('').reduce((a,c)=>a+c.charCodeAt(0),0);
  for(let i=copy.length-1;i>0;i--){
    seed=(seed*9301+49297)%233280;
    const j=Math.floor((seed/233280)*(i+1));
    [copy[i],copy[j]]=[copy[j],copy[i]];
  }
  const pick5=copy.slice(0,5);
  ls.set('sg_daily5_'+d,pick5);
  return pick5;
}

function checkThreeDayReferral(){
  if(me.accountType!=='account'||!me.referredBy||me.referralRewardClaimed)return;
  const uniqueDays=new Set(me.activeDays||[]);
  if(uniqueDays.size>=3){
    me.referralRewardClaimed=true;saveMe();
    const refTarget=allUsers().find(u=>getInviteCodeForUser(u)===me.referredBy);
    if(refTarget){
      const nv=(Number(refTarget.coins)||0)+50;
      const nexp=(Number(refTarget.exp)||0)+40;
      patchUser(refTarget.uid,{coins:nv,exp:nexp});
      dbOp(()=>F.setDoc(userRef(refTarget.uid),{coins:F.increment(50),exp:F.increment(40)},{merge:true}));
    }
    dbOp(()=>F.setDoc(userRef(uid),{referralRewardClaimed:true},{merge:true}));

  }
}

function formatDuration(sec){

  const h=Math.floor(s/3600),m=Math.floor((s%3600)/60);

}

function cleanupInactiveZeroFriendUsers(docList){
  if(!online||!db)return;
  const now=Date.now();
  docList.forEach(d=>{
    if(isDevAccount(d)||d.uid===uid)return;
    const fCount=Array.isArray(d.friends)?d.friends.length:0;
    const last=Number(d.lastSeen||d.createdAt||now);
    if(fCount===0 && (now-last)>=TEN_DAYS_MS){
      dbOp(()=>F.deleteDoc(F.doc(db,'users',d.uid)));
    }
  });
}

async function initFirebase(){
  try{
    const A=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const S=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    db=S.getFirestore(A.initializeApp(firebaseConfig));F=S;setStatus(true);

    S.getDoc(userRef(uid)).then(s=>{
      if(!s.exists()){
        return S.setDoc(userRef(uid),{
          ...base(),bio:me.bio,hobbies:me.hobbies,coins:me.coins,exp:me.exp,
          claimedByDay:me.claimedByDay,friends:me.friends,tempUnlocks:me.tempUnlocks,
          activeDays:me.activeDays,referredBy:me.referredBy,referralRewardClaimed:me.referralRewardClaimed,
          usageSec:me.usageSec,banned:false,createdAt:Date.now(),lastSeen:Date.now()
        });
      }
    }).catch(()=>setStatus(false));

    S.onSnapshot(S.collection(db,'users'),snap=>{
      const docs=snap.docs.map(d=>({uid:d.id,...d.data()}));
      cleanupInactiveZeroFriendUsers(docs);
      users=docs;ls.set('sg_users_cache',users);
      const m=users.find(u=>u.uid===uid);
      if(m){
        if(typeof m.coins==='number')me.coins=m.coins;
        if(typeof m.exp==='number')me.exp=m.exp;
        if(m.claimedByDay&&typeof m.claimedByDay==='object')me.claimedByDay={...me.claimedByDay,...m.claimedByDay};
        if(Array.isArray(m.friends))me.friends=m.friends;
        if(m.tempUnlocks&&typeof m.tempUnlocks==='object')me.tempUnlocks={...me.tempUnlocks,...m.tempUnlocks};
        if(typeof m.usageSec==='number'&&m.usageSec>me.usageSec)me.usageSec=m.usageSec;
        me.banned=!!m.banned;saveMe();checkBan();
      }
      setStatus(true);updateHud();renderAll();
    },()=>setStatus(false));

    S.onSnapshot(S.collection(db,'store_items'),snap=>{
      if(snap.docs.length){storeItems=snap.docs.map(d=>({id:d.id,...d.data()}));ls.set('sg_store_cache',storeItems)}
      setStatus(true);renderStore();
    },()=>setStatus(false));

    S.onSnapshot(S.collection(db,'rank_rewards'),snap=>{
      if(snap.docs.length){rankRewards=snap.docs.map(d=>({id:d.id,...d.data()}));ls.set('sg_rank_rewards',rankRewards)}
      setStatus(true);renderRanking();
    },()=>setStatus(false));

    S.onSnapshot(S.collection(db,'dev_inbox'),snap=>{
      const nextInbox={};
      snap.docs.forEach(d=>{nextInbox[d.id]={uid:d.id,...d.data()}});
      devInbox=nextInbox;ls.set('sg_dev_inbox',devInbox);
      setStatus(true);if(!cur)renderChats();
    },()=>setStatus(false));
  }catch(e){console.warn('Firebase offline fallback',e);setStatus(false)}
}

function modal(title,html,cls=''){
  const b=document.createElement('div');b.className='mb';
  b.innerHTML=`<div class="sheet ${cls}"><div class="sh"><h3>${title}</h3><button class="x" aria-label="Close">✕</button></div><div class="sb">${html}</div></div>`;
  $('#modals').appendChild(b);
  b.close=()=>{b.remove();b.onclose&&b.onclose()};
  $('.x',b).onclick=b.close;b.addEventListener('click',e=>{if(e.target===b)b.close()});return b;
}

function openRewardAd(onDone){
  const m=modal('Reward Ad',`<div class="ad"><div class="adbox">📺 Reward Ad<small>Watch to complete task / earn coins &amp; EXP</small></div><div class="bar"><i id="adb"></i></div><p id="adt">Ad ends in 15s</p><button class="btn ghost" id="adskip" disabled>Skip in 5s</button></div>`);
  let t=15;const bar=$('#adb',m);setTimeout(()=>bar.style.width='100%',50);bar.style.transitionDuration='15s';
  const iv=setInterval(()=>{
    t--;$('#adt',m).textContent=t>0?`Ad ends in ${t}s`:'Completed';
    const sk=$('#adskip',m);if(15-t>=5){sk.disabled=false;sk.textContent='Done'}else sk.textContent=`Skip in ${5-(15-t)}s`;
    if(t<=0){clearInterval(iv);bumpStat('ad_watch');m.close();onDone&&onDone()}
  },1000);
  $('#adskip',m).onclick=()=>{if($('#adskip',m).disabled)return;clearInterval(iv);bumpStat('ad_watch');m.close();onDone&&onDone()};
  m.onclose=()=>clearInterval(iv);
}

/* ---------- Fixed Daily 5 Tasks ---------- */
function checkRule(ruleCode){
  if(!ruleCode)return true;
  const [k,v]=String(ruleCode).split(':');const req=Number(v||1);
  if(k==='games_played')return (stats.games_played||0)>=req;
  if(k==='ad_watch')return (stats.ad_watch||0)>=req;
  if(k==='calc_open')return (stats.calc_open||0)>=req;
  if(k==='pdf_open')return (stats.pdf_open||0)>=req;
  if(k==='profile_save')return (stats.profile_save||0)>=req;
  if(k==='tool_open')return (stats.tool_open||0)>=req;
  return true;
}
function renderTasks(){
  tasks=getDaily5Tasks();
  const claimedToday=getClaimedToday();
  $('#taskList').innerHTML=tasks.map(t=>{
    const claimed=claimedToday.includes(t.id), met=checkRule(t.ruleCode);
    let label='Claim', cls='btn sm', dis=false;
    if(claimed){label='Claimed';cls='btn sm ghost';dis=true}
    else if(!met&&t.ruleCode==='ad_watch:1'){label='Watch Ad';cls='btn sm'}
    else if(!met){label='Locked';cls='btn sm ghost';dis=true}
    return `<div class="card task"><div class="mid"><b>${esc(t.title)}</b><p>${esc(t.description)}</p>
      <div class="row wrap" style="margin-top:4px"><span class="chip">+${num(t.reward)} 🪙</span><span class="exp-chip">+${num(t.exp||15)} EXP</span></div></div>
      <button class="${cls}" data-claim="${esc(t.id)}" ${dis?'disabled':''}>${label}</button></div>`;
  }).join('')||'';
}
$('#taskList').onclick=e=>{
  const id=e.target.dataset.claim;if(!id)return;
  const t=tasks.find(x=>x.id===id);
  if(!t||getClaimedToday().includes(id))return;
  if(t.ruleCode==='ad_watch:1'&&!checkRule(t.ruleCode)){
    openRewardAd(()=>{renderTasks();toast('Ad watched! Tap Claim')});return;
  }
  if(!checkRule(t.ruleCode))return;
  addReward(Number(t.reward)||0,Number(t.exp)||15,id);renderTasks();toast(`+${t.reward} coins & +${t.exp||15} EXP!`);
};

function itemPreviewHtml(it){
  if(it.kind==='frame')return `<div class="prod-stage">${av({avatar:'🔥',frame:it.value},54)}</div>`;
  if(it.kind==='banner')return `<div class="prod-stage"><div class="bn-box ${esc(it.value)}" style="padding:8px 18px;font-size:12px"><b>${esc(it.name)}</b></div></div>`;
  if(it.kind==='bio')return `<div class="prod-stage"><span class="${esc(it.value)}" style="font-size:14px;font-weight:700">Glowing Study Bio</span></div>`;
  return `<div class="prod-stage"><span class="${esc(it.value)}" style="font-size:20px;font-weight:800">${esc(it.name)}</span></div>`;
}
function renderStore(){
  cleanExpiredUnlocks();
  const activeItems=storeItems.filter(x=>x.active!==false&&x.value!=='dev');
  $('#storeList').innerHTML=activeItems.map(it=>{
    const key=`${it.kind}:${it.value||it.id}`;
    const activeExp=Number(me.tempUnlocks[key]||0);
    const isActive=activeExp>Date.now();
    const remHours=isActive?Math.max(1,Math.ceil((activeExp-Date.now())/3600000)):0;
    return `<div class="card">
      ${itemPreviewHtml(it)}
      <div class="row" style="justify-content:space-between;margin-bottom:4px"><b>${esc(it.name)}</b><span class="dur-pill">${isActive?`Active · ${remHours}h`:'Timed'}</span></div>
      <p style="color:var(--mu);font-size:13px;margin-bottom:4px">${esc(it.desc||'')}</p>
      ${it.tag?`<div style="margin-bottom:8px"><span class="p-tag gold">Tag: ${esc(it.tag)}</span></div>`:''}
      <div class="row wrap">${Object.entries(DURATIONS).map(([dk,dv])=>{
        const cost=Math.max(5,Math.round((it.basePrice||40)*dv.mult));
        return `<button class="btn sm ${isActive?'ghost':''}" data-buy="${esc(it.id)}" data-dur="${dk}" style="flex:1">${dv.label} · ${cost} 🪙</button>`;
      }).join('')}</div>
    </div>`;
  }).join('')||'<div class="empty">No items available.</div>';
}
$('#storeList').onclick=e=>{
  const btn=e.target.closest('[data-buy]');if(!btn)return;
  const it=storeItems.find(x=>x.id===btn.dataset.buy), dur=DURATIONS[btn.dataset.dur];
  if(!it||!dur)return;
  const cost=Math.max(5,Math.round((it.basePrice||40)*dur.mult));
  if(me.coins<cost)return toast('Not enough coins');
  me.coins-=cost;
  const key=`${it.kind}:${it.value||it.id}`;
  me.tempUnlocks[key]=Math.max(Date.now(),Number(me.tempUnlocks[key]||0))+dur.ms;
  if(it.tag&&!me.tags.includes(it.tag))me.tags.push(it.tag);
  if(it.kind==='frame'&&it.value!=='dev')me.frame=it.value;
  if(it.kind==='banner')me.banner=it.value;
  if(it.kind==='text')me.textStyle=it.value;
  if(it.kind==='bio')me.bioStyle=it.value;
  saveMe();patchUser(uid,{...base(),coins:me.coins,tempUnlocks:me.tempUnlocks});
  dbOp(()=>F.setDoc(userRef(uid),{...base(),coins:me.coins,tempUnlocks:me.tempUnlocks},{merge:true}));
  bumpStat('store_buy');updateHud();buildProfile();renderStore();renderRanking();
  toast(`${it.name} unlocked for ${dur.label}!`);
};

    const localAccs=ls.get('sg_local_accounts',{});

    let remoteAcc=null;
    if(online&&db){try{const snap=await F.getDoc(F.doc(db,'accounts',accUid));if(snap.exists())remoteAcc=snap.data()}catch{}}
    const existing=remoteAcc||localAccs[accUid];

    if(isReg){
      if(existing)return toast('ID already exists, tap Login');
      const rec={id:idClean,pass,uid:accUid,createdAt:Date.now()};
      localAccs[accUid]=rec;ls.set('sg_local_accounts',localAccs);
      dbOp(()=>F.setDoc(F.doc(db,'accounts',accUid),rec));
      uid=accUid;localStorage.setItem('sg_uid',uid);
      const cleanRef=refCode.trim().toUpperCase();
      me={...me,uid:accUid,name:me.name.startsWith('Guest ')?idClean.split('@')[0]:me.name,frame:me.frame==='dev'?'none':me.frame,avatar:me.avatar===DEV_AVATAR?'🦊':me.avatar,accountType:'account',accountId:idClean,referredBy:cleanRef||me.referredBy||'',activeDays:[...new Set([...(me.activeDays||[]),today()])]};
      devMode=false;saveMe();applyDevUI();checkThreeDayReferral();
      dbOp(()=>F.setDoc(userRef(uid),{...base(),bio:me.bio,hobbies:me.hobbies,coins:me.coins,exp:me.exp,claimedByDay:me.claimedByDay,friends:me.friends,tempUnlocks:me.tempUnlocks,activeDays:me.activeDays,referredBy:me.referredBy,referralRewardClaimed:me.referralRewardClaimed,usageSec:me.usageSec,lastSeen:Date.now()},{merge:true}));
      updateHud();buildProfile();renderAll();m.close();toast('Account registered');return;
    }

    if(!existing||existing.pass!==pass)return toast('Invalid ID or password');
    uid=accUid;localStorage.setItem('sg_uid',uid);
    let cloudProf=null;
    if(online&&db){try{const ps=await F.getDoc(userRef(accUid));if(ps.exists())cloudProf=ps.data()}catch{}}
    const cleanRef=refCode.trim().toUpperCase();
    me={...(cloudProf||me),uid:accUid,frame:(cloudProf?.frame==='dev')?'none':(cloudProf?.frame||me.frame),avatar:(cloudProf?.avatar===DEV_AVATAR)?'🦊':(cloudProf?.avatar||me.avatar),accountType:'account',accountId:idClean,referredBy:cleanRef||(cloudProf?.referredBy||me.referredBy||''),activeDays:[...new Set([...(cloudProf?.activeDays||me.activeDays||[]),today()])]};
    devMode=false;saveMe();applyDevUI();checkThreeDayReferral();
    updateHud();buildProfile();renderAll();m.close();toast('Logged in');
  };

  $('#auSubmit',m).onclick=()=>handleAuth($('#auId',m).value,$('#auPw',m).value,mode==='reg',$('#auRef',m).value);
  $('#auGuestSwitch',m).onclick=()=>{
    uid=guestUid;localStorage.setItem('sg_uid',uid);
    me.uid=uid;me.accountType='guest';me.accountId='';
    if(me.frame==='dev')me.frame='none';
    if(me.avatar===DEV_AVATAR)me.avatar='🦊';
    if(!me.name||me.name==='Developer')me.name='Guest '+guestUid.slice(-4);
    devMode=false;saveMe();applyDevUI();buildProfile();renderAll();m.close();toast('Switched to Guest ID');
  };
  if($('#auLogout',m)){
    $('#auLogout',m).onclick=()=>{
      uid=guestUid;localStorage.setItem('sg_uid',uid);
      me.uid=uid;me.accountType='guest';me.accountId='';
      if(me.frame==='dev')me.frame='none';
      if(me.avatar===DEV_AVATAR)me.avatar='🦊';
      if(me.name==='Developer')me.name='Guest '+guestUid.slice(-4);
      devMode=false;saveMe();applyDevUI();buildProfile();renderAll();m.close();toast('Logged out');
    };
  }
}

function startTimedDuel(msg){
  const g=DUEL_GAMES[msg.gi]||DUEL_GAMES[0];
  const betPerPlayer=20;
  if(me.coins<betPerPlayer)return toast(`Need ${betPerPlayer} coins to play`);
  if(msg.settled)return toast('Match already settled');

  addReward(-betPerPlayer, 0);
  msg.settled=true;
  saveChats();

  const totalPot=betPerPlayer*2; // 40
  const platformFee=4; // 4 coins Platform Fee
  const winnerPrize=totalPot-platformFee; // 36 coins

  let qIdx=0, score=0, secLeft=60, finished=false;
  const m=modal(`${g.icon} ${esc(g.name)} (60s)`,`
    <div class="row" style="justify-content:space-between;margin-bottom:8px">
      <span class="dur-pill">⏱ <b id="dTimer">60s</b></span>
      <span class="chip" id="dScore">Score: 0 pts</span>
    </div>
    <small style="color:var(--mu);display:block;margin-bottom:8px">Right: +4 pts · Wrong: -2 pts · Win: 36 🪙 (4 🪙 Platform Fee)</small>
    <div id="dBody"></div>
  `);

  const finishMatch=(reason)=>{
    if(finished)return;
    finished=true;
    clearInterval(iv);
    bumpStat('games_played');
    const oppScore=4;
    let summary='';
    if(score>oppScore){
      addReward(winnerPrize, 20);
      summary=`You Won (${score} vs ${oppScore} pts)! +${winnerPrize} coins awarded (4 coins Platform Fee).`;
      msg.state='won';
    }else if(score===oppScore){
      const tieRefund=18; // 20 - 2 platform fee share
      addReward(tieRefund, 8);
      summary=`Draw (${score} vs ${oppScore} pts)! Returned ${tieRefund} coins (Platform Fee applied).`;
      msg.state='tie';
    }else{
      summary=`You Lost (${score} vs ${oppScore} pts). ${reason||''}`;
      msg.state='lost';
    }
    saveChats();if(cur)renderThread();
    $('#dBody',m).innerHTML=`<div class="card" style="margin-top:8px"><b>Result</b><p style="color:var(--mu);margin-top:6px">${esc(summary)}</p></div>`;
  };

  const renderQ=()=>{
    if(finished)return;
    if(qIdx>=g.questions.length)return finishMatch('All questions completed.');
    const item=g.questions[qIdx];
    $('#dBody',m).innerHTML=`
      <p style="margin-bottom:8px"><b>Q${qIdx+1}. ${esc(item.q)}</b></p>
      ${item.o.map((opt,i)=>`<button class="opt" data-ans="${i}">${esc(opt)}</button>`).join('')}
    `;
    $$('[data-ans]',m).forEach(btn=>{
      btn.onclick=()=>{
        if(finished)return;
        const chosen=+btn.dataset.ans;
        if(chosen===item.a){score+=4;toast('+4 pts')}
        else{score-=2;toast('-2 pts')}
        $('#dScore',m).textContent=`Score: ${score} pts`;
        qIdx++;
        renderQ();
      };
    });
  };

  const iv=setInterval(()=>{
    if(finished)return clearInterval(iv);
    secLeft--;
    const tEl=$('#dTimer',m);
    if(tEl)tEl.textContent=secLeft+'s';
    if(secLeft<=0)finishMatch('Time up!');
  },1000);

  m.onclose=()=>{
    clearInterval(iv);
    if(!finished){
      finished=true;
      bumpStat('games_played');
      msg.state='lost';
      saveChats();if(cur)renderThread();
    }
  };

  renderQ();
}

function msgHtml(m,thread,isInboxThread){
  const out=isInboxThread?(m.from==='dev'):(m.from==='me');
  const tm=new Date(m.ts).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'});
  if(m.type==='duel'){
    const g=DUEL_GAMES[m.gi]||DUEL_GAMES[0];
    let actionBtn='';
    if(m.state==='won')actionBtn=`<b style="color:var(--ok)">✅ Won 36 🪙</b>`;
    else if(m.state==='lost'||m.state==='tie')actionBtn=`<span style="color:var(--mu);font-size:12px">Finished</span>`;
    else if(m.accepted)actionBtn=`<button class="btn sm" data-startduel="${m.id}">Start 60s Match</button>`;
    else actionBtn=`<button class="btn ok sm" data-acceptduel="${m.id}">Accept Challenge</button>`;

    return `<div class="m ${out?'out':'in'}"><div class="chal">
      <b>${g.icon} ${esc(g.name)} (60s)</b>
      <p>Bet: 20 + 20 🪙 · Win: <span class="rw">36 🪙</span> (4 🪙 Platform Fee)</p>
      <div class="row wrap">${actionBtn}<button class="btn ghost sm" data-shareapp="1">Share App</button></div>
    </div><time>${tm}</time></div>`;
  }
  const fireCls=((thread&&thread.dev&&(out||devMode))||isInboxThread)?' fire-border':'';
  return `<div class="m ${out?'out':'in'}"><div class="bub${fireCls}">${esc(m.text)}</div><time>${tm}</time></div>`;
}

  if(stId){
    const m=(t.messages||[]).find(x=>x.id===stId);
    if(m&&m.accepted&&!m.state&&!m.settled)startTimedDuel(m);
    return;
  }
  if(e.target.dataset.shareapp)shareAppLink();
};

function send(msg){
  const t=getActiveThread();if(!t)return;
  if(cur.startsWith('inbox:')){const targetId=cur.slice(6);t.messages=t.messages||[];t.messages.push({id:mid(),from:'dev',ts:Date.now(),type:'text',...msg});syncDevInboxToCloud(targetId,t);renderThread();return}
  if(t.directDev&&t.uid){t.messages=t.messages||[];const mObj={id:mid(),from:'dev',ts:Date.now(),type:'text',...msg};t.messages.push(mObj);saveChats();renderThread();const tu=allUsers().find(x=>x.uid===t.uid)||{uid:t.uid,name:t.name,avatar:'🙂',frame:'none'};const entry=devInbox[t.uid]||{uid:t.uid,name:tu.name,avatar:tu.avatar,frame:tu.frame,messages:[]};entry.messages.push(mObj);devInbox[t.uid]=entry;syncDevInboxToCloud(t.uid,entry);return}
  t.messages=t.messages||[];const mObj={id:mid(),from:'me',ts:Date.now(),type:'text',...msg};t.messages.push(mObj);saveChats();renderThread();
  if(t.dev){const entry=devInbox[uid]||{uid,name:me.name,avatar:me.avatar,frame:me.frame,messages:[]};entry.name=me.name;entry.avatar=me.avatar;entry.frame=me.frame;entry.messages.push({...mObj,from:'user'});devInbox[uid]=entry;syncDevInboxToCloud(uid,entry)}
}
function sendText(){const i=$('#msgIn'),v=i.value.trim();if(!v)return;i.value='';send({text:v})}
$('#sendBtn').onclick=sendText;$('#msgIn').onkeydown=e=>{if(e.key==='Enter')sendText()};
$('#chBtn').onclick=()=>openGamePicker(gi=>send({type:'duel',gi,accepted:false,settled:false,state:'new',text:'60s MCQ Duel'}));

$('#findBtn').onclick=()=>{
  const others=allUsers().filter(u=>u.uid!==uid && !isDevAccount(u));
  const m=modal('Add friend',`
    <label>Enter Friend UID</label><input id="fUid" placeholder="Enter Friend UID" autocomplete="off">
    <button class="btn full" id="fAddBtn">Add &amp; Open Chat</button>
    <label style="margin-top:14px">Players</label>
    <div class="list">${others.map(u=>`<div class="th" data-uprof="${esc(u.uid)}">${av(u,38)}<div class="mid"><b>${styledName(u)}</b><small>LVL ${calcLevel(u.exp)} · <span class="${isOnline(u)?'dot-on':'dot-off'}"></span>${esc(u.uid)}</small></div><button class="btn ${isFriend(u.uid)?'ghost':'sm'}" data-addf="${esc(u.uid)}">${isFriend(u.uid)?'Added':'Add'}</button></div>`).join('')||'<div class="empty">No other players yet.</div>'}
  `);
  const addAndOpen=(targetId)=>{
    targetId=targetId.trim().toUpperCase();
    if(!targetId||targetId===uid)return toast('Enter a valid friend UID');
    const found=allUsers().find(x=>x.uid.toUpperCase()===targetId);
    const id=found?found.uid:targetId;
    if(!isFriend(id)){me.friends.push(id);saveMe();patchUser(uid,{friends:me.friends})}
    if(!chats[id])chats[id]={id,name:found?found.name:id,uid:id,messages:[]};
    saveChats();m.close();renderChats();openThread(id);
  };
  $('#fAddBtn',m).onclick=()=>addAndOpen($('#fUid',m).value);
  m.onclick=e=>{
    const af=e.target.dataset.addf;
    if(af){toggleFriend(af);const u=allUsers().find(x=>x.uid===af);if(u&&!chats[af])chats[af]={id:af,name:u.name,uid:af,messages:[]};saveChats();m.close();$('#findBtn').click();return}
    const pr=e.target.closest('[data-uprof]');
    if(pr){m.close();openPublicProfile(pr.dataset.uprof)}
  };
};

$('#nav').onclick=e=>{
  const b=e.target.closest('[data-tab]');if(!b)return;
  $$('#nav button').forEach(x=>x.classList.toggle('on',x===b));
  $$('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+b.dataset.tab));
  $('main').scrollTop=0;
};
function renderAll(){renderRanking();renderTasks();renderStore();if(!cur)renderChats()}

function checkQueryParams(){
  const params=new URLSearchParams(location.search);
  const refParam=params.get('ref');
  if(refParam){me.referredBy=refParam.trim().toUpperCase();saveMe()}
}

applyDevUI();checkBan();renderTools();buildProfile();updateHud();renderAll();checkQueryParams();checkMidnightTop3();initFirebase();
</script>
</body>
