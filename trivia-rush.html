const CATS=['All','Science','History','Geography','India','GK'];
let cat='All',iv=0,nextTimer=0;

function drawNonRepeatingTrivia(category, count){
  const normCat=String(category||'All').trim().toLowerCase();
  const list=BANK.filter(x=>normCat==='all'||String(x.c||'').toLowerCase()===normCat);
  const storeKey='sg_seen_q_trivia_'+normCat;
  let seen=[];
  try{const raw=localStorage.getItem(storeKey);if(raw)seen=JSON.parse(raw)||[]}catch{}
  if(!Array.isArray(seen))seen=[];
  const seenSet=new Set(seen);
  const unseen=shuffle(list.filter(q=>!seenSet.has(q.id)));
  const picked=[];
  let nextSeen=[...seen];
  while(picked.length<count && unseen.length){
    const item=unseen.shift();
    picked.push(item);
    nextSeen.push(item.id);
  }
  if(picked.length<count){
    const pickedIds=new Set(picked.map(x=>x.id));
    const recentIds=new Set(seen.slice(-Math.min(count,Math.max(1,list.length-1))));
    const firstPool=shuffle(list.filter(q=>!pickedIds.has(q.id)&&!recentIds.has(q.id)));
    const restPool=shuffle(list.filter(q=>!pickedIds.has(q.id)&&recentIds.has(q.id)));
    const fresh=[...firstPool,...restPool];
    nextSeen=picked.map(x=>x.id);
    while(picked.length<count && fresh.length){
      const item=fresh.shift();
      picked.push(item);
      nextSeen.push(item.id);
    }
  }
  if(nextSeen.length>=list.length)nextSeen=picked.map(x=>x.id);
  try{localStorage.setItem(storeKey,JSON.stringify(nextSeen))}catch{}
  return picked;
}

function menu(){
  clearInterval(iv);clearTimeout(nextTimer);
  if(window.VoiceNarrator)window.VoiceNarrator.stop();
  cat='All';
  main.innerHTML=`<div class="card"><h3>🎓 Trivia Rush <span class="tag">FREE</span></h3>
    <p class="mu">10 rapid questions, 15s each. Smart non-repeating shuffle keeps every round fresh. Lifelines: ✂️ 50-50 &amp; ⏭ Skip.</p>
    <label>Category</label><div class="chips tr-cats" id="cat">${CATS.map(c=>`<button data-v="${c}" ${c==='All'?'class="on"':''}>${c}</button>`).join('')}</div>
    <p class="mu" style="margin-top:10px">🏆 Best: <b>${bestGet('tr_best')}</b></p>
    <button class="btn full" id="go">Start Quiz</button></div>`;
  pick('#cat',v=>cat=v);$('#go').onclick=play;
}

function play(){
  clearInterval(iv);clearTimeout(nextTimer);
  const pool=drawNonRepeatingTrivia(cat,10);
  let n=0,score=0,correct=0,use5050=false,useSkip=false;
  const ask=()=>{
    clearInterval(iv);clearTimeout(nextTimer);
    if(n>=pool.length)return finish();
    const q=pool[n];n++;
    const opts=shuffle([q.a,...q.w]);
    let lock=false;const t0=Date.now(),limit=15000;
    main.innerHTML=`<div class="hud"><span class="pill">Q ${n}/${pool.length}</span><span class="pill">${esc(q.c)}</span><span class="pill">Score ${score}</span></div>
      <div id="trVoiceHost">${window.VoiceNarrator?window.VoiceNarrator.renderBar('tr'):''}</div>
      <div class="tbar" id="tbar"><i id="tb"></i></div><div class="qbox sm" data-qid="${esc(q.id)}">${esc(q.q)}</div>
      <div id="o">${opts.map(o=>`<button class="opt" data-a="${esc(o)}">${esc(o)}</button>`).join('')}</div>
      <div class="row"><button class="btn ghost sm" style="flex:1" id="l1" ${use5050?'disabled':''}>✂️ 50-50</button><button class="btn ghost sm" style="flex:1" id="l2" ${useSkip?'disabled':''}>⏭ Skip</button></div><div class="fb" id="fb"></div>`;
    if(window.VoiceNarrator){
      window.VoiceNarrator.bindBar($('#trVoiceHost'));
      window.VoiceNarrator.speak({enText:q.q,hiSpoken:q.hi,bnSpoken:q.bn});
    }
    const settle=pickVal=>{
      if(lock)return;lock=true;clearInterval(iv);
      const left=Math.max(0,limit-(Date.now()-t0))/1000,ok=pickVal===q.a;
      if(ok){correct++;const p=10+Math.round(left);score+=p;if(typeof gkPlaySfx==='function')gkPlaySfx('good');$('#fb').textContent=`✅ Correct! +${p}`}
      else{if(typeof gkPlaySfx==='function')gkPlaySfx('bad');$('#fb').textContent=pickVal==null?'⏰ Time up!':'❌ Wrong'}
      $$('.opt').forEach(x=>{if(x.dataset.a===q.a)x.classList.add('good');else if(x.dataset.a===pickVal)x.classList.add('bad');else x.classList.add('off')});
      nextTimer=setTimeout(ask,1300);
    };
    $('#o').onclick=e=>{const b=e.target.closest('.opt');if(b)settle(b.dataset.a)};
    $('#l1').onclick=()=>{if(lock||use5050)return;use5050=true;$('#l1').disabled=true;shuffle($$('.opt').filter(x=>x.dataset.a!==q.a)).slice(0,2).forEach(x=>x.classList.add('off'))};
    $('#l2').onclick=()=>{if(lock||useSkip)return;useSkip=true;lock=true;clearInterval(iv);ask()};
    iv=setInterval(()=>{
      const left=Math.max(0,limit-(Date.now()-t0));
      const tb=$('#tb'), tbar=$('#tbar');
      if(tb)tb.style.width=(left/limit*100)+'%';
      if(tbar)tbar.classList.toggle('low',left<5000);
      if(left<=0)settle(null);
    },100);
  };
  async function finish(){
    clearInterval(iv);clearTimeout(nextTimer);
    if(window.VoiceNarrator)window.VoiceNarrator.stop();
    const nb=bestSet('tr_best',score);
    const r=await award('trivia',Math.floor(score/25),score/8);
    result({emoji:correct>=8?'🏆':'🎓',title:`Score: ${score}`,lines:[`${correct}/${pool.length} correct`,nb&&score>0?'🎉 New Best!':`Best: ${bestGet('tr_best')}`],r,again:play,menu});
  }
  ask();
}
window.addEventListener('pagehide',()=>{clearInterval(iv);clearTimeout(nextTimer);if(window.VoiceNarrator)window.VoiceNarrator.stop()});
menu();
</script>
