<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14182b">
<title>Study Game — Store</title>
<style>
:root{
  --bg:#121629;--s1:#1a203a;--s2:#232b4d;--ln:#34406e;
  --tx:#f2f5ff;--mu:#a6b0d6;--ac:#6c8cff;--coin:#ffc53d;
  --red:#ff4d6a;--gold:#ffd36b;--ok:#2dd4bf
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,sans-serif}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--ln);background:var(--s1);position:sticky;top:0;z-index:15}
.row{display:flex;align-items:center;gap:8px}.row.wrap{flex-wrap:wrap}
.coin{background:#2b2410;border:1px solid #5a4716;color:var(--coin);padding:5px 10px;border-radius:99px;font-weight:700;font-size:13px}
.lvl-pill{background:#1d2554;border:1px solid #4856a8;color:#b8c4ff;padding:4px 8px;border-radius:99px;font-size:12px;font-weight:800}
main{flex:1;padding:14px 14px 40px}
h2{font-size:18px;margin:0}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:14px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:9px 13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--s2);color:var(--tx);border:1px solid var(--ln)}.btn.red{background:var(--red);color:#fff}.btn.full{width:100%;margin-top:10px}
.btn.sm{padding:7px 10px;font-size:12px;border-radius:10px}
.chipbtn{background:var(--s2);border:1px solid var(--ln);border-radius:99px;padding:6px 12px;font-size:12px;cursor:pointer}
.chipbtn.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#storeTabs{overflow-x:auto;flex-wrap:nowrap!important;scrollbar-width:none;margin-bottom:12px}
#storeTabs button{flex:none}
.prod-stage{height:88px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;border:1px solid var(--ln);background:var(--s2)}
.dur-pill{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--s2);color:var(--ac);border:1px solid var(--ln)}

.av-wrap{position:relative;display:inline-grid;place-items:center;flex:none;width:calc(var(--s) + 18px);height:calc(var(--s) + 18px)}
.av{width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;background:var(--s2);font-size:calc(var(--s)*.48);border:2px solid var(--ln);position:relative;z-index:2;overflow:hidden}
.ring-svg{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.f-top-tag{position:absolute;top:-5px;left:50%;transform:translateX(-50%);z-index:4;font-size:8px;font-weight:900;padding:1px 6px;border-radius:99px;background:var(--gold);color:#1a1204;white-space:nowrap}
.spin-cw{animation:cw 7s linear infinite;transform-origin:center}.pulse-fx{animation:pf 1.6s ease-in-out infinite alternate;transform-origin:center}
@keyframes cw{to{transform:rotate(360deg)}}@keyframes pf{from{transform:scale(.95)}to{transform:scale(1.06)}}
.top1-glow-wrap .av{border:3px solid var(--gold)!important;box-shadow:0 0 18px var(--gold)!important}

.bn-box{border-radius:12px;padding:6px 14px;border:1px solid var(--ln);color:#fff;font-size:12px}
.bn-aurora{background:linear-gradient(120deg,#0f766e,#1d4ed8)}
.bn-crimson{background:linear-gradient(120deg,#be123c,#7e22ce)}
.bn-galaxy{background:linear-gradient(120deg,#3730a3,#0369a1,#6d28d9)}
.bn-solar{background:linear-gradient(120deg,#d97706,#be123c)}
.bn-emerald{background:linear-gradient(120deg,#059669,#0f766e)}
.bn-midnight{background:linear-gradient(120deg,#1e1b4b,#312e81)}
.bn-rose{background:linear-gradient(120deg,#e11d48,#9d174d)}
.bn-ocean{background:linear-gradient(120deg,#0e7490,#2563eb)}
.bn-sunrise{background:linear-gradient(120deg,#f59e0b,#ef4444)}
.bn-candy{background:linear-gradient(120deg,#ec4899,#8b5cf6)}

[class*="anim-"][class$="-txt"],.bio-gold,.bio-cyan,.bio-pink,.bio-rainbow{-webkit-background-clip:text;background-clip:text;color:transparent!important;font-weight:800}
.anim-firetxt{background-image:linear-gradient(90deg,#ffd43b,#ff6b6b,#ffa94d)}
.anim-royal-txt{background-image:linear-gradient(90deg,#74c0fc,#b197fc,#ffd43b)}
.anim-neon-txt{background-image:linear-gradient(90deg,#2dd4bf,#60a5fa,#e879f9)}
.anim-gold-txt{background-image:linear-gradient(90deg,#fff3bf,#ffd43b,#f59f00)}
.anim-ice-txt{background-image:linear-gradient(90deg,#e3fafc,#66d9e8,#339af0)}
.anim-berry-txt{background-image:linear-gradient(90deg,#fcc2d7,#f783ac,#cc5de8)}
.anim-mint-txt{background-image:linear-gradient(90deg,#c3fae8,#63e6be,#20c997)}
.anim-sunset-txt{background-image:linear-gradient(90deg,#ffe8cc,#ffa94d,#ff6b6b)}
.anim-lava-txt{background-image:linear-gradient(90deg,#ff922b,#e03131,#ffd43b)}
.anim-aqua-txt{background-image:linear-gradient(90deg,#99e9f2,#22b8cf,#4dabf7)}
.bio-gold{background-image:linear-gradient(90deg,#fff3bf,#ffd43b,#f59f00)}
.bio-cyan{background-image:linear-gradient(90deg,#c3fae8,#2dd4bf,#60a5fa)}
.bio-pink{background-image:linear-gradient(90deg,#fcc2d7,#f06595,#cc5de8)}
.bio-rainbow{background-image:linear-gradient(90deg,#ff6b6b,#ffd43b,#51cf66,#339af0,#cc5de8)}

.bub{padding:8px 12px;border-radius:14px;background:var(--s1);font-size:12px}
.msg-glow-gold{border:1.5px solid var(--gold)!important;box-shadow:0 0 10px #ffd36b66!important}
.msg-glow-cyan{border:1.5px solid var(--ok)!important;box-shadow:0 0 10px #2dd4bf66!important}
.msg-glow-rose{border:1.5px solid var(--red)!important;box-shadow:0 0 10px #ff4d6a66!important}
.msg-glow-violet{border:1.5px solid #a855f7!important;box-shadow:0 0 10px #a855f766!important}
.msg-glow-green{border:1.5px solid #51cf66!important;box-shadow:0 0 10px #51cf6666!important}
.msg-glow-orange{border:1.5px solid #ff922b!important;box-shadow:0 0 10px #ff922b66!important}
.p-tag{font-size:13px;font-weight:800;padding:4px 12px;border-radius:99px;background:var(--s1);border:1px solid var(--ln)}

label{display:block;color:var(--mu);font-size:12px;margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--s2);border:1px solid var(--ln);border-radius:11px;padding:9px 12px;font-size:15px;outline:none}
.mb{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:80}
.sheet{width:100%;max-width:520px;max-height:90vh;display:flex;flex-direction:column;background:var(--s1);border-radius:20px 20px 0 0;border:1px solid var(--ln)}
.sh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--ln)}.sh h3{font-size:16px}
.x{background:var(--s2);border:0;border-radius:50%;width:30px;height:30px;cursor:pointer}
.sb{padding:14px 16px 24px;overflow:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#111;padding:9px 15px;border-radius:99px;font-weight:700;z-index:120}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="row">
      <button class="btn ghost sm" id="backHomeBtn">← Home</button>
      <h2>Store</h2>
    </div>
    <div class="row">
      <span class="lvl-pill">LVL <span id="lvlVal">1</span></span>
      <div class="coin">🪙 <span id="coinVal">0</span></div>
      <button class="btn sm dev-only" id="addItemBtn" hidden>+ Item</button>
    </div>
  </header>
  <main>
    <div class="row" id="storeTabs"></div>
    <div class="list" id="storeList"></div>
  </main>
  <div id="modals"></div>
</div>

<script type="module">
import {
  ls, esc, today, fmtNum, calcLevel, getGuestUid, getActiveUid,
  isDevAccount, normalizeProfile, openCleanPage, createDbClient
} from "./firebase-init.js";

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function toast(t) {
  $$(".toast").forEach(x => x.remove());
  const e = document.createElement("div");
  e.className = "toast"; e.textContent = t;
  document.body.appendChild(e); setTimeout(() => e.remove(), 2200);
}

const guestUid = getGuestUid();
const uid = getActiveUid();
let me = normalizeProfile(ls.get("sg_profile_" + uid, null), uid, guestUid);
let devMode = isDevAccount(me);
const saveMe = () => ls.set("sg_profile_" + uid, me);

const DURATIONS = {
  "1d": { label: "1 Day", ms: 86400000, mult: 1 },
  "2d": { label: "2 Days", ms: 172800000, mult: 1.8 },
  "1w": { label: "1 Week", ms: 604800000, mult: 4.5 }
};

const DEFAULT_ITEMS = [
  { id: "frame_top1_glow", name: "No.1 Glowing Avatar + Crown", kind: "frame", value: "top1_glow", basePrice: 85, desc: "Golden halo + crown for #1 look" },
  { id: "frame_flame", name: "Fire Ring", kind: "frame", value: "flame", basePrice: 40, desc: "Animated fire ring" },
  { id: "frame_wings", name: "Royal Wings", kind: "frame", value: "wings", basePrice: 55, desc: "Animated golden wings" },
  { id: "frame_crown", name: "Crown Halo", kind: "frame", value: "crown", basePrice: 65, desc: "Golden crown border" },
  { id: "frame_star", name: "Starlight Ring", kind: "frame", value: "star", basePrice: 45, desc: "Sparkling star ring" },
  { id: "frame_neon", name: "Neon Pulse Ring", kind: "frame", value: "neon", basePrice: 50, desc: "Pulsing neon ring" },
  { id: "banner_bn-aurora", name: "Aurora Banner", kind: "banner", value: "bn-aurora", basePrice: 40, desc: "Teal-blue animated banner" },
  { id: "banner_bn-crimson", name: "Crimson Banner", kind: "banner", value: "bn-crimson", basePrice: 45, desc: "Crimson-violet banner" },
  { id: "banner_bn-galaxy", name: "Galaxy Banner", kind: "banner", value: "bn-galaxy", basePrice: 50, desc: "Cosmic galaxy banner" },
  { id: "banner_bn-solar", name: "Solar Banner", kind: "banner", value: "bn-solar", basePrice: 48, desc: "Warm solar banner" },
  { id: "banner_bn-emerald", name: "Emerald Banner", kind: "banner", value: "bn-emerald", basePrice: 48, desc: "Emerald study banner" },
  { id: "banner_bn-ocean", name: "Ocean Banner", kind: "banner", value: "bn-ocean", basePrice: 46, desc: "Ocean wave banner" },
  { id: "text_anim-firetxt", name: "Fire Glow Text", kind: "text", value: "anim-firetxt", basePrice: 55, desc: "Glowing fire name" },
  { id: "text_anim-royal-txt", name: "Royal Glow Text", kind: "text", value: "anim-royal-txt", basePrice: 50, desc: "Glowing royal name" },
  { id: "text_anim-neon-txt", name: "Neon Glow Text", kind: "text", value: "anim-neon-txt", basePrice: 50, desc: "Glowing neon name" },
  { id: "text_anim-gold-txt", name: "Gold Glow Text", kind: "text", value: "anim-gold-txt", basePrice: 52, desc: "Shining gold name" },
  { id: "text_anim-ice-txt", name: "Ice Glow Text", kind: "text", value: "anim-ice-txt", basePrice: 46, desc: "Cool ice-blue name" },
  { id: "text_anim-berry-txt", name: "Berry Glow Text", kind: "text", value: "anim-berry-txt", basePrice: 48, desc: "Berry pink-violet name" },
  { id: "bio_bio-gold", name: "Gold Bio Glow", kind: "bio", value: "bio-gold", basePrice: 42, desc: "Glowing gold bio" },
  { id: "bio_bio-cyan", name: "Cyan Bio Glow", kind: "bio", value: "bio-cyan", basePrice: 42, desc: "Glowing cyan bio" },
  { id: "bio_bio-rainbow", name: "Rainbow Bio Glow", kind: "bio", value: "bio-rainbow", basePrice: 52, desc: "Rainbow bio glow" },
  { id: "msg_msg-glow-gold", name: "Gold Message Border", kind: "msg", value: "msg-glow-gold", basePrice: 45, desc: "Gold chat bubble glow" },
  { id: "msg_msg-glow-cyan", name: "Cyan Message Border", kind: "msg", value: "msg-glow-cyan", basePrice: 45, desc: "Cyan chat bubble glow" },
  { id: "msg_msg-glow-rose", name: "Rose Message Border", kind: "msg", value: "msg-glow-rose", basePrice: 48, desc: "Rose chat bubble glow" },
  { id: "tag_Study Boy", name: "Study Boy", kind: "tag", value: "Study Boy", basePrice: 25, desc: "Profile tag" },
  { id: "tag_Study Girl", name: "Study Girl", kind: "tag", value: "Study Girl", basePrice: 25, desc: "Profile tag" },
  { id: "tag_School Topper", name: "School Topper", kind: "tag", value: "School Topper", basePrice: 40, desc: "Profile tag" },
  { id: "tag_Top Challenger", name: "Top Challenger", kind: "tag", value: "Top Challenger", basePrice: 40, desc: "Profile tag" }
];

let customItems = ls.get("sg_store_custom", []);
let items = [...DEFAULT_ITEMS, ...customItems];
let activeCat = "all";
const CATS = [["all", "All"], ["frame", "Frames"], ["banner", "Banners"], ["text", "Name Glow"], ["bio", "Bio Glow"], ["msg", "Msg Glow"], ["tag", "Tags"]];

function frameSvg(fr) {
  if (fr === "top1_glow") return `<svg class="ring-svg pulse-fx" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="#ffd36b" stroke-width="3.6" stroke-dasharray="18 6"/><polygon points="34,12 42,2 50,10 58,2 66,12 61,18 39,18" fill="#ffd36b" stroke="#78350f" stroke-width="1.4"/></svg><span class="f-top-tag">NO.1</span>`;
  if (fr === "flame") return `<svg class="ring-svg spin-cw" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="#ff6a1a" stroke-width="3.4" stroke-dasharray="14 8"/></svg><span class="f-top-tag" style="background:#ff5500;color:#fff">FIRE</span>`;
  if (fr === "wings") return `<svg class="ring-svg pulse-fx" viewBox="0 0 100 100"><path d="M16 52 C2 35, 5 18, 22 25 C14 35, 16 44, 22 48" fill="#ffd54f"/><path d="M84 52 C98 35, 95 18, 78 25 C86 35, 84 44, 78 48" fill="#ffd54f"/><circle cx="50" cy="50" r="45" fill="none" stroke="#a88bff" stroke-width="2.6" stroke-dasharray="9 6"/></svg>`;
  if (fr === "crown") return `<svg class="ring-svg spin-cw" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="#ffd36b" stroke-width="3.4"/><polygon points="36,12 43,4 50,11 57,4 64,12 60,18 40,18" fill="#ffd36b" stroke="#78350f" stroke-width="1.2"/></svg>`;
  if (fr === "star") return `<svg class="ring-svg spin-cw" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="#f472b6" stroke-width="3" stroke-dasharray="3 9"/></svg>`;
  if (fr === "neon") return `<svg class="ring-svg pulse-fx" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="#2dd4bf" stroke-width="3.6"/><circle cx="50" cy="50" r="42" fill="none" stroke="#e879f9" stroke-width="1.6" stroke-dasharray="6 5"/></svg>`;
  return "";
}

function av(avatar, frame, s = 52) {
  return `<div class="av-wrap ${frame === "top1_glow" ? "top1-glow-wrap" : ""}" style="--s:${s}px">${frameSvg(frame)}<div class="av"><span>${esc(avatar)}</span></div></div>`;
}

function itemPreview(it) {
  if (it.kind === "frame") return av("🦊", it.value, 52);
  if (it.kind === "banner") return `<div class="bn-box ${esc(it.value)}"><b>${esc(it.name)}</b></div>`;
  if (it.kind === "msg") return `<div class="bub ${esc(it.value)}">Glow message</div>`;
  if (it.kind === "bio") return `<span class="${esc(it.value)}" style="font-size:13px">Glowing bio text ✨</span>`;
  if (it.kind === "tag") return `<span class="p-tag">${esc(it.value)}</span>`;
  return `<span class="${esc(it.value)}" style="font-size:18px">${esc(it.name)}</span>`;
}

const itemKey = it => `${it.kind}:${it.value || it.id}`;

function updateHud() {
  $("#coinVal").textContent = fmtNum(me.coins);
  $("#lvlVal").textContent = calcLevel(me.exp);
  $$(".dev-only").forEach(el => { el.hidden = !devMode; });
}

function renderStore() {
  updateHud();
  $("#storeTabs").innerHTML = CATS.map(c => `<button class="chipbtn ${c[0] === activeCat ? "on" : ""}" data-cat="${c[0]}">${c[1]}</button>`).join("");
  const list = items.filter(it => activeCat === "all" || it.kind === activeCat);
  $("#storeList").innerHTML = list.map(it => {
    const exp = Number(me.tempUnlocks[itemKey(it)] || 0);
    const isAct = exp > Date.now();
    return `<div class="card">
      <div class="prod-stage">${itemPreview(it)}</div>
      <div class="row" style="justify-content:space-between"><b>${esc(it.name)}</b><span class="dur-pill">${isAct ? Math.max(1, Math.ceil((exp - Date.now()) / 3600000)) + "h left" : "Timed"}</span></div>
      <p style="color:var(--mu);font-size:12px;margin:4px 0 8px">${esc(it.desc || "")}</p>
      <div class="row wrap">${Object.entries(DURATIONS).map(([dk, dv]) => {
        const cost = Math.max(5, Math.round((it.basePrice || 40) * dv.mult));
        return `<button class="btn sm ${isAct ? "ghost" : ""}" data-buy="${esc(it.id)}" data-dur="${dk}" style="flex:1">${dv.label} · ${fmtNum(cost)} 🪙</button>`;
      }).join("")}</div>
      ${devMode && String(it.id).startsWith("c_") ? `<button class="btn red sm" style="margin-top:8px" data-del="${esc(it.id)}">Delete</button>` : ""}
    </div>`;
  }).join("");
}

function modal(title, html) {
  const b = document.createElement("div"); b.className = "mb";
  b.innerHTML = `<div class="sheet"><div class="sh"><h3>${title}</h3><button class="x">✕</button></div><div class="sb">${html}</div></div>`;
  $("#modals").appendChild(b);
  b.close = () => b.remove();
  $(".x", b).onclick = b.close;
  b.addEventListener("click", e => { if (e.target === b) b.close(); });
  return b;
}

const client = createDbClient();
function dbOp(fn) {
  if (!client.ready || !client.db) return;
  try { Promise.resolve(fn()).catch(() => {}); } catch {}
}

$("#backHomeBtn").onclick = () => openCleanPage("index.html", "tools");
$("#storeTabs").onclick = e => {
  const c = e.target.dataset.cat;
  if (c) { activeCat = c; renderStore(); }
};

$("#storeList").onclick = e => {
  const del = e.target.dataset.del;
  if (del && devMode) {
    customItems = customItems.filter(x => x.id !== del);
    ls.set("sg_store_custom", customItems);
    items = [...DEFAULT_ITEMS, ...customItems];
    dbOp(() => client.deleteDoc(client.docRef("store_items", del)));
    renderStore(); return;
  }
  const btn = e.target.closest("[data-buy]"); if (!btn) return;
  const it = items.find(x => x.id === btn.dataset.buy);
  const dur = DURATIONS[btn.dataset.dur];
  if (!it || !dur) return;
  const cost = Math.max(5, Math.round((it.basePrice || 40) * dur.mult));
  if (me.coins < cost) return toast("Not enough coins");

  me.coins -= cost;
  const key = itemKey(it);
  me.tempUnlocks[key] = Math.max(Date.now(), Number(me.tempUnlocks[key] || 0)) + dur.ms;
  if (it.kind === "frame" && it.value !== "dev") me.frame = it.value;
  if (it.kind === "banner") me.banner = it.value;
  if (it.kind === "text") me.textStyle = it.value;
  if (it.kind === "bio") me.bioStyle = it.value;
  if (it.kind === "msg") me.msgStyle = it.value;
  if (it.kind === "tag") me.tags = [...me.tags.filter(t => t !== it.value && !["Guest Pass", "Newbie"].includes(t)), it.value].slice(-3);

  saveMe();
  dbOp(() => client.setDoc(client.docRef("users", uid), {
    coins: me.coins, frame: me.frame, banner: me.banner,
    textStyle: me.textStyle, bioStyle: me.bioStyle, msgStyle: me.msgStyle,
    tags: me.tags, tempUnlocks: me.tempUnlocks, lastSeen: Date.now()
  }, { merge: true }));
  renderStore();
  toast(`${it.name} (${dur.label})`);
};

$("#addItemBtn").onclick = () => {
  const m = modal("Add Store Item", `
    <label>Kind</label><select id="siK"><option>frame</option><option>banner</option><option>text</option><option>bio</option><option>msg</option><option>tag</option></select>
    <label>Name</label><input id="siN" maxlength="40">
    <label>Value / Class / Tag</label><input id="siV" maxlength="80">
    <label>1 Day Price</label><input id="siP" type="number" value="40">
    <button class="btn full" id="siS">Save Item</button>
  `);
  $("#siS", m).onclick = () => {
    const name = $("#siN", m).value.trim(), val = $("#siV", m).value.trim();
    if (!name || !val) return toast("Enter name and value");
    const newIt = { id: "c_" + Date.now().toString(36), name, kind: $("#siK", m).value, value: val, basePrice: Math.max(5, +$("#siP", m).value || 40), desc: "Custom timed item" };
    customItems.push(newIt); ls.set("sg_store_custom", customItems);
    items = [...DEFAULT_ITEMS, ...customItems];
    dbOp(() => client.setDoc(client.docRef("store_items", newIt.id), newIt));
    m.close(); renderStore(); toast("Item added");
  };
};

if (client.ready) {
  client.onSnapshot(client.docRef("users", uid), snap => {
    if (!snap.exists()) return;
    me = normalizeProfile({ ...me, ...snap.data() }, uid, guestUid);
    devMode = isDevAccount(me);
    saveMe(); renderStore();
  }, () => {});
  client.onSnapshot(client.col("store_items"), snap => {
    customItems = snap.docs.map(d => ({ id: d.id, ...d.data() })).filter(c => !DEFAULT_ITEMS.some(x => x.id === c.id));
    ls.set("sg_store_custom", customItems);
    items = [...DEFAULT_ITEMS, ...customItems];
    renderStore();
  }, () => {});
}

renderStore();
</script>
</body>
