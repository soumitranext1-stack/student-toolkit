<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>AI Passport Studio</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/selfie_segmentation.js" crossorigin="anonymous"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, -apple-system, sans-serif; }
    body { background: #090d16; color: #f8fafc; padding-bottom: 40px; }

    .topbar {
      background: #131b2e; padding: 14px 16px; display: flex; align-items: center; gap: 12px;
      border-bottom: 1px solid #1e293b; position: sticky; top: 0; z-index: 50;
    }
    .back-btn {
      background: #1e293b; color: #fff; border: none; padding: 8px 14px; border-radius: 10px;
      font-weight: 700; cursor: pointer;
    }
    .topbar h1 { font-size: 1.05rem; font-weight: 800; }

    .container { max-width: 520px; margin: 0 auto; padding: 14px; }
    .card {
      background: #131b2e; border: 1px solid #1e293b; border-radius: 18px; padding: 16px; margin-bottom: 14px;
    }
    .step-badge {
      background: linear-gradient(90deg, #2563eb, #7c3aed); color: #fff; font-size: 0.72rem;
      font-weight: 800; padding: 4px 10px; border-radius: 20px; display: inline-block; margin-bottom: 8px;
    }
    h2 { font-size: 1.05rem; margin-bottom: 6px; }
    p.sub { font-size: 0.8rem; color: #94a3b8; margin-bottom: 12px; }

    .upload-label {
      display: block; border: 2px dashed #3b82f6; border-radius: 14px; padding: 24px 14px;
      text-align: center; background: rgba(37, 99, 235, 0.1); cursor: pointer;
    }
    .btn {
      width: 100%; padding: 13px; border: none; border-radius: 12px; font-weight: 800;
      font-size: 0.92rem; cursor: pointer; color: #fff; background: linear-gradient(135deg, #2563eb, #4f46e5);
      margin-top: 8px;
    }
    .btn-green { background: linear-gradient(135deg, #059669, #10b981); }
    .btn-dark { background: #1e293b; border: 1px solid #334155; }

    .crop-container { width: 100%; max-height: 320px; overflow: hidden; border-radius: 12px; background: #000; margin-bottom: 12px; }
    .crop-container img { max-width: 100%; display: block; }

    .colors { display: flex; gap: 12px; margin: 10px 0 14px; }
    .swatch {
      width: 40px; height: 40px; border-radius: 50%; border: 3px solid #334155; cursor: pointer;
    }
    .swatch.active { border-color: #38bdf8; transform: scale(1.12); }

    /* Single Passport Big Preview */
    .single-preview-box {
      background: #090d16; border: 1px solid #334155; border-radius: 14px; padding: 16px;
      text-align: center; margin: 10px 0;
    }
    .single-preview-box img {
      width: 210px; height: 270px; object-fit: cover; border-radius: 8px;
      border: 3px solid #fff; box-shadow: 0 8px 24px rgba(0,0,0,0.5);
    }

    .row { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin: 10px 0; }
    select {
      width: 100%; padding: 10px; border-radius: 10px; background: #090d16; color: #fff;
      border: 1px solid #334155; font-size: 0.88rem;
    }
    .sheet-preview img { width: 100%; border-radius: 8px; margin-top: 10px; background: #fff; }
  </style>
</head>
<body>

<div class="topbar">
  <button class="back-btn" onclick="location.href='index.html'">← Home</button>
  <h1>AI Passport Photo Studio</h1>
</div>

<div class="container">

  <!-- STEP 1: UPLOAD -->
  <div class="card">
    <span class="step-badge">STEP 1 • SELECT PHOTO</span>
    <h2>Upload Selfie or Camera Photo</h2>
    <p class="sub">Apni gallery se photo chunein</p>
    <label for="fileIn" class="upload-label">
      <div style="font-size:2rem; margin-bottom:6px;">📸</div>
      <strong>Tap Here to Choose Photo</strong>
    </label>
    <input type="file" id="fileIn" accept="image/*" style="display:none;" />
  </div>

  <!-- STEP 2: FACE CROP -->
  <div class="card" id="step2Card" style="display:none;">
    <span class="step-badge">STEP 2 • SET FACE & CROP</span>
    <h2>Chehre ko Box mein Set Karein</h2>
    <div class="crop-container">
      <img id="cropImg" />
    </div>
    <button class="btn" id="aiBtn" onclick="runGoogleAiBgRemove()">✨ Remove Background & Create Passport</button>
  </div>

  <!-- STEP 3: SINGLE PASSPORT RESULT + SAVE -->
  <div class="card" id="step3Card" style="display:none;">
    <span class="step-badge">STEP 3 • YOUR PASSPORT PHOTO</span>
    <h2>Background Color Chunein & Save Karein</h2>
    
    <div class="colors">
      <div class="swatch active" style="background:#ffffff;" onclick="changeBg('#ffffff', this)"></div>
      <div class="swatch" style="background:#38bdf8;" onclick="changeBg('#38bdf8', this)"></div>
      <div class="swatch" style="background:#1d4ed8;" onclick="changeBg('#1d4ed8', this)"></div>
      <div class="swatch" style="background:#e2e8f0;" onclick="changeBg('#e2e8f0', this)"></div>
      <div class="swatch" style="background:#dc2626;" onclick="changeBg('#dc2626', this)"></div>
    </div>

    <div class="single-preview-box">
      <img id="singleOutImg" />
      <p style="font-size:0.78rem; color:#94a3b8; margin-top:8px;">Standard Passport Size (3.5 x 4.5 cm HD)</p>
    </div>

    <button class="btn btn-green" onclick="downloadSinglePhoto()">⬇️ Save Single Passport Photo (JPG)</button>
    <button class="btn btn-dark" onclick="toggleSheetBox()">🖨️ Print Multiple Copies on A4 Sheet (Optional)</button>

    <!-- OPTIONAL A4 SHEET -->
    <div id="a4Section" style="display:none; margin-top:14px; border-top:1px solid #334155; padding-top:12px;">
      <div class="row">
        <select id="copyCount" onchange="renderA4Sheet()">
          <option value="1">1 Photo on A4</option>
          <option value="4">4 Photos</option>
          <option value="8" selected>8 Photos</option>
          <option value="12">12 Photos</option>
        </select>
        <select id="borderOpt" onchange="renderA4Sheet()">
          <option value="yes">Black Border</option>
          <option value="no">No Border</option>
        </select>
      </div>
      <div class="sheet-preview"><img id="finalSheetImg" /></div>
      <button class="btn" onclick="downloadA4Pdf()">Download Print PDF</button>
    </div>
  </div>

</div>

<script>
  let cropper = null;
  let selectedBg = "#ffffff";
  let lastSegResults = null;
  let singlePassportUrl = "";
  let finalSheetUrl = "";

  // Initialize Google MediaPipe Selfie Segmentation
  const selfieSegmentation = new SelfieSegmentation({
    locateFile: (file) => `https://cdn.jsdelivr.net/npm/@mediapipe/selfie_segmentation/${file}`
  });
  selfieSegmentation.setOptions({ modelSelection: 1 });
  selfieSegmentation.onResults((results) => {
    lastSegResults = results;
    drawSinglePassport();
    document.getElementById("step3Card").style.display = "block";
    document.getElementById("step3Card").scrollIntoView({ behavior: "smooth" });
    document.getElementById("aiBtn").innerText = "✨ Remove Background & Create Passport";
    document.getElementById("aiBtn").disabled = false;
  });

  document.getElementById("fileIn").addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      const img = document.getElementById("cropImg");
      img.onload = function() {
        document.getElementById("step2Card").style.display = "block";
        document.getElementById("step3Card").style.display = "none";
        if (cropper) cropper.destroy();
        cropper = new Cropper(img, {
          aspectRatio: 3.5 / 4.5,
          viewMode: 1,
          autoCropArea: 0.85
        });
        document.getElementById("step2Card").scrollIntoView({ behavior: "smooth" });
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
  });

  async function runGoogleAiBgRemove() {
    if (!cropper) return;
    const btn = document.getElementById("aiBtn");
    btn.innerText = "⏳ AI Background Remove kar raha hai...";
    btn.disabled = true;

    const croppedCanvas = cropper.getCroppedCanvas({ width: 413, height: 531 });
    await selfieSegmentation.send({ image: croppedCanvas });
  }

  function changeBg(color, el) {
    selectedBg = color;
    document.querySelectorAll(".swatch").forEach(s => s.classList.remove("active"));
    el.classList.add("active");
    if (lastSegResults) {
      drawSinglePassport();
      if (document.getElementById("a4Section").style.display === "block") renderA4Sheet();
    }
  }

  function drawSinglePassport() {
    const c = document.createElement("canvas");
    c.width = 413; c.height = 531;
    const ctx = c.getContext("2d");

    // 1. Draw only person using AI mask
    ctx.save();
    ctx.drawImage(lastSegResults.segmentationMask, 0, 0, c.width, c.height);
    ctx.globalCompositeOperation = "source-in";
    ctx.drawImage(lastSegResults.image, 0, 0, c.width, c.height);

    // 2. Fill solid passport background behind person
    ctx.globalCompositeOperation = "destination-over";
    ctx.fillStyle = selectedBg;
    ctx.fillRect(0, 0, c.width, c.height);
    ctx.restore();

    singlePassportUrl = c.toDataURL("image/jpeg", 0.95);
    document.getElementById("singleOutImg").src = singlePassportUrl;
  }

  function downloadSinglePhoto() {
    const a = document.createElement("a");
    a.href = singlePassportUrl;
    a.download = "Passport_Photo.jpg";
    a.click();
  }

  function toggleSheetBox() {
    const box = document.getElementById("a4Section");
    box.style.display = box.style.display === "none" ? "block" : "none";
    if (box.style.display === "block") renderA4Sheet();
  }

  function renderA4Sheet() {
    const img = new Image();
    img.onload = () => {
      const a4 = document.createElement("canvas");
      a4.width = 1240; a4.height = 1754;
      const ctx = a4.getContext("2d");
      ctx.fillStyle = "#ffffff";
      ctx.fillRect(0, 0, a4.width, a4.height);

      const copies = parseInt(document.getElementById("copyCount").value);
      const hasBorder = document.getElementById("borderOpt").value === "yes";
      const cols = Math.min(4, copies);
      const rows = Math.ceil(copies / 4);
      const pw = 245, ph = 315, gap = 42;
      const startX = 95, startY = 80;

      let count = 0;
      for (let r = 0; r < rows; r++) {
        for (let c = 0; c < cols; c++) {
          if (count >= copies) break;
          const x = startX + c * (pw + gap);
          const y = startY + r * (ph + gap);
          ctx.drawImage(img, x, y, pw, ph);
          if (hasBorder) {
            ctx.strokeStyle = "#000000";
            ctx.lineWidth = 3;
            ctx.strokeRect(x, y, pw, ph);
          }
          count++;
        }
      }
      finalSheetUrl = a4.toDataURL("image/jpeg", 0.94);
      document.getElementById("finalSheetImg").src = finalSheetUrl;
    };
    img.src = singlePassportUrl;
  }

  function downloadA4Pdf() {
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF("p", "mm", "a4");
    pdf.addImage(finalSheetUrl, "JPEG", 0, 0, 210, 297);
    pdf.save("Passport_Print_A4.pdf");
  }
</script>
</body>
</html>
