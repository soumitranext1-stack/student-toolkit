<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14182b">
<title>Study Game — Games Hub</title>
<style>
:root{
  --bg:#121629;--s1:#1a203a;--s2:#232b4d;--ln:#34406e;
  --tx:#f2f5ff;--mu:#a6b0d6;--ac:#6c8cff;--coin:#ffc53d;--ok:#2dd4bf
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,sans-serif}
button{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--ln);background:var(--s1);position:sticky;top:0;z-index:15}
.row{display:flex;align-items:center;gap:8px}
.coin{background:#2b2410;border:1px solid #5a4716;color:var(--coin);padding:5px 10px;border-radius:99px;font-weight:700;font-size:13px}
.lvl-pill{background:#1d2554;border:1px solid #4856a8;color:#b8c4ff;padding:4px 8px;border-radius:99px;font-size:12px;font-weight:800}
main{flex:1;padding:14px 14px 40px}
h2{font-size:18px;margin:0}
.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:14px}
.tool{cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:118px;text-align:left}
.tool .art{width:42px;height:42px;border-radius:12px;display:grid;place-items:center;background:var(--s2);border:1px solid var(--ln);font-size:20px}
.tool b{font-size:14px;color:var(--ac)}.tool small{color:var(--mu);font-size:12px}
.tool:active{transform:scale(.98)}
.dur-pill{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:#0f766e33;color:var(--ok);border:1px solid var(--ok);align-self:flex-start}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:9px 13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--s2);color:var(--tx);border:1px solid var(--ln)}
.btn.sm{padding:7px 10px;font-size:12px;border-radius:10px}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="row">
      <button class="btn ghost sm" id="backHomeBtn">← Home</button>
      <h2>Games Hub</h2>
    </div>
    <div class="row">
      <span class="lvl-pill">LVL <span id="lvlVal">1</span></span>
      <div class="coin">🪙 <span id="coinVal">0</span></div>
    </div>
  </header>
  <main>
    <div class="grid" id="gamesGrid"></div>
  </main>
</div>

<script type="module">
import {
  ls, esc, fmtNum, calcLevel, getGuestUid, getActiveUid,
  normalizeProfile, openCleanPage
} from "./firebase-init.js";

const $ = (s, r = document) => r.querySelector(s);
const guestUid = getGuestUid();
const uid = getActiveUid();
const me = normalizeProfile(ls.get("sg_profile_" + uid, null), uid, guestUid);

const HUB_GAMES = [
  ["Chess Blitz", "♟️", "Smart board tactics", "chess-blitz.html"],
  ["Speed Math", "⚡", "Fast mental calculation", "speed-math.html"],
  ["Brain Puzzle", "🧩", "Logic & sequence quiz", "brain-puzzle.html"],
  ["Word Duel", "🔤", "Vocabulary & spelling", "word-duel.html"],
  ["Trivia Rush", "🎓", "General study quiz", "trivia-rush.html"]
];

function renderGames() {
  $("#coinVal").textContent = fmtNum(me.coins);
  $("#lvlVal").textContent = calcLevel(me.exp);

  const cards = HUB_GAMES.map(g => `
    <button class="card tool" data-href="${esc(g[3])}">
      <div class="art">${g[1]}</div>
      <b>${esc(g[0])}</b>
      <small>${esc(g[2])}</small>
      <span class="dur-pill">Play Now</span>
    </button>
  `).join("");

  const duelCard = `
    <button class="card tool" id="duelChatBtn" style="border-color:var(--ac)">
      <div class="art">🎯</div>
      <b>60s MCQ Duel</b>
      <small>Challenge friends in chat</small>
      <span class="dur-pill">Chat Duel</span>
    </button>
  `;

  $("#gamesGrid").innerHTML = cards + duelCard;
}

$("#backHomeBtn").onclick = () => openCleanPage("index.html", "games");
$("#gamesGrid").onclick = e => {
  if (e.target.closest("#duelChatBtn")) {
    openCleanPage("chat.html", "games");
    return;
  }
  const btn = e.target.closest("[data-href]");
  if (btn && btn.dataset.href) openCleanPage(btn.dataset.href, "games");
};

renderGames();
</script>
</body>
</html>
