<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14182b">
<title>Study Game — Tasks</title>
<style>
:root{
  --bg:#121629;--s1:#1a203a;--s2:#232b4d;--ln:#34406e;
  --tx:#f2f5ff;--mu:#a6b0d6;--ac:#6c8cff;--coin:#ffc53d;
  --red:#ff4d6a;--gold:#ffd36b;--ok:#2dd4bf
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,sans-serif}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--ln);background:var(--s1);position:sticky;top:0;z-index:15}
.row{display:flex;align-items:center;gap:8px}.row.wrap{flex-wrap:wrap}
.coin{background:#2b2410;border:1px solid #5a4716;color:var(--coin);padding:5px 10px;border-radius:99px;font-weight:700;font-size:13px}
.lvl-pill{background:#1d2554;border:1px solid #4856a8;color:#b8c4ff;padding:4px 8px;border-radius:99px;font-size:12px;font-weight:800}
main{flex:1;padding:14px 14px 40px}
h2{font-size:18px;margin:0}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:14px}
.task{display:flex;gap:12px;align-items:center}.task p{color:var(--mu);font-size:12px;margin-top:2px}
.mid{flex:1;min-width:0}.mid b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip{color:var(--coin);font-weight:700;font-size:12px}.exp-chip{color:var(--ok);font-weight:700;font-size:12px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:9px 13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--s2);color:var(--tx);border:1px solid var(--ln)}.btn.red{background:var(--red);color:#fff}.btn.full{width:100%;margin-top:10px}.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:7px 10px;font-size:12px;border-radius:10px}
label{display:block;color:var(--mu);font-size:12px;margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--s2);border:1px solid var(--ln);border-radius:11px;padding:9px 12px;font-size:15px;outline:none}
textarea{resize:vertical;min-height:60px}
.mb{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:80}
.sheet{width:100%;max-width:520px;max-height:90vh;display:flex;flex-direction:column;background:var(--s1);border-radius:20px 20px 0 0;border:1px solid var(--ln)}
.sh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--ln)}.sh h3{font-size:16px}
.x{background:var(--s2);border:0;border-radius:50%;width:30px;height:30px;cursor:pointer}
.sb{padding:14px 16px 24px;overflow:auto}
.ad{text-align:center}.adbox{height:130px;border-radius:14px;background:var(--s2);border:1px solid var(--ln);display:grid;place-content:center;gap:4px;font-size:17px;margin-bottom:10px}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#111;padding:9px 15px;border-radius:99px;font-weight:700;z-index:120}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="row">
      <button class="btn ghost sm" id="backHomeBtn">← Home</button>
      <h2>Daily 5 Tasks</h2>
    </div>
    <div class="row">
      <span class="lvl-pill">LVL <span id="lvlVal">1</span></span>
      <div class="coin">🪙 <span id="coinVal">0</span></div>
      <button class="btn sm dev-only" id="addTaskBtn" hidden>+ Task</button>
    </div>
  </header>
  <main>
    <div class="list" id="taskList"></div>
  </main>
  <div id="modals"></div>
</div>

<script type="module">
import {
  ls, esc, today, fmtNum, calcLevel, getGuestUid, getActiveUid,
  isDevAccount, normalizeProfile, openCleanPage, createDbClient
} from "./firebase-init.js";

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function toast(t) {
  $$(".toast").forEach(x => x.remove());
  const e = document.createElement("div"); e.className = "toast"; e.textContent = t;
  document.body.appendChild(e); setTimeout(() => e.remove(), 2200);
}

const guestUid = getGuestUid();
const uid = getActiveUid();
let me = normalizeProfile(ls.get("sg_profile_" + uid, null), uid, guestUid);
let devMode = isDevAccount(me);
const saveMe = () => ls.set("sg_profile_" + uid, me);

let stats = { calc_open: 0, pdf_open: 0, tool_open: 0, profile_save: 0, games_played: 0, store_buy: 0, ad_watch: 0, ...ls.get("sg_stats_" + uid, {}) };
const saveStats = () => ls.set("sg_stats_" + uid, stats);

const FIXED_TASK_POOL = [
  { id: "fx1", title: "25-Min Math Sprint", description: "Open calculators.html and practice math.", reward: 25, exp: 20, ruleCode: "calc_open:1" },
  { id: "fx2", title: "PDF Notes Organizer", description: "Open pdf-tools.html for study files.", reward: 20, exp: 15, ruleCode: "pdf_open:1" },
  { id: "fx3", title: "Study Duel Winner", description: "Play 1 60s MCQ coin duel in chat.", reward: 30, exp: 25, ruleCode: "games_played:1" },
  { id: "fx4", title: "Double Duel Challenge", description: "Play 2 60s MCQ coin duels today.", reward: 40, exp: 35, ruleCode: "games_played:2" },
  { id: "fx5", title: "Profile Shine Update", description: "Save your profile bio or style.", reward: 15, exp: 15, ruleCode: "profile_save:1" },
  { id: "fx6", title: "Reward Ad Boost", description: "Watch a reward ad for bonus coins & EXP.", reward: 25, exp: 20, ruleCode: "ad_watch:1" },
  { id: "fx7", title: "Resume & ID Prep", description: "Open resume-builder.html.", reward: 20, exp: 15, ruleCode: "tool_open:1" },
  { id: "fx8", title: "Handwriting Practice", description: "Open handwriting.html for notes.", reward: 20, exp: 15, ruleCode: "tool_open:1" }
];

function getDaily5Tasks() {
  const d = today(), saved = ls.get("sg_daily5_" + d, null);
  if (Array.isArray(saved) && saved.length >= 5) return saved;
  const copy = [...FIXED_TASK_POOL];
  let seed = d.split("").reduce((a, c) => a + c.charCodeAt(0), 0);
  for (let i = copy.length - 1; i > 0; i--) {
    seed = (seed * 9301 + 49297) % 233280;
    const j = Math.floor((seed / 233280) * (i + 1));
    [copy[i], copy[j]] = [copy[j], copy[i]];
  }
  const pick5 = copy.slice(0, 5);
  ls.set("sg_daily5_" + d, pick5);
  return pick5;
}

let devTasks = ls.get("sg_dev_tasks", []);
const client = createDbClient();
function dbOp(fn) {
  if (!client.ready || !client.db) return;
  try { Promise.resolve(fn()).catch(() => {}); } catch {}
}

function updateHud() {
  $("#coinVal").textContent = fmtNum(me.coins);
  $("#lvlVal").textContent = calcLevel(me.exp);
  $$(".dev-only").forEach(el => { el.hidden = !devMode; });
}

function checkRule(rc) {
  if (!rc) return true;
  const [k, v] = String(rc).split(":");
  return (stats[k] || 0) >= Number(v || 1);
}

function addReward(coinsDelta, expDelta, taskId) {
  me.coins = Math.max(0, Number(me.coins || 0) + Number(coinsDelta || 0));
  me.exp = Math.max(0, Number(me.exp || 0) + Number(expDelta || 0));
  const d = today();
  if (Number(coinsDelta) > 0) me.dailyCoinsByDay[d] = Number(me.dailyCoinsByDay[d] || 0) + Number(coinsDelta);
  if (taskId) {
    me.claimedByDay[d] = me.claimedByDay[d] || [];
    if (!me.claimedByDay[d].includes(taskId)) me.claimedByDay[d].push(taskId);
  }
  saveMe(); updateHud();
  dbOp(() => client.setDoc(client.docRef("users", uid), {
    coins: me.coins, exp: me.exp, dailyCoinsByDay: me.dailyCoinsByDay, claimedByDay: me.claimedByDay, lastSeen: Date.now()
  }, { merge: true }));
}

function modal(title, html) {
  const b = document.createElement("div"); b.className = "mb";
  b.innerHTML = `<div class="sheet"><div class="sh"><h3>${title}</h3><button class="x">✕</button></div><div class="sb">${html}</div></div>`;
  $("#modals").appendChild(b);
  b.close = () => { b.remove(); if (b.onclose) b.onclose(); };
  $(".x", b).onclick = b.close;
  b.addEventListener("click", e => { if (e.target === b) b.close(); });
  return b;
}

function openRewardAd(onDone) {
  const m = modal("Reward Ad", `<div class="ad"><div class="adbox">📺 Reward Ad<small>Watch to complete task</small></div><p id="adt">Ad ends in 15s</p><button class="btn ghost full" id="adskip" disabled>Skip in 5s</button></div>`);
  let t = 15;
  const iv = setInterval(() => {
    t--;
    $("#adt", m).textContent = t > 0 ? `Ad ends in ${t}s` : "Completed";
    const sk = $("#adskip", m);
    if (15 - t >= 5) { sk.disabled = false; sk.textContent = "Claim"; }
    else sk.textContent = `Skip in ${5 - (15 - t)}s`;
    if (t <= 0) { clearInterval(iv); stats.ad_watch = (stats.ad_watch || 0) + 1; saveStats(); m.close(); onDone && onDone(); }
  }, 1000);
  $("#adskip", m).onclick = () => {
    if ($("#adskip", m).disabled) return;
    clearInterval(iv); stats.ad_watch = (stats.ad_watch || 0) + 1; saveStats(); m.close(); onDone && onDone();
  };
  m.onclose = () => clearInterval(iv);
}

function renderTasks() {
  updateHud();
  const list = [...getDaily5Tasks(), ...devTasks];
  const claimed = me.claimedByDay[today()] || [];
  $("#taskList").innerHTML = list.map(t => {
    const cl = claimed.includes(t.id), met = checkRule(t.ruleCode);
    let lbl = "Claim", cls = "btn sm", dis = false;
    if (cl) { lbl = "Claimed"; cls = "btn sm ghost"; dis = true; }
    else if (!met && t.ruleCode === "ad_watch:1") { lbl = "Watch Ad"; cls = "btn sm"; }
    else if (!met) { lbl = "Locked"; cls = "btn sm ghost"; dis = true; }
    return `<div class="card task"><div class="mid"><b>${esc(t.title)}</b><p>${esc(t.description)}</p><div class="row wrap" style="margin-top:4px"><span class="chip">+${fmtNum(t.reward)} 🪙</span><span class="exp-chip">+${fmtNum(t.exp || 15)} EXP</span></div></div><button class="${cls}" data-claim="${esc(t.id)}" ${dis ? "disabled" : ""}>${lbl}</button>${devMode && String(t.id).startsWith("dt_") ? `<button class="btn red sm" data-del="${esc(t.id)}">✕</button>` : ""}</div>`;
  }).join("");
}

$("#backHomeBtn").onclick = () => openCleanPage("index.html", "tasks");
$("#taskList").onclick = e => {
  const del = e.target.dataset.del;
  if (del && devMode) {
    devTasks = devTasks.filter(x => x.id !== del); ls.set("sg_dev_tasks", devTasks);
    dbOp(() => client.deleteDoc(client.docRef("dev_tasks", del)));
    renderTasks(); return;
  }
  const id = e.target.dataset.claim; if (!id) return;
  const list = [...getDaily5Tasks(), ...devTasks];
  const t = list.find(x => x.id === id); if (!t || (me.claimedByDay[today()] || []).includes(id)) return;
  if (t.ruleCode === "ad_watch:1" && !checkRule(t.ruleCode)) {
    openRewardAd(() => { renderTasks(); toast("Ad done! Tap Claim"); }); return;
  }
  if (!checkRule(t.ruleCode)) return;
  addReward(t.reward, t.exp || 15, id); renderTasks();
  toast(`+${fmtNum(t.reward)} 🪙 & +${fmtNum(t.exp || 15)} EXP`);
};

$("#addTaskBtn").onclick = () => {
  const m = modal("Add Task", `<label>Title</label><input id="tkT" maxlength="60"><label>Description</label><textarea id="tkD" maxlength="180"></textarea><div class="row"><div style="flex:1"><label>Coins</label><input id="tkR" type="number" value="25"></div><div style="flex:1"><label>EXP</label><input id="tkE" type="number" value="20"></div></div><label>Rule</label><select id="tkC"><option value="ad_watch:1">ad_watch:1</option><option value="">No requirement</option><option value="calc_open:1">calc_open:1</option><option value="pdf_open:1">pdf_open:1</option><option value="games_played:1">games_played:1</option><option value="profile_save:1">profile_save:1</option></select><button class="btn full" id="tkS">Add Task</button>`);
  $("#tkS", m).onclick = () => {
    const title = $("#tkT", m).value.trim(); if (!title) return toast("Enter title");
    const t = { id: "dt_" + Date.now().toString(36), title, description: $("#tkD", m).value.trim(), reward: Math.max(0, +$("#tkR", m).value || 0), exp: Math.max(0, +$("#tkE", m).value || 15), ruleCode: $("#tkC", m).value };
    devTasks.push(t); ls.set("sg_dev_tasks", devTasks);
    dbOp(() => client.setDoc(client.docRef("dev_tasks", t.id), t));
    m.close(); renderTasks(); toast("Task added");
  };
};

if (client.ready) {
  client.onSnapshot(client.docRef("users", uid), snap => {
    if (!snap.exists()) return;
    me = normalizeProfile({ ...me, ...snap.data() }, uid, guestUid);
    devMode = isDevAccount(me); saveMe(); renderTasks();
  }, () => {});
  client.onSnapshot(client.col("dev_tasks"), snap => {
    devTasks = snap.docs.map(d => ({ id: d.id, ...d.data() }));
    ls.set("sg_dev_tasks", devTasks); renderTasks();
  }, () => {});
}

renderTasks();
</script>
</body>
</html>
