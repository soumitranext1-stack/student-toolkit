<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14182b">
<title>Study Game — Leaderboard</title>
<style>
:root{
  --bg:#121629;--s1:#1a203a;--s2:#232b4d;--ln:#34406e;
  --tx:#f2f5ff;--mu:#a6b0d6;--ac:#6c8cff;--coin:#ffc53d;
  --red:#ff4d6a;--gold:#ffd36b;--ok:#2dd4bf
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,sans-serif}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;min-height:100%;display:flex;flex-direction:column}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--ln);background:var(--s1);position:sticky;top:0;z-index:15}
.row{display:flex;align-items:center;gap:8px}.row.wrap{flex-wrap:wrap}
.coin{background:#2b2410;border:1px solid #5a4716;color:var(--coin);padding:5px 10px;border-radius:99px;font-weight:700;font-size:13px}
.lvl-pill{background:#1d2554;border:1px solid #4856a8;color:#b8c4ff;padding:4px 8px;border-radius:99px;font-size:12px;font-weight:800}
main{flex:1;padding:14px 14px 40px}
h2{font-size:18px;margin:0}
.list{display:flex;flex-direction:column;gap:10px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:14px}
.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:9px 13px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--s2);color:var(--tx);border:1px solid var(--ln)}.btn.full{width:100%;margin-top:10px}
.btn.sm{padding:7px 10px;font-size:12px;border-radius:10px}

.podium-wrap{background:var(--s2);border:1px solid var(--ln);border-radius:18px;padding:12px 10px;margin-bottom:12px}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end}
.pod{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:9px 6px;text-align:center}
.pod.p1{border-color:var(--gold);transform:translateY(-4px)}
.pod .rk-pill{display:inline-block;font-size:10px;font-weight:900;padding:2px 7px;border-radius:99px;background:var(--gold);color:#1a1204;margin-bottom:4px}
.pod b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.pod .pts{font-size:12px;font-weight:800;color:var(--coin)}
.rw-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.rw-card{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:14px;text-align:center;background:var(--s1);border:1px solid var(--ln)}
.rw-card b{font-size:11px;line-height:1.2}.rw-card small{font-size:10px;color:var(--mu)}.rw-card.r1{border-color:var(--gold)}

.rk{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:10px 12px}.rk.me{border-color:var(--ac)}
.mid{flex:1;min-width:0}.mid b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mid small{color:var(--mu);font-size:12px}
.cn{color:var(--coin);font-weight:700;white-space:nowrap}
.badge{width:32px;text-align:center;font-weight:800;color:var(--mu)}

.av-wrap{position:relative;display:inline-grid;place-items:center;flex:none;width:calc(var(--s) + 18px);height:calc(var(--s) + 18px)}
.av{width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;background:var(--s2);font-size:calc(var(--s)*.48);border:2px solid var(--ln);position:relative;z-index:2;overflow:hidden}
.ring-svg{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.f-top-tag{position:absolute;top:-5px;left:50%;transform:translateX(-50%);z-index:4;font-size:8px;font-weight:900;padding:1px 6px;border-radius:99px;background:var(--gold);color:#1a1204;white-space:nowrap}
.spin-cw{animation:cw 7s linear infinite;transform-origin:center}.pulse-fx{animation:pf 1.6s ease-in-out infinite alternate;transform-origin:center}
@keyframes cw{to{transform:rotate(360deg)}}@keyframes pf{from{transform:scale(.95)}to{transform:scale(1.06)}}
.top1-glow-wrap .av{border:3px solid var(--gold)!important;box-shadow:0 0 18px var(--gold)!important}

label{display:block;color:var(--mu);font-size:12px;margin:10px 0 4px}
input,select{width:100%;background:var(--s2);border:1px solid var(--ln);border-radius:11px;padding:9px 12px;font-size:15px;outline:none}
.mb{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:80}
.sheet{width:100%;max-width:520px;max-height:90vh;display:flex;flex-direction:column;background:var(--s1);border-radius:20px 20px 0 0;border:1px solid var(--ln)}
.sh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--ln)}.sh h3{font-size:16px}
.x{background:var(--s2);border:0;border-radius:50%;width:30px;height:30px;cursor:pointer}
.sb{padding:14px 16px 24px;overflow:auto}
.toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%);background:#fff;color:#111;padding:9px 15px;border-radius:99px;font-weight:700;z-index:120}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="row">
      <button class="btn ghost sm" id="backHomeBtn">← Home</button>
      <h2>Leaderboard</h2>
    </div>
    <div class="row">
      <span class="lvl-pill">LVL <span id="lvlVal">1</span></span>
      <div class="coin">🪙 <span id="coinVal">0</span></div>
      <button class="btn sm dev-only" id="addRewardBtn" hidden>+ Reward</button>
    </div>
  </header>
  <main>
    <div id="podiumSection"></div>
    <div class="list" id="rankList"></div>
  </main>
  <div id="modals"></div>
</div>

<script type="module">
import {
  ls, esc, today, fmtNum, calcLevel, getGuestUid, getActiveUid,
  isDevAccount, normalizeProfile, openCleanPage, createDbClient
} from "./firebase-init.js";

const $ = (s, r = document) => r.querySelector(s);
const $$ = (s, r = document) => [...r.querySelectorAll(s)];
function toast(t) {
  $$(".toast").forEach(x => x.remove());
  const e = document.createElement("div"); e.className = "toast"; e.textContent = t;
  document.body.appendChild(e); setTimeout(() => e.remove(), 2200);
}

const guestUid = getGuestUid();
const uid = getActiveUid();
let me = normalizeProfile(ls.get("sg_profile_" + uid, null), uid, guestUid);
let devMode = isDevAccount(me);
let users = ls.get("sg_users_cache", []);
let rankRewards = ls.get("sg_rank_rewards", null) || [
  { id: "r1", rank: 1, title: "No.1 Glowing Avatar + Crown", rewardCoins: 100, frameVal: "top1_glow", itemLabel: "1D No.1 Glow" },
  { id: "r2", rank: 2, title: "TOP 2 Wings", rewardCoins: 60, frameVal: "wings", itemLabel: "1D Wings" },
  { id: "r3", rank: 3, title: "TOP 3 Flame", rewardCoins: 30, frameVal: "flame", itemLabel: "1D Fire" }
];

function frameSvg(fr) {
  if (fr === "top1_glow") return `<svg class="ring-svg pulse-fx" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46" fill="none" stroke="#ffd36b" stroke-width="3.6" stroke-dasharray="18 6"/><polygon points="34,12 42,2 50,10 58,2 66,12 61,18 39,18" fill="#ffd36b" stroke="#78350f" stroke-width="1.4"/></svg><span class="f-top-tag">NO.1</span>`;
  if (fr === "flame") return `<svg class="ring-svg spin-cw" viewBox="0 0 100 100"><circle cx="50" cy="50" r="45" fill="none" stroke="#ff6a1a" stroke-width="3.4" stroke-dasharray="14 8"/></svg><span class="f-top-tag" style="background:#ff5500;color:#fff">FIRE</span>`;
  if (fr === "wings") return `<svg class="ring-svg pulse-fx" viewBox="0 0 100 100"><path d="M16 52 C2 35, 5 18, 22 25 C14 35, 16 44, 22 48" fill="#ffd54f"/><path d="M84 52 C98 35, 95 18, 78 25 C86 35, 84 44, 78 48" fill="#ffd54f"/><circle cx="50" cy="50" r="45" fill="none" stroke="#a88bff" stroke-width="2.6" stroke-dasharray="9 6"/></svg>`;
  return "";
}

function av(u, s = 44) {
  const fr = u?.frame || "none";
  return `<div class="av-wrap ${fr === "top1_glow" ? "top1-glow-wrap" : ""}" style="--s:${s}px">${frameSvg(fr)}<div class="av"><span>${esc(u?.avatar || "🦊")}</span></div></div>`;
}

function getTodayPts(u) {
  if (!u) return 0;
  const map = u.uid === uid ? me.dailyCoinsByDay : u.dailyCoinsByDay;
  return map && typeof map === "object" ? Number(map[today()] || 0) : 0;
}

function allUsers() {
  const map = new Map(users.map(u => [u.uid, u]));
  map.set(uid, { ...(map.get(uid) || {}), ...me });
  return [...map.values()]
    .filter(u => !isDevAccount(u))
    .map(u => ({ ...u, todayPts: getTodayPts(u) }))
    .sort((a, b) => b.todayPts - a.todayPts || (b.coins || 0) - (a.coins || 0));
}

function updateHud() {
  $("#coinVal").textContent = fmtNum(me.coins);
  $("#lvlVal").textContent = calcLevel(me.exp);
  $$(".dev-only").forEach(el => { el.hidden = !devMode; });
}

function renderRanking() {
  updateHud();
  const sorted = allUsers();
  const top3 = sorted.slice(0, 3);
  const podOrder = [top3[1], top3[0], top3[2]];
  const podRanks = [2, 1, 3];

  const podsHtml = podOrder.map((u, idx) => {
    const rk = podRanks[idx];
    const disp = u || { name: "—", avatar: "🦊", frame: rk === 1 ? "top1_glow" : (rk === 2 ? "wings" : "flame"), todayPts: 0 };
    return `<div class="pod ${rk === 1 ? "p1" : ""}"><span class="rk-pill">TOP ${rk}</span><div>${av(disp, rk === 1 ? 52 : 42)}</div><b>${esc(disp.name)}</b><div class="pts">🪙 ${fmtNum(disp.todayPts || 0)}</div></div>`;
  }).join("");

  const rwHtml = [...rankRewards].sort((a, b) => a.rank - b.rank).slice(0, 3).map(r =>
    `<div class="rw-card r${r.rank}">${av({ avatar: "🦊", frame: r.frameVal || "none" }, 36)}<b>${esc(r.title || "TOP " + r.rank)}</b><small>#${r.rank} · +${fmtNum(r.rewardCoins)} 🪙 · ${esc(r.itemLabel || "1D")}</small></div>`
  ).join("");

  $("#podiumSection").innerHTML = `<div class="podium-wrap"><div class="podium">${podsHtml}</div><div style="text-align:center;font-size:11px;color:var(--mu);margin-top:8px">Daily 0 reset · Limited-time rewards</div></div><div class="rw-row">${rwHtml}</div>`;

  $("#rankList").innerHTML = sorted.slice(3, 50).map((u, i) =>
    `<div class="row rk ${u.uid === uid ? "me" : ""}"><div class="badge">#${i + 4}</div>${av(u, 40)}<div class="mid"><b>${esc(u.name || "Player")}</b><small>LVL ${calcLevel(u.exp)} · ${esc(u.uid)}</small></div><div class="cn">🪙 ${fmtNum(u.todayPts || 0)}</div></div>`
  ).join("");
}

function modal(title, html) {
  const b = document.createElement("div"); b.className = "mb";
  b.innerHTML = `<div class="sheet"><div class="sh"><h3>${title}</h3><button class="x">✕</button></div><div class="sb">${html}</div></div>`;
  $("#modals").appendChild(b);
  b.close = () => b.remove();
  $(".x", b).onclick = b.close;
  b.addEventListener("click", e => { if (e.target === b) b.close(); });
  return b;
}

const client = createDbClient();
function dbOp(fn) {
  if (!client.ready || !client.db) return;
  try { Promise.resolve(fn()).catch(() => {}); } catch {}
}

$("#backHomeBtn").onclick = () => openCleanPage("index.html", "ranking");

$("#addRewardBtn").onclick = () => {
  const m = modal("Set Top Reward", `
    <label>Rank (1-3)</label><input id="rrP" type="number" min="1" max="3" value="1">
    <label>Title</label><input id="rrT" value="No.1 Glowing Avatar + Crown">
    <label>Coins</label><input id="rrC" type="number" value="100">
    <label>Frame (top1_glow / wings / flame)</label><input id="rrF" value="top1_glow">
    <label>Label</label><input id="rrL" value="1D No.1 Glow">
    <button class="btn full" id="rrS">Save</button>
  `);
  $("#rrS", m).onclick = () => {
    const rk = Math.min(3, Math.max(1, +$("#rrP", m).value || 1));
    const item = { id: "r" + rk, rank: rk, title: $("#rrT", m).value.trim() || ("TOP " + rk), rewardCoins: Math.max(0, +$("#rrC", m).value || 0), frameVal: $("#rrF", m).value.trim() || "top1_glow", itemLabel: $("#rrL", m).value.trim() || "1D Reward" };
    rankRewards = rankRewards.filter(x => x.rank !== rk); rankRewards.push(item);
    ls.set("sg_rank_rewards", rankRewards);
    dbOp(() => client.setDoc(client.docRef("rank_rewards", item.id), item));
    m.close(); renderRanking(); toast("Reward updated");
  };
};

if (client.ready) {
  client.onSnapshot(client.col("users"), snap => {
    users = snap.docs.map(d => ({ uid: d.id, ...d.data() }));
    ls.set("sg_users_cache", users);
    const mine = users.find(u => u.uid === uid);
    if (mine) { me = normalizeProfile({ ...me, ...mine }, uid, guestUid); devMode = isDevAccount(me); ls.set("sg_profile_" + uid, me); }
    renderRanking();
  }, () => {});
  client.onSnapshot(client.col("rank_rewards"), snap => {
    if (snap.docs.length) { rankRewards = snap.docs.map(d => ({ id: d.id, ...d.data() })); ls.set("sg_rank_rewards", rankRewards); renderRanking(); }
  }, () => {});
}

renderRanking();
