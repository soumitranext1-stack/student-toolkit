<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>Pro Page Studio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&family=Playfair+Display:wght@700&family=Poppins:wght@400;600;800&family=Roboto+Mono:wght@500&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.css" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.6.1/cropper.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/fabric.js/5.3.1/fabric.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Poppins', system-ui, sans-serif; -webkit-tap-highlight-color: transparent; }
    body { background: #070b14; color: #f8fafc; padding-bottom: 145px; overflow-x: hidden; }

    /* Glass Top Header */
    .topbar {
      background: rgba(15, 23, 42, 0.92); backdrop-filter: blur(12px);
      padding: 10px 12px; display: flex; justify-content: space-between;
      align-items: center; border-bottom: 1px solid #1e293b; position: sticky; top: 0; z-index: 80;
    }
    .top-left { display: flex; align-items: center; gap: 8px; }
    .icon-btn {
      background: #1e293b; color: #fff; border: 1px solid #334155; padding: 7px 11px;
      border-radius: 10px; font-weight: 700; font-size: 0.8rem; cursor: pointer;
    }
    .icon-btn:disabled { opacity: 0.4; }
    .save-top {
      background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff; border: none;
      padding: 8px 14px; border-radius: 10px; font-weight: 800; font-size: 0.8rem;
      box-shadow: 0 4px 14px rgba(37, 99, 235, 0.4); cursor: pointer;
    }

    /* Template & Page BG Strip */
    .tpl-strip {
      background: #0d1424; padding: 9px 12px; display: flex; gap: 8px;
      overflow-x: auto; border-bottom: 1px solid #1e293b; scrollbar-width: none; align-items: center;
    }
    .tpl-strip::-webkit-scrollbar { display: none; }
    .tpl-chip {
      background: #1e293b; color: #cbd5e1; border: 1px solid #334155; padding: 6px 12px;
      border-radius: 20px; font-size: 0.73rem; font-weight: 700; white-space: nowrap; cursor: pointer;
    }
    .tpl-chip.active { background: linear-gradient(135deg, #2563eb, #4f46e5); border-color: #93c5fd; color: #fff; }

    /* Sub-Bar: Zoom + Page Color */
    .sub-bar {
      display: flex; justify-content: space-between; align-items: center;
      padding: 7px 14px; background: #090e1a; border-bottom: 1px solid #151e32;
    }
    .zoom-group { display: flex; align-items: center; gap: 6px; }
    .z-btn {
      background: #1e293b; color: #fff; border: 1px solid #334155; width: 28px; height: 28px;
      border-radius: 8px; font-weight: 800; cursor: pointer;
    }
    .bg-dots { display: flex; gap: 6px; align-items: center; }
    .bg-dot {
      width: 22px; height: 22px; border-radius: 50%; border: 2px solid #475569; cursor: pointer;
    }

    /* Workspace Viewport */
    .viewport {
      width: 100%; overflow: auto; display: flex; justify-content: center;
      padding: 14px 12px 30px; min-height: 450px; touch-action: pan-x pan-y pinch-zoom;
    }
    .zoom-wrap { transform-origin: top center; transition: transform 0.15s ease-out; }
    .canvas-shadow {
      box-shadow: 0 16px 40px rgba(0,0,0,0.85); border-radius: 4px; background: #fff;
    }

    /* Floating Contextual Property Bar */
    .prop-bar {
      position: fixed; bottom: 72px; left: 8px; right: 8px;
      background: rgba(30, 41, 59, 0.96); backdrop-filter: blur(10px);
      border: 1px solid #475569; border-radius: 16px; padding: 8px 10px;
      display: none; gap: 7px; overflow-x: auto; align-items: center; z-index: 75;
      box-shadow: 0 -6px 24px rgba(0,0,0,0.6); scrollbar-width: none;
    }
    .prop-bar::-webkit-scrollbar { display: none; }
    .prop-btn {
      background: #0f172a; color: #f8fafc; border: 1px solid #334155; padding: 6px 10px;
      border-radius: 9px; font-size: 0.73rem; font-weight: 700; white-space: nowrap; cursor: pointer;
    }
    .prop-btn.danger { background: #dc2626; border-color: #ef4444; }
    select.font-sel {
      background: #0f172a; color: #fff; border: 1px solid #334155; padding: 6px 8px;
      border-radius: 9px; font-size: 0.74rem; font-weight: 700;
    }
    input[type="color"] { width: 32px; height: 30px; border: none; background: none; flex-shrink: 0; }

    /* Bottom Pro Dock (5 Tools) */
    .dock {
      position: fixed; bottom: 0; left: 0; right: 0; background: #111827;
      border-top: 1px solid #1f2937; padding: 8px 8px 10px; display: grid;
      grid-template-columns: repeat(5, 1fr); gap: 6px; z-index: 80;
    }
    .dock-btn {
      background: #1e293b; color: #e2e8f0; border: 1px solid #2d3748; padding: 7px 2px; border-radius: 12px;
      font-size: 0.68rem; font-weight: 700; display: flex; flex-direction: column;
      align-items: center; gap: 2px; cursor: pointer;
    }
    .dock-btn.primary { background: linear-gradient(135deg, #2563eb, #4f46e5); color: #fff; border: none; }

    /* Modals */
    .modal {
      position: fixed; inset: 0; background: rgba(0,0,0,0.88); z-index: 120;
      display: none; flex-direction: column; justify-content: center; padding: 16px;
    }
    .modal-box {
      background: #131b2e; border: 1px solid #334155; border-radius: 20px; padding: 16px;
      max-width: 440px; width: 100%; margin: 0 auto;
    }
    .crop-area { max-height: 320px; overflow: hidden; background: #000; border-radius: 12px; margin: 10px 0; }
    .crop-area img { max-width: 100%; display: block; }
    .modal-btns { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
    .m-btn { padding: 12px; border: none; border-radius: 11px; font-weight: 800; color: #fff; cursor: pointer; }
    .shape-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; margin: 12px 0; }
    .shape-card {
      background: #1e293b; border: 1px solid #334155; padding: 14px 8px; border-radius: 12px;
      text-align: center; font-size: 0.78rem; font-weight: 700; cursor: pointer;
    }
  </style>
</head>
<body>

<!-- TOP HEADER WITH UNDO/REDO -->
<div class="topbar">
  <div class="top-left">
    <button class="icon-btn" onclick="location.href='index.html'">←</button>
    <button class="icon-btn" id="undoBtn" onclick="undo()" disabled>↩️ Undo</button>
    <button class="icon-btn" id="redoBtn" onclick="redo()" disabled>↪️</button>
  </div>
  <button class="save-top" onclick="openExportMenu()">⬇️ Export HD</button>
</div>

<!-- READY-MADE TEMPLATES -->
<div class="tpl-strip">
  <button class="tpl-chip active" onclick="applyTemplate('blank', this)">📄 Blank</button>
  <button class="tpl-chip" onclick="applyTemplate('classic', this)">🖼️ Border</button>
  <button class="tpl-chip" onclick="applyTemplate('resume', this)">💼 Pro CV</button>
  <button class="tpl-chip" onclick="applyTemplate('certificate', this)">🏆 Certificate</button>
  <button class="tpl-chip" onclick="applyTemplate('notebook', this)">📓 Notes</button>
  <button class="tpl-chip" onclick="applyTemplate('poster', this)">🔥 Dark Poster</button>
</div>

<!-- ZOOM & PAGE BACKGROUND BAR -->
<div class="sub-bar">
  <div class="zoom-group">
    <button class="z-btn" onclick="changeZoom(-0.2)">-</button>
    <span id="zoomLabel" style="font-size:0.75rem; font-weight:800; color:#94a3b8; min-width:42px; text-align:center;">100%</span>
    <button class="z-btn" onclick="changeZoom(0.2)">+</button>
    <button class="icon-btn" style="padding:4px 8px; font-size:0.7rem;" onclick="resetZoom()">Fit</button>
  </div>
  <div class="bg-dots">
    <span style="font-size:0.7rem; color:#94a3b8; font-weight:700;">Page:</span>
    <div class="bg-dot" style="background:#ffffff;" onclick="setPageBg('#ffffff')"></div>
    <div class="bg-dot" style="background:#fef3c7;" onclick="setPageBg('#fef3c7')"></div>
    <div class="bg-dot" style="background:#e0f2fe;" onclick="setPageBg('#e0f2fe')"></div>
    <div class="bg-dot" style="background:#dcfce7;" onclick="setPageBg('#dcfce7')"></div>
    <div class="bg-dot" style="background:#0f172a;" onclick="setPageBg('#0f172a')"></div>
  </div>
</div>

<!-- WORKSPACE -->
<div class="viewport">
  <div class="zoom-wrap" id="zoomWrap">
    <div class="canvas-shadow">
      <canvas id="a4Canvas"></canvas>
    </div>
  </div>
</div>

<!-- CONTEXTUAL OBJECT TOOLBAR -->
<div class="prop-bar" id="propBar">
  <input type="color" id="colorPicker" value="#0f172a" onchange="changeColor(this.value)" />
  <select class="font-sel" id="fontSel" onchange="changeFont(this.value)">
    <option value="Poppins">Modern Sans</option>
    <option value="Playfair Display">Classic Serif</option>
    <option value="Caveat">Handwriting</option>
    <option value="Roboto Mono">Typewriter</option>
    <option value="Impact">Bold Poster</option>
  </select>
  <button class="prop-btn" onclick="toggleBold()"><b>B</b></button>
  <button class="prop-btn" onclick="toggleShadow()">✨ Shadow</button>
  <button class="prop-btn" onclick="centerObj()">🎯 Center</button>
  <button class="prop-btn" onclick="duplicateObj()">📋 Copy</button>
  <button class="prop-btn" onclick="layerFront()">⬆️ Front</button>
  <button class="prop-btn" onclick="layerBack()">⬇️ Back</button>
  <button class="prop-btn danger" onclick="deleteSelected()">🗑️</button>
</div>

<!-- BOTTOM PRO DOCK (5 TOOLS) -->
<div class="dock">
  <button class="dock-btn primary" onclick="addNewText()">
    <span>✍️</span><span>+ Text</span>
  </button>
  <button class="dock-btn" onclick="document.getElementById('imgPick').click()">
    <span>🖼️</span><span>+ Photo</span>
  </button>
  <button class="dock-btn" onclick="openModal('shapeModal')">
    <span>💠</span><span>Shapes</span>
  </button>
  <button class="dock-btn" onclick="document.getElementById('ocrPick').click()">
    <span>🔍</span><span>AI Scan</span>
  </button>
  <button class="dock-btn" onclick="openExportMenu()">
    <span>💾</span><span>Save</span>
  </button>
</div>

<input type="file" id="imgPick" accept="image/*" style="display:none;" />
<input type="file" id="ocrPick" accept="image/*" style="display:none;" />

<!-- CROPPER MODAL -->
<div class="modal" id="cropModal">
  <div class="modal-box">
    <h3 style="font-size:0.98rem;">Crop Photo Before Adding</h3>
    <div class="crop-area"><img id="cropTarget" /></div>
    <div class="modal-btns">
      <button class="m-btn" style="background:#334155;" onclick="closeCrop()">Cancel</button>
      <button class="m-btn" style="background:#2563eb;" onclick="confirmCropAdd()">✓ Add to Page</button>
    </div>
  </div>
</div>

<!-- SHAPES & ELEMENTS MODAL -->
<div class="modal" id="shapeModal">
  <div class="modal-box">
    <h3 style="font-size:1rem;">Add Pro Elements</h3>
    <div class="shape-grid">
      <div class="shape-card" onclick="addElement('box')">⬛<br>Box Card</div>
      <div class="shape-card" onclick="addElement('circle')">🔵<br>Badge Circle</div>
      <div class="shape-card" onclick="addElement('line')">➖<br>Divider Line</div>
      <div class="shape-card" onclick="addElement('sign')">✒️<br>Sign Box</div>
      <div class="shape-card" onclick="addElement('star')">⭐<br>Gold Star</div>
      <div class="shape-card" onclick="addElement('pill')">🏷️<br>Tag Pill</div>
    </div>
    <button class="m-btn" style="background:#334155; width:100%;" onclick="closeModal('shapeModal')">Close</button>
  </div>
</div>

<!-- EXPORT MODAL -->
<div class="modal" id="exportModal">
  <div class="modal-box">
    <h3 style="font-size:1.05rem; margin-bottom:6px;">Download 3x Ultra-HD File</h3>
    <p style="font-size:0.78rem; color:#94a3b8; margin-bottom:12px;">Print aur share karne ke liye format chunein</p>
    <button class="m-btn" style="background:linear-gradient(135deg,#059669,#10b981); width:100%; margin-bottom:10px;" onclick="exportPDF()">📄 Download A4 PDF Document</button>
    <button class="m-btn" style="background:linear-gradient(135deg,#2563eb,#4f46e5); width:100%; margin-bottom:10px;" onclick="exportJPG()">🖼️ Download High-Res JPG Image</button>
    <button class="m-btn" style="background:#334155; width:100%;" onclick="closeModal('exportModal')">Cancel</button>
  </div>
</div>

<!-- AI OCR LOADER MODAL -->
<div class="modal" id="ocrModal">
  <div class="modal-box" style="text-align:center;">
    <div style="font-size:2rem; margin-bottom:8px;">🤖</div>
    <h3>AI Scanning Text from Image...</h3>
    <p id="ocrStatus" style="font-size:0.8rem; color:#60a5fa; margin-top:6px;">Reading words (5-10 sec)...</p>
  </div>
</div>

<script>
  const screenW = Math.min(window.innerWidth - 28, 360);
  const screenH = Math.round(screenW * 1.414);

  const canvas = new fabric.Canvas("a4Canvas", {
    width: screenW,
    height: screenH,
    backgroundColor: "#ffffff",
    preserveObjectStacking: true
  });

  fabric.Object.prototype.set({
    transparentCorners: false,
    cornerColor: "#2563eb",
    cornerStrokeColor: "#ffffff",
    borderColor: "#2563eb",
    cornerSize: 12,
    padding: 5
  });

  /* UNDO / REDO HISTORY ENGINE */
  let history = [];
  let redoStack = [];
  let isRedoing = false;

  function saveState() {
    if (isRedoing) return;
    history.push(JSON.stringify(canvas));
    if (history.length > 25) history.shift();
    redoStack = [];
    updateHistoryBtns();
  }

  function updateHistoryBtns() {
    document.getElementById("undoBtn").disabled = history.length <= 1;
    document.getElementById("redoBtn").disabled = redoStack.length === 0;
  }

  function undo() {
    if (history.length <= 1) return;
    isRedoing = true;
    redoStack.push(history.pop());
    canvas.loadFromJSON(history[history.length - 1], () => {
      canvas.renderAll();
      isRedoing = false;
      updateHistoryBtns();
    });
  }

  function redo() {
    if (redoStack.length === 0) return;
    isRedoing = true;
    const next = redoStack.pop();
    history.push(next);
    canvas.loadFromJSON(next, () => {
      canvas.renderAll();
      isRedoing = false;
      updateHistoryBtns();
    });
  }

  canvas.on("object:modified", saveState);
  canvas.on("object:added", () => { if (!isRedoing) saveState(); });

  /* ZOOM & PAGE COLOR */
  let currentZoom = 1;
  function changeZoom(delta) {
    currentZoom = Math.min(2.2, Math.max(0.6, +(currentZoom + delta).toFixed(1)));
    document.getElementById("zoomWrap").style.transform = `scale(${currentZoom})`;
    document.getElementById("zoomLabel").innerText = Math.round(currentZoom * 100) + "%";
  }
  function resetZoom() {
    currentZoom = 1;
    document.getElementById("zoomWrap").style.transform = "scale(1)";
    document.getElementById("zoomLabel").innerText = "100%";
  }
  function setPageBg(hex) {
    canvas.setBackgroundColor(hex, () => {
      canvas.renderAll();
      saveState();
    });
  }

  /* TEMPLATES */
  function applyTemplate(type, btn) {
    document.querySelectorAll(".tpl-chip").forEach(c => c.classList.remove("active"));
    if (btn) btn.classList.add("active");

    isRedoing = true;
    canvas.clear();
    canvas.setBackgroundColor("#ffffff", canvas.renderAll.bind(canvas));
    const lockProps = { selectable: false, evented: false };

    if (type === "blank") {
      canvas.add(new fabric.IText("Double tap to edit text", {
        left: 30, top: 45, fontFamily: "Poppins", fontSize: 20, fontWeight: "bold", fill: "#0f172a"
      }));
    } else if (type === "classic") {
      canvas.add(new fabric.Rect({ left: 12, top: 12, width: screenW - 24, height: screenH - 24, fill: "transparent", stroke: "#1e293b", strokeWidth: 3, ...lockProps }));
      canvas.add(new fabric.Rect({ left: 18, top: 18, width: screenW - 36, height: screenH - 36, fill: "transparent", stroke: "#64748b", strokeWidth: 1, ...lockProps }));
      canvas.add(new fabric.IText("PROJECT FRONT PAGE", { left: 38, top: 45, fontFamily: "Playfair Display", fontSize: 19, fontWeight: "bold", fill: "#0f172a" }));
      canvas.add(new fabric.IText("Submitted By: Sudipta Halder\nClass / Roll No: 12th\nSubject: Computer Science", { left: 38, top: 95, fontFamily: "Poppins", fontSize: 13, fill: "#334155", lineHeight: 1.45 }));
    } else if (type === "resume") {
      canvas.add(new fabric.Rect({ left: 0, top: 0, width: screenW, height: 85, fill: "#1e3a8a", ...lockProps }));
      canvas.add(new fabric.IText("YOUR FULL NAME", { left: 20, top: 18, fontFamily: "Poppins", fontSize: 20, fontWeight: "bold", fill: "#ffffff" }));
      canvas.add(new fabric.IText("Phone: +91 9876543210 • Email: name@gmail.com", { left: 20, top: 48, fontFamily: "Poppins", fontSize: 10.5, fill: "#bfdbfe" }));
      canvas.add(new fabric.IText("CAREER OBJECTIVE\nWrite your professional skills and summary here...", { left: 20, top: 105, fontFamily: "Poppins", fontSize: 12.5, fill: "#0f172a", lineHeight: 1.4 }));
    } else if (type === "certificate") {
      canvas.setBackgroundColor("#fffbeb", canvas.renderAll.bind(canvas));
      canvas.add(new fabric.Rect({ left: 14, top: 14, width: screenW - 28, height: screenH - 28, fill: "transparent", stroke: "#b45309", strokeWidth: 5, ...lockProps }));
      canvas.add(new fabric.IText("CERTIFICATE OF ACHIEVEMENT", { left: 30, top: 55, fontFamily: "Playfair Display", fontSize: 16.5, fontWeight: "bold", fill: "#92400e" }));
      canvas.add(new fabric.IText("Proudly Presented To:\n[Student Name]", { left: 40, top: 115, fontFamily: "Caveat", fontSize: 28, fill: "#1e293b" }));
    } else if (type === "notebook") {
      canvas.add(new fabric.Line([42, 0, 42, screenH], { stroke: "#ef4444", strokeWidth: 1.5, ...lockProps }));
      for (let y = 45; y < screenH - 20; y += 22) {
        canvas.add(new fabric.Line([0, y, screenW, y], { stroke: "#cbd5e1", strokeWidth: 1, ...lockProps }));
      }
      canvas.add(new fabric.IText("Assignment Notes:\n1. Start writing your answer here...", { left: 50, top: 48, fontFamily: "Caveat", fontSize: 20, fill: "#1e3a8a", lineHeight: 1.15 }));
    } else if (type === "poster") {
      canvas.setBackgroundColor("#0f172a", canvas.renderAll.bind(canvas));
      canvas.add(new fabric.Rect({ left: 16, top: 16, width: screenW - 32, height: screenH - 32, fill: "transparent", stroke: "#38bdf8", strokeWidth: 2, ...lockProps }));
      canvas.add(new fabric.IText("EVENT / NOTICE POSTER", { left: 35, top: 50, fontFamily: "Impact", fontSize: 24, fill: "#38bdf8" }));
      canvas.add(new fabric.IText("Double tap to add event details, date & venue.", { left: 35, top: 100, fontFamily: "Poppins", fontSize: 13, fill: "#e2e8f0" }));
    }

    canvas.renderAll();
    isRedoing = false;
    history = [JSON.stringify(canvas)];
    redoStack = [];
    updateHistoryBtns();
  }

  applyTemplate("blank", document.querySelector(".tpl-chip"));

  /* OBJECT TOOLBAR CONTROLS */
  const propBar = document.getElementById("propBar");
  canvas.on("selection:created", () => propBar.style.display = "flex");
  canvas.on("selection:updated", () => propBar.style.display = "flex");
  canvas.on("selection:cleared", () => propBar.style.display = "none");

  function addNewText(customTxt = "Double tap to type") {
    const t = new fabric.IText(customTxt, {
      left: 35, top: 110, fontFamily: "Poppins", fontSize: 17, fill: "#0f172a"
    });
    canvas.add(t);
    canvas.setActiveObject(t);
    canvas.renderAll();
  }

  function addElement(kind) {
    closeModal("shapeModal");
    let obj;
    if (kind === "box") {
      obj = new fabric.Rect({ left: 50, top: 120, width: 140, height: 80, fill: "#2563eb", rx: 10, ry: 10 });
    } else if (kind === "circle") {
      obj = new fabric.Circle({ left: 80, top: 120, radius: 45, fill: "#7c3aed" });
    } else if (kind === "line") {
      obj = new fabric.Rect({ left: 25, top: 160, width: screenW - 50, height: 3, fill: "#0f172a" });
    } else if (kind === "sign") {
      const box = new fabric.Rect({ width: 130, height: 48, fill: "transparent", stroke: "#475569", strokeWidth: 1.5, strokeDashArray: [4, 4] });
      const lbl = new fabric.Text("Signature", { fontSize: 12, fill: "#64748b", left: 36, top: 16, fontFamily: "Poppins" });
      obj = new fabric.Group([box, lbl], { left: screenW - 155, top: screenH - 85 });
    } else if (kind === "star") {
      obj = new fabric.Polygon([
        {x: 50, y: 0}, {x: 65, y: 35}, {x: 100, y: 38}, {x: 72, y: 62},
        {x: 80, y: 96}, {x: 50, y: 78}, {x: 20, y: 96}, {x: 28, y: 62},
        {x: 0, y: 38}, {x: 35, y: 35}
      ], { left: 90, top: 120, fill: "#f59e0b", scaleX: 0.7, scaleY: 0.7 });
    } else if (kind === "pill") {
      obj = new fabric.Rect({ left: 60, top: 130, width: 120, height: 34, fill: "#10b981", rx: 17, ry: 17 });
    }
    canvas.add(obj);
    canvas.setActiveObject(obj);
    canvas.renderAll();
  }

  function changeColor(val) {
    const obj = canvas.getActiveObject();
    if (!obj) return;
    obj.set("fill", val);
    canvas.renderAll();
    saveState();
  }

  function changeFont(font) {
    const obj = canvas.getActiveObject();
    if (!obj || obj.type !== "i-text") return;
    obj.set("fontFamily", font);
    canvas.renderAll();
    saveState();
  }

  function toggleBold() {
    const obj = canvas.getActiveObject();
    if (!obj || obj.type !== "i-text") return;
    obj.set("fontWeight", obj.fontWeight === "bold" ? "normal" : "bold");
    canvas.renderAll();
    saveState();
  }

  function toggleShadow() {
    const obj = canvas.getActiveObject();
    if (!obj) return;
    obj.set("shadow", obj.shadow ? null : new fabric.Shadow({ color: "rgba(0,0,0,0.35)", blur: 10, offsetX: 3, offsetY: 4 }));
    canvas.renderAll();
    saveState();
  }

  function centerObj() {
    const obj = canvas.getActiveObject();
    if (!obj) return;
    obj.centerH();
    obj.setCoords();
    canvas.renderAll();
    saveState();
  }

  function duplicateObj() {
    const obj = canvas.getActiveObject();
    if (!obj) return;
    obj.clone((cloned) => {
      cloned.set({ left: obj.left + 18, top: obj.top + 18 });
      canvas.add(cloned);
      canvas.setActiveObject(cloned);
      canvas.renderAll();
    });
  }

  function layerFront() {
    const obj = canvas.getActiveObject();
    if (!obj) return;
    obj.bringToFront();
    canvas.requestRenderAll();
    saveState();
  }

  function layerBack() {
    const obj = canvas.getActiveObject();
    if (!obj) return;
    obj.sendToBack();
    canvas.getObjects().forEach(o => { if (!o.selectable) o.sendToBack(); });
    canvas.requestRenderAll();
    saveState();
  }

  function deleteSelected() {
    const obj = canvas.getActiveObject();
    if (obj) {
      canvas.remove(obj);
      canvas.requestRenderAll();
      saveState();
    }
  }

  /* PHOTO CROPPER */
  let cropper = null;
  document.getElementById("imgPick").addEventListener("change", function(e) {
    const file = e.target.files[0];
    if (!file) return;
    const reader = new FileReader();
    reader.onload = function(ev) {
      const img = document.getElementById("cropTarget");
      img.onload = function() {
        openModal("cropModal");
        if (cropper) cropper.destroy();
        cropper = new Cropper(img, { viewMode: 1, autoCropArea: 0.9 });
      };
      img.src = ev.target.result;
    };
    reader.readAsDataURL(file);
    e.target.value = "";
  });

  function closeCrop() {
    closeModal("cropModal");
    if (cropper) cropper.destroy();
  }

  function confirmCropAdd() {
    if (!cropper) return;
    const dataUrl = cropper.getCroppedCanvas({ maxWidth: 800 }).toDataURL("image/png");
    fabric.Image.fromURL(dataUrl, function(fImg) {
      fImg.scaleToWidth(130);
      fImg.set({ left: 60, top: 90 });
      canvas.add(fImg);
      canvas.setActiveObject(fImg);
      canvas.requestRenderAll();
    });
    closeCrop();
  }

  /* AI IMAGE-TO-TEXT (OCR SCANNER) */
  document.getElementById("ocrPick").addEventListener("change", async function(e) {
    const file = e.target.files[0];
    if (!file) return;
    openModal("ocrModal");
    try {
      const res = await Tesseract.recognize(file, "eng");
      const cleanText = res.data.text.trim();
      closeModal("ocrModal");
      if (cleanText) {
        addNewText(cleanText.slice(0, 350));
      } else {
        alert("Photo mein saaf text nahi mila.");
      }
    } catch (err) {
      closeModal("ocrModal");
      alert("Scan fail hua, dobara try karein.");
    }
    e.target.value = "";
  });

  /* MODALS & EXPORTS */
  function openModal(id) { document.getElementById(id).style.display = "flex"; }
  function closeModal(id) { document.getElementById(id).style.display = "none"; }
  function openExportMenu() { openModal("exportModal"); }

  function exportPDF() {
    closeModal("exportModal");
    resetZoom();
    canvas.discardActiveObject();
    canvas.renderAll();
    const { jsPDF } = window.jspdf;
    const pdf = new jsPDF("p", "mm", "a4");
    const hdData = canvas.toDataURL({ format: "jpeg", quality: 0.96, multiplier: 3 });
    pdf.addImage(hdData, "JPEG", 0, 0, 210, 297);
    pdf.save("Page_Studio_Pro.pdf");
  }

  function exportJPG() {
    closeModal("exportModal");
    resetZoom();
    canvas.discardActiveObject();
    canvas.renderAll();
    const a = document.createElement("a");
    a.href = canvas.toDataURL({ format: "jpeg", quality: 0.96, multiplier: 3 });
    a.download = "Page_Studio_Pro.jpg";
    a.click();
  }
</script>
</body>
</html>
