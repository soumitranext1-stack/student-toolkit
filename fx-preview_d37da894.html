<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14182b">
<title>FX Pack Preview</title>
<link rel="stylesheet" href="gamekit.css">
<link rel="stylesheet" href="fx-pack.css">
<style>
/* preview-only stand-ins for the app's own .av-wrap / .av / .bn-box / .bub */
.av-wrap{position:relative;width:var(--s);height:var(--s);display:inline-block;flex:none}
.av{position:absolute;inset:0;border-radius:50%;background:var(--s2);display:grid;place-items:center;overflow:hidden}
.av span{font-size:calc(var(--s)*.55);line-height:1}
.bn-box{border-radius:14px;padding:16px;margin-bottom:8px;text-align:center;font-weight:800;color:#fff;text-shadow:0 1px 3px #000a;border:1px solid #fff2}
.bub{display:inline-block;padding:9px 13px;border-radius:14px;background:var(--s2);margin:4px 0;font-size:14px}
h2{font-size:17px;margin:22px 2px 10px}
.fgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px 6px}
.fcell{display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:30px 4px 10px}
.fcell b{font-size:12px;line-height:1.15}.fcell small{font-size:10px;color:var(--mu)}
.fcell .row{margin-top:6px;gap:6px}
.agrid{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.agrid div{aspect-ratio:1;display:grid;place-items:center;font-size:26px;background:var(--s2);border:1px solid var(--ln);border-radius:12px}
.nm{font-size:20px;display:block;margin:5px 0}
.rtit{display:flex;align-items:center;gap:8px;margin:14px 2px 8px;font-size:13px;font-weight:800}
.dur-pill{font-size:10px;font-weight:800;padding:2px 8px;border:1px solid;border-radius:99px}
</style>
</head>
<body>
<div id="app" style="max-width:520px;margin:0 auto;padding:12px 12px 40px">
  <div class="row" style="justify-content:space-between"><b style="font-size:18px">FX Pack Preview</b><button class="btn sm ghost" id="th">Light / Dark</button></div>
  <p class="mu" style="margin-top:4px">Sirf dekhne ke liye. App me jaane wale code ye 3 files hain: fx-pack.css, fx-frames.js, fx-avatars.js.</p>
  <div id="out"></div>
</div>
<script src="fx-avatars.js"></script>
<script src="fx-frames.js"></script>
<script>
"use strict";
const $=s=>document.querySelector(s);
const av=(frame,emoji,s)=>`<div class="av-wrap" style="--s:${s}px">${fxFrameHtml(frame,s)}<div class="av"><span>${emoji}</span></div></div>`;
const EM=['🦊','🐼','🦁','🐉','🧙','🦉','👑','🚀','🧠','🐯','🌟','🎮','🔥','🐺','🧚','🦄','💎','🤖','🐲','🦅','🌙','⚡','🐱','🥷','🪐'];
let h='';
const order=['rare','epic','legendary','mythic','vip','rank'];
let k=0;
order.forEach(r=>{
  const list=FX_FRAMES.filter(f=>f.rarity===r);
  h+=`<div class="rtit">${fxRarityPill(r)}<span>${FX_RARITY[r].label} frames (${list.length})</span></div><div class="fgrid">`+
   list.map(f=>`<div class="fcell">${av(f.id,EM[k++%EM.length],74)}<b>${f.name}</b><small>${f.price?f.price+' 🪙 / day':'Rank reward'}</small><div class="row">${av(f.id,EM[k%EM.length],40)}<small>list size</small></div></div>`).join('')+`</div>`;
});
h+=`<h2>Avatars (${AVATAR_ALL.length})</h2>`+AVATAR_CATS.map(c=>`<div class="rtit">${c.icon} ${c.name} <span class="mu">· ${c.list.length} · ${c.price} 🪙</span></div><div class="agrid">${c.list.map(x=>`<div title="${x[1]}">${x[0]}</div>`).join('')}</div>`).join('');
h+=`<h2>Name glow</h2><div class="card">${FX_TEXTS.map(t=>`<span class="nm ${t[0]}">${t[1].replace(' Name','')} Player</span>`).join('')}</div>`;
h+=`<h2>Banners</h2>${FX_BANNERS.map(b=>`<div class="bn-box ${b[0]}">${b[1]}</div>`).join('')}`;
h+=`<h2>Message glow</h2><div class="card">${FX_MSGS.map(m=>`<div><span class="bub ${m[0]}">${m[1]}: Hello dost!</span></div>`).join('')}</div>`;
$('#out').innerHTML=h;
$('#th').onclick=()=>document.body.classList.toggle('light');
</script>
</body>
</html>
