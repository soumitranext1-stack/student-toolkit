<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#14182b">
<title>Study Game</title>
<style>
:root{
  --bg:#121629;--s1:#1a203a;--s2:#232b4d;--ln:#34406e;
  --tx:#f2f5ff;--mu:#a6b0d6;--ac:#6c8cff;--coin:#ffc53d;
  --red:#ff4d6a;--gold:#ffd36b;--ok:#2dd4bf
}
body.light{
  --bg:#f4f6fc;--s1:#ffffff;--s2:#eef2fb;--ln:#d6deef;
  --tx:#151a2e;--mu:#5c668a;--ac:#4f6ef7;--coin:#d98a00;
  --red:#dc2626;--gold:#eab308;--ok:#0d9488
}
*{box-sizing:border-box;margin:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;background:var(--bg);color:var(--tx);font:15px/1.4 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;transition:background .2s,color .2s}
[hidden]{display:none!important}
button,input,select,textarea{font:inherit;color:inherit}
#app{max-width:520px;margin:0 auto;height:100%;display:flex;flex-direction:column;background:var(--bg);position:relative}
header{display:flex;justify-content:space-between;align-items:center;padding:calc(10px + env(safe-area-inset-top)) 14px 10px;border-bottom:1px solid var(--ln);background:var(--s1);gap:6px}
.brand{display:flex;flex-direction:column;gap:2px;min-width:0}.brand b{font-size:18px;letter-spacing:.2px}
.st{display:flex;align-items:center;gap:5px;font-size:11px;color:var(--mu)}.st i{width:7px;height:7px;border-radius:50%;background:#888}.st.on i{background:var(--ok);box-shadow:0 0 6px var(--ok)}
.icon-btn{background:var(--s2);border:1px solid var(--ln);border-radius:99px;padding:5px 9px;font-size:12px;cursor:pointer;display:inline-flex;align-items:center;gap:4px;position:relative}
.coin{background:color-mix(in srgb,var(--coin) 18%,var(--s2));border:1px solid color-mix(in srgb,var(--coin) 45%,var(--ln));color:var(--coin);padding:5px 10px;border-radius:99px;font-weight:700;font-size:13px}
.lvl-pill{background:color-mix(in srgb,var(--ac) 18%,var(--s2));border:1px solid color-mix(in srgb,var(--ac) 45%,var(--ln));color:var(--ac);padding:4px 8px;border-radius:99px;font-size:12px;font-weight:800}

main{flex:1;overflow-y:auto;padding:14px 14px 96px}
.view{display:none}.view.on{display:block}
h2{font-size:18px;margin:2px 0 12px}
nav{position:fixed;bottom:0;left:50%;transform:translateX(-50%);width:100%;max-width:520px;display:flex;background:var(--s1);border-top:1px solid var(--ln);padding-bottom:env(safe-area-inset-bottom);z-index:20}
nav button{flex:1;background:none;border:0;padding:8px 0 7px;color:var(--mu);display:flex;flex-direction:column;align-items:center;gap:2px;font-size:10px;cursor:pointer;position:relative}
nav button span{font-size:18px}nav button.on{color:var(--ac);font-weight:700}

.red-dot{display:inline-block;width:9px;height:9px;border-radius:50%;background:var(--red);box-shadow:0 0 8px var(--red);flex:none}
.nav-dot{position:absolute;top:6px;right:24%;width:8px;height:8px;border-radius:50%;background:var(--red)}

/* Auto-scrolling Popular Tool Posters */
.poster-track{display:flex;gap:12px;overflow-x:auto;scroll-snap-type:x mandatory;padding-bottom:8px;margin-bottom:14px;scrollbar-width:none}
.poster-track::-webkit-scrollbar{display:none}
.poster-slide{flex:0 0 88%;scroll-snap-align:start;border-radius:18px;padding:14px;background:linear-gradient(135deg,#3b5bdb,#7048e8);color:#fff;display:flex;align-items:center;justify-content:space-between;gap:12px;text-decoration:none;box-shadow:0 8px 22px #0004}
.poster-slide.p2{background:linear-gradient(135deg,#0ca678,#1971c2)}
.poster-slide.p3{background:linear-gradient(135deg,#e8590c,#d6336c)}
.poster-slide.p4{background:linear-gradient(135deg,#5f3dc4,#ae3ec9)}
.poster-slide b{display:block;font-size:15px;margin-bottom:3px}
.poster-slide small{display:block;opacity:.92;font-size:12px}

.grid{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:14px}
.tool{cursor:pointer;display:flex;flex-direction:column;gap:8px;min-height:118px;text-decoration:none}
.tool .art{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;background:linear-gradient(145deg,#222952,#131830);border:1px solid #394278;box-shadow:inset 0 1px 0 #ffffff18}
.tool b{font-size:14px;color:var(--ac)}.tool small{color:var(--mu);font-size:12px}
.tool:active{transform:scale(.98)}

.btn{background:var(--ac);color:#fff;border:0;border-radius:12px;padding:10px 14px;font-weight:700;cursor:pointer;display:inline-flex;align-items:center;justify-content:center;gap:6px}
.btn.ghost{background:var(--s2);color:var(--tx);border:1px solid var(--ln)}.btn.red{background:var(--red);color:#fff}.btn.ok{background:var(--ok);color:#05201d}.btn.full{width:100%;margin-top:10px}.btn:disabled{opacity:.45;cursor:default}
.btn.sm{padding:7px 10px;font-size:12px;border-radius:10px}
.row{display:flex;align-items:center;gap:8px}.row.wrap{flex-wrap:wrap}
.list{display:flex;flex-direction:column;gap:10px}
.rk{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:10px 12px;cursor:pointer}.rk.me{border-color:var(--ac)}
.mid{flex:1;min-width:0}.mid b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}.mid small{color:var(--mu);font-size:12px}
.cn{color:var(--coin);font-weight:700;white-space:nowrap}

.podium-wrap{background:var(--s2);border:1px solid var(--ln);border-radius:18px;padding:12px 10px;margin-bottom:12px}
.podium{display:grid;grid-template-columns:1fr 1.15fr 1fr;gap:8px;align-items:end}
.pod{background:var(--s1);border:1px solid var(--ln);border-radius:14px;padding:9px 6px;text-align:center;cursor:pointer}
.pod.p1{border-color:var(--gold);transform:translateY(-4px)}
.pod .rk-pill{display:inline-block;font-size:10px;font-weight:900;padding:2px 7px;border-radius:99px;background:var(--gold);color:#1a1204;margin-bottom:4px}
.pod b{display:block;font-size:12px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;margin-top:3px}.pod .pts{font-size:12px;font-weight:800;color:var(--coin)}
.badge{width:32px;text-align:center;font-weight:800;color:var(--mu)}

/* Avatars & No.1 Glowing Avatar with Crown */
.av-wrap{position:relative;display:inline-grid;place-items:center;flex:none;width:calc(var(--s) + 18px);height:calc(var(--s) + 18px)}
.av{width:var(--s);height:var(--s);border-radius:50%;display:grid;place-items:center;background:var(--s2);font-size:calc(var(--s)*.48);border:2px solid var(--ln);position:relative;z-index:2;overflow:hidden}
.ring-svg{position:absolute;inset:0;width:100%;height:100%;z-index:3;pointer-events:none}
.f-top-tag{position:absolute;top:-5px;left:50%;transform:translateX(-50%);z-index:4;font-size:8px;font-weight:900;padding:1px 6px;border-radius:99px;background:var(--gold);color:#1a1204;white-space:nowrap;border:1px solid #fff6}
.spin-cw{animation:cw 7s linear infinite;transform-origin:center}.pulse-fx{animation:pf 1.6s ease-in-out infinite alternate;transform-origin:center}
@keyframes cw{to{transform:rotate(360deg)}}@keyframes pf{from{transform:scale(.95)}to{transform:scale(1.06)}}

.top1-glow-wrap .av{
  border:3px solid #ffd36b!important;
  box-shadow:0 0 18px #ffd36b,0 0 30px #ff8a00aa,inset 0 0 10px #ffe27a88!important;
  animation:top1Halo 1.5s ease-in-out infinite alternate;
}
@keyframes top1Halo{
  from{box-shadow:0 0 12px #ffd36b,0 0 22px #ff7b0088}
  to{box-shadow:0 0 22px #fff099,0 0 36px #ffaa00cc}
}

.bn-box{border-radius:16px;padding:14px;border:1px solid var(--ln);background:var(--s2);position:relative;overflow:hidden}
.bn-aurora{background:linear-gradient(120deg,#0f766e,#1d4ed8);color:#fff}
.bn-crimson{background:linear-gradient(120deg,#be123c,#7e22ce);color:#fff}
.bn-galaxy{background:linear-gradient(120deg,#3730a3,#0369a1,#6d28d9);color:#fff}
.bn-solar{background:linear-gradient(120deg,#d97706,#be123c);color:#fff}
.bn-emerald{background:linear-gradient(120deg,#059669,#0f766e);color:#fff}
.bn-midnight{background:linear-gradient(120deg,#1e1b4b,#312e81);color:#fff}
.bn-rose{background:linear-gradient(120deg,#e11d48,#9d174d);color:#fff}
.bn-dev{background:linear-gradient(135deg,#881337,#78350f);border:1.5px solid var(--gold);color:#fff}

.anim-firetxt{background:linear-gradient(90deg,#ffd43b,#ff6b6b,#ffa94d);-webkit-background-clip:text;background-clip:text;color:transparent!important;font-weight:800;text-shadow:0 0 12px #ff6b6b66}
.anim-royal-txt{background:linear-gradient(90deg,#74c0fc,#b197fc,#ffd43b);-webkit-background-clip:text;background-clip:text;color:transparent!important;font-weight:800;text-shadow:0 0 12px #b197fc66}
.anim-neon-txt{background:linear-gradient(90deg,#2dd4bf,#60a5fa,#e879f9);-webkit-background-clip:text;background-clip:text;color:transparent!important;font-weight:800;text-shadow:0 0 12px #2dd4bf66}
.anim-gold-txt{background:linear-gradient(90deg,#fff3bf,#ffd43b,#f59f00);-webkit-background-clip:text;background-clip:text;color:transparent!important;font-weight:800}
.anim-ice-txt{background:linear-gradient(90deg,#e3fafc,#66d9e8,#339af0);-webkit-background-clip:text;background-clip:text;color:transparent!important;font-weight:800}
.anim-berry-txt{background:linear-gradient(90deg,#fcc2d7,#f783ac,#cc5de8);-webkit-background-clip:text;background-clip:text;color:transparent!important;font-weight:800}
.anim-mint-txt{background:linear-gradient(90deg,#c3fae8,#63e6be,#20c997);-webkit-background-clip:text;background-clip:text;color:transparent!important;font-weight:800}
.anim-sunset-txt{background:linear-gradient(90deg,#ffe8cc,#ffa94d,#ff6b6b);-webkit-background-clip:text;background-clip:text;color:transparent!important;font-weight:800}

.msg-glow-gold{border:1.5px solid var(--gold)!important;box-shadow:0 0 12px #ffd36b66!important}
.msg-glow-cyan{border:1.5px solid var(--ok)!important;box-shadow:0 0 12px #2dd4bf66!important}
.msg-glow-rose{border:1.5px solid var(--red)!important;box-shadow:0 0 12px #ff4d6a66!important}
.msg-glow-violet{border:1.5px solid #a855f7!important;box-shadow:0 0 12px #a855f766!important}

.tag-grid{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.p-tag{font-size:11px;font-weight:800;padding:3px 9px;border-radius:99px;background:var(--s1);border:1px solid var(--ln);color:var(--tx)}
.prod-stage{height:88px;border-radius:12px;display:flex;align-items:center;justify-content:center;margin-bottom:8px;border:1px solid var(--ln);background:var(--s2)}
.task{display:flex;gap:10px;align-items:center}.task p{color:var(--mu);font-size:12px}.chip{color:var(--coin);font-weight:700;font-size:12px}.exp-chip{color:var(--ok);font-weight:700;font-size:12px}
.dur-pill{display:inline-block;font-size:10px;font-weight:700;padding:2px 7px;border-radius:99px;background:var(--s2);color:var(--ac);border:1px solid var(--ln)}
.empty{color:var(--mu);text-align:center;padding:24px 10px}
label{display:block;color:var(--mu);font-size:12px;margin:10px 0 4px}
input,select,textarea{width:100%;background:var(--s2);border:1px solid var(--ln);border-radius:11px;padding:10px 12px;font-size:15px;outline:none}
textarea{resize:vertical;min-height:66px}
.pick{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}.pick button{background:none;border:2px solid transparent;border-radius:10px;padding:2px;cursor:pointer;display:grid;place-items:center}
.pick button.on{border-color:var(--ac);background:var(--s2)}
.pf{display:flex;flex-direction:column;align-items:center;gap:6px;margin-bottom:6px}
.mb{position:fixed;inset:0;background:#0009;display:flex;align-items:flex-end;justify-content:center;z-index:60}
.sheet{width:100%;max-width:520px;max-height:92vh;display:flex;flex-direction:column;background:var(--s1);border-radius:20px 20px 0 0;border:1px solid var(--ln)}
.sh{display:flex;justify-content:space-between;align-items:center;padding:14px 16px;border-bottom:1px solid var(--ln)}.sh h3{font-size:17px}
.x{background:var(--s2);border:0;border-radius:50%;width:32px;height:32px;cursor:pointer}
.sb{padding:14px 16px calc(18px + env(safe-area-inset-bottom));overflow:auto}
.tabs{display:flex;gap:6px;margin-bottom:12px}.tabs button{flex:1;padding:8px;border-radius:10px;border:1px solid var(--ln);background:var(--s2);cursor:pointer;font-size:13px}.tabs button.on{background:var(--ac);color:#fff;font-weight:700}
.toast{position:fixed;left:50%;bottom:90px;transform:translateX(-50%);background:var(--tx);color:var(--bg);padding:9px 15px;border-radius:99px;font-weight:600;z-index:90;max-width:90%}

.poem-box{white-space:pre-wrap;font-size:14px;line-height:1.5;margin-top:8px}
.poem-img{width:100%;max-height:220px;object-fit:cover;border-radius:12px;margin-top:8px;border:1px solid var(--ln)}
.world-card{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;cursor:pointer;background:color-mix(in srgb,var(--ok) 18%,var(--s1));border:1.5px solid var(--ok)}
.dev{display:flex;align-items:center;gap:12px;padding:12px;border-radius:16px;cursor:pointer;background:linear-gradient(135deg,#881337,#78350f);border:1.5px solid var(--gold);color:#fff}
.tags{display:flex;gap:6px;margin-top:3px}.tg{font-size:10px;font-weight:800;padding:2px 6px;border-radius:6px}.tg.d{background:var(--red);color:#fff}.tg.l{background:var(--gold);color:#1a1204}
.th{display:flex;align-items:center;gap:12px;padding:11px 12px;background:var(--s1);border:1px solid var(--ln);border-radius:14px;cursor:pointer}
.thread{position:fixed;top:0;bottom:0;left:0;right:0;margin:0 auto;max-width:520px;background:var(--bg);z-index:40;display:flex;flex-direction:column}
.thh{display:flex;align-items:center;gap:10px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:var(--s1);border-bottom:1px solid var(--ln)}
.thh.dv{background:linear-gradient(135deg,#881337,#78350f);color:#fff}
.msgs{flex:1;overflow-y:auto;padding:14px;display:flex;flex-direction:column;gap:10px}
.m{display:flex;flex-direction:column;max-width:82%}.m.out{align-self:flex-end;align-items:flex-end}.m.in{align-self:flex-start}
.bub{padding:9px 13px;border-radius:16px;word-break:break-word;white-space:pre-wrap}.m.out .bub{background:var(--ac);color:#fff;border-bottom-right-radius:4px}.m.in .bub{background:var(--s2);border-bottom-left-radius:4px}
.bub.fire-border{border:2px solid #ff7b1c;box-shadow:0 0 10px #ff450088}
.m time{font-size:10px;color:var(--mu);margin-top:2px}
.chal{background:var(--s2);border:1px solid var(--ac);border-radius:16px;padding:12px;min-width:225px}.chal p{color:var(--mu);font-size:12px;margin:4px 0 8px}.chal .rw{color:var(--coin);font-weight:700}
.comp{display:flex;gap:8px;padding:10px 12px calc(10px + env(safe-area-inset-bottom));background:var(--s1);border-top:1px solid var(--ln);align-items:center}
.comp input{flex:1}.comp .btn{padding:10px 14px}
.opt{display:block;width:100%;text-align:left;margin-top:8px;padding:11px;border-radius:12px;border:1px solid var(--ln);background:var(--s2);cursor:pointer}
.opt.ok{border-color:var(--ok);background:#0f766e33}.opt.bad{border-color:var(--red);background:#be123c33}
.ban-screen{position:fixed;inset:0;background:#090a12;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;text-align:center;color:#fff}

/* ===== v2 polish ===== */
:root{--sh:0 8px 26px #0004;--glass:color-mix(in srgb,var(--s1) 78%,transparent)}
body.light{--sh:0 6px 22px #2a3a7a1f}
html,body{background:radial-gradient(800px 420px at 8% -8%,color-mix(in srgb,var(--ac) 24%,transparent),transparent 70%),radial-gradient(640px 380px at 100% 4%,#c026d31f,transparent 70%),var(--bg);background-attachment:fixed}
#app{background:transparent}
header{background:var(--glass);backdrop-filter:blur(16px) saturate(1.4);-webkit-backdrop-filter:blur(16px) saturate(1.4);position:sticky;top:0;z-index:15}
.brand b{background:linear-gradient(90deg,var(--ac),#c084fc);-webkit-background-clip:text;background-clip:text;color:transparent}
nav{background:var(--glass);backdrop-filter:blur(18px) saturate(1.4);-webkit-backdrop-filter:blur(18px) saturate(1.4)}
nav button.on::before{content:"";position:absolute;top:0;width:28px;height:3px;border-radius:0 0 6px 6px;background:var(--ac)}
.card,.rk,.th,.pod,.podium-wrap{box-shadow:var(--sh)}
.card{background:linear-gradient(155deg,color-mix(in srgb,var(--s1) 92%,#fff),var(--s1))}
.tool{transition:transform .15s}.tool:hover{transform:translateY(-2px)}
.btn{background:linear-gradient(135deg,var(--ac),color-mix(in srgb,var(--ac) 60%,#c084fc));box-shadow:0 5px 16px color-mix(in srgb,var(--ac) 35%,transparent);transition:transform .12s,filter .12s}
.btn:active{transform:scale(.96)}.btn:hover{filter:brightness(1.08)}
.btn.ghost{background:var(--s2);box-shadow:none}.btn.red{background:var(--red);box-shadow:none}.btn.ok{background:var(--ok);box-shadow:none}
.mb{z-index:120;backdrop-filter:blur(6px);animation:fadeIn .18s}
.sheet{animation:sheetUp .22s ease-out;box-shadow:0 -14px 40px #0006}
.toast{z-index:200;box-shadow:var(--sh)}
@keyframes sheetUp{from{transform:translateY(28px);opacity:0}}@keyframes fadeIn{from{opacity:0}}
.pod.p1{background:linear-gradient(160deg,color-mix(in srgb,var(--gold) 22%,var(--s1)),var(--s1));box-shadow:0 0 24px #ffd36b44}
.notice{display:flex;gap:8px;align-items:center;margin-bottom:12px;padding:10px 12px;border-radius:14px;font-size:13px;font-weight:600;background:linear-gradient(120deg,color-mix(in srgb,var(--gold) 26%,var(--s1)),var(--s1));border:1px solid var(--gold)}
.streak{display:inline-block;margin-top:4px;padding:3px 10px;border-radius:99px;font-size:11px;font-weight:800;background:#ff7a1a33;border:1px solid #ff7a1a;color:#fff}
.chipbtn{background:var(--s2);border:1px solid var(--ln);border-radius:99px;padding:6px 12px;font-size:12px;cursor:pointer}.chipbtn.on{background:var(--ac);color:#fff;border-color:var(--ac)}
#storeTabs{overflow-x:auto;flex-wrap:nowrap!important;scrollbar-width:none}#storeTabs button{flex:none}
.hub-slot{border-style:dashed;opacity:.75}
.rw-row{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px}
.rw-card{display:flex;flex-direction:column;align-items:center;gap:3px;padding:8px 4px;border-radius:14px;text-align:center;background:var(--s1);border:1px solid var(--ln)}
.rw-card b{font-size:11px;line-height:1.2}.rw-card small{font-size:10px;color:var(--mu)}.rw-card.r1{border-color:var(--gold)}
.p-tag.eq{border-color:var(--ac)}
.bn-box:is(.bn-aurora,.bn-crimson,.bn-galaxy,.bn-solar,.bn-emerald,.bn-midnight,.bn-rose,.bn-ocean,.bn-sunrise,.bn-candy){background-size:220% 220%;animation:bnShift 9s ease infinite}
@keyframes bnShift{0%,100%{background-position:0 50%}50%{background-position:100% 50%}}
.bn-ocean{background-image:linear-gradient(120deg,#0e7490,#2563eb,#0891b2);color:#fff}
.bn-sunrise{background-image:linear-gradient(120deg,#f59e0b,#ef4444,#f472b6);color:#fff}
.bn-candy{background-image:linear-gradient(120deg,#ec4899,#8b5cf6,#38bdf8);color:#fff}
[class*="anim-"][class$="-txt"],.anim-firetxt,.bio-gold,.bio-cyan,.bio-pink,.bio-rainbow{background-size:220% 100%;animation:txtShift 5s linear infinite}
@keyframes txtShift{to{background-position:220% 0}}
.anim-lava-txt{background-image:linear-gradient(90deg,#ff922b,#e03131,#ffd43b,#ff922b);text-shadow:0 0 12px #e0313166}
.anim-aqua-txt{background-image:linear-gradient(90deg,#99e9f2,#22b8cf,#4dabf7,#99e9f2);text-shadow:0 0 12px #22b8cf66}
.anim-lava-txt,.anim-aqua-txt,.bio-gold,.bio-cyan,.bio-pink,.bio-rainbow{-webkit-background-clip:text;background-clip:text;color:transparent!important;font-weight:800}
.bio-gold{background-image:linear-gradient(90deg,#fff3bf,#ffd43b,#f59f00,#fff3bf)}
.bio-cyan{background-image:linear-gradient(90deg,#c3fae8,#2dd4bf,#60a5fa,#c3fae8)}
.bio-pink{background-image:linear-gradient(90deg,#fcc2d7,#f06595,#cc5de8,#fcc2d7)}
.bio-rainbow{background-image:linear-gradient(90deg,#ff6b6b,#ffd43b,#51cf66,#339af0,#cc5de8,#ff6b6b)}
.msg-glow-green{border:1.5px solid #51cf66!important;box-shadow:0 0 12px #51cf6666!important}
.msg-glow-orange{border:1.5px solid #ff922b!important;box-shadow:0 0 12px #ff922b66!important}
</style>
</head>
<body>
<div id="app">
  <header>
    <div class="brand"><b>Study Game</b><span id="st" class="st"><i></i><em>Local mode</em></span></div>
    <div class="row" style="gap:6px">

function addReward(coinsDelta, expDelta, taskId, noLb){
  if(me.banned)return;
  const cDelta=Number(coinsDelta||0), eDelta=Number(expDelta||0);
  me.coins=Math.max(0,Number(me.coins||0)+cDelta);
  me.exp=Math.max(0,Number(me.exp||0)+eDelta);
  const d=today();
  if(cDelta>0&&!noLb)me.dailyCoinsByDay[d]=Number(me.dailyCoinsByDay[d]||0)+cDelta;
  if(taskId){me.claimedByDay[d]=me.claimedByDay[d]||[];if(!me.claimedByDay[d].includes(taskId))me.claimedByDay[d].push(taskId)}
  saveMe();patchUser(uid,{...base(),coins:me.coins});updateHud();renderRanking();
  dbOp(()=>F.setDoc(userRef(uid),{...base(),coins:me.coins,exp:me.exp,dailyCoinsByDay:me.dailyCoinsByDay,claimedByDay:me.claimedByDay},{merge:true}));
}

function ingestRemoteDmDocs(dmDocs){
  const now=Date.now();let gotNewUnread=false;
  [...dmDocs].sort((a,b)=>(a.ts||0)-(b.ts||0)).forEach(docItem=>{
    const ts=Number(docItem.ts||now);
    if((now-ts)>=TWENTY_FOUR_HOURS_MS){dbOp(()=>F.deleteDoc(F.doc(db,'dm_messages',docItem.id)));return}   // cloud keeps 24h only; local history stays
    if(docItem.to!==uid&&docItem.from!==uid)return;
    const isMe=docItem.from===uid,peerId=isMe?docItem.to:docItem.from;
    if(!peerId||peerId===uid)return;
    if(!chats[peerId]){const po=users.find(u=>u.uid===peerId);chats[peerId]={id:peerId,name:po?.name||peerId,uid:peerId,messages:[]}}
    const th=chats[peerId];th.messages=th.messages||[];const type=docItem.type||'text';
    if(type==='duel_accept'||type==='duel_result'){
      const d=th.messages.find(x=>x.id===docItem.ref);if(!d)return;
      if(type==='duel_accept')d.accepted=true;
      else if(isMe){if(d.myScore==null)d.myScore=Number(docItem.score)}
      else if(d.oppScore==null)d.oppScore=Number(docItem.score);
      return;
    }
    if(!th.messages.some(m=>m.id===docItem.id)){
      const m={id:docItem.id,from:isMe?'me':'them',type:type==='duel'?'duel':'text',text:docItem.text||'',msgStyle:docItem.msgStyle||'',ts};
      if(m.type==='duel'){m.gi=Number(docItem.gi)||0;m.accepted=false}
      th.messages.push(m);th.messages.sort((a,b)=>(a.ts||0)-(b.ts||0));
      if(!isMe&&cur!==peerId){me.unreadFrom[peerId]=true;gotNewUnread=true}
    }
  });
  if(gotNewUnread)saveMe();
  sweepDuels();saveChats();updateUnreadDots();
  if(!cur)renderChats();else renderThread();
}
function updateUnreadDots(){
  const hasUnread=Object.values(me.unreadFrom||{}).some(Boolean);
  $('#chatNavDot').hidden=!hasUnread;
}

async function initFirebase(){
  try{
    const A=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js');
    const S=await import('https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js');
    db=S.getFirestore(A.initializeApp(firebaseConfig));F=S;setStatus(true);

    S.getDoc(userRef(uid)).then(s=>{if(!s.exists())return S.setDoc(userRef(uid),{...base(),createdAt:Date.now()})}).catch(()=>{});
    S.onSnapshot(S.collection(db,'users'),snap=>{
      const docs=snap.docs.map(d=>({uid:d.id,...d.data()}));
      cleanupInactiveZeroFriendUsers(docs);users=docs;ls.set('sg_users_cache',users);
      const m=users.find(u=>u.uid===uid);
      if(m){if(typeof m.coins==='number')me.coins=m.coins;if(typeof m.exp==='number')me.exp=Math.max(me.exp,m.exp);if(m.dailyCoinsByDay){const o={...m.dailyCoinsByDay};Object.entries(me.dailyCoinsByDay).forEach(([k,v])=>{o[k]=Math.max(Number(o[k]||0),Number(v||0))});me.dailyCoinsByDay=o}if(m.claimedByDay)me.claimedByDay={...m.claimedByDay,...me.claimedByDay};me.banned=!!m.banned;saveMe();checkBan()}
      setStatus(true);claimRankReward();checkReferralPayout();updateHud();renderAll();
    },()=>{});

    S.onSnapshot(S.collection(db,'store_items'),snap=>{customItems=snap.docs.map(d=>({id:d.id,...d.data()})).filter(c=>!DEFAULT_ITEMS.some(x=>x.id===c.id));ls.set('sg_store_custom',customItems);storeItems=[...DEFAULT_ITEMS,...customItems];renderStore()},()=>{});
    S.onSnapshot(S.collection(db,'rank_rewards'),snap=>{if(snap.docs.length){rankRewards=snap.docs.map(d=>({id:d.id,...d.data()}));ls.set('sg_rank_rewards',rankRewards)}renderRanking()},()=>{});
    S.onSnapshot(S.collection(db,'dev_inbox'),snap=>{const next={};snap.docs.forEach(d=>{next[d.id]={uid:d.id,...d.data()}});devInbox=next;ls.set('sg_dev_inbox',devInbox);if(!cur)renderChats()},()=>{});

    S.onSnapshot(S.collection(db,'world_chat'),snap=>{
      let list=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(a.ts||0)-(b.ts||0));
      if(list.length>100){list.slice(0,list.length-100).forEach(old=>dbOp(()=>F.deleteDoc(F.doc(db,'world_chat',old.id))));list=list.slice(-100)}
      worldMsgs=list;ls.set('sg_world_msgs',worldMsgs);if(cur==='world')renderThread();
    },()=>{});

    S.onSnapshot(S.collection(db,'dm_messages'),snap=>{
      const dmDocs=snap.docs.map(d=>({id:d.id,...d.data()}));
      ingestRemoteDmDocs(dmDocs);
    },()=>{});

    // Approved poems shown on Home screen
    S.onSnapshot(S.collection(db,'poems_wall'),snap=>{
      const list=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0));
      poems=list;ls.set('sg_poems_cache',poems);renderPoems();
    },()=>{});

    // Pending poem requests sent to Developer
    S.onSnapshot(S.collection(db,'poem_requests'),snap=>{
      const list=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>(b.ts||0)-(a.ts||0));
      poemRequests=list;ls.set('sg_poem_requests_cache',poemRequests);
      if(devMode)renderPoems();
    },()=>{});
    S.onSnapshot(S.collection(db,'dev_tasks'),snap=>{devTasks=snap.docs.map(d=>({id:d.id,...d.data()}));ls.set('sg_dev_tasks',devTasks);renderTasks()},()=>{});
    S.onSnapshot(S.doc(db,'config','notice'),sn=>{notice=sn.exists()?sn.data():null;ls.set('sg_notice',notice);renderNotice()},()=>{});
    S.onSnapshot(S.collection(db,'referrals'),snap=>{
      const code=getInviteCode();if(!code)return;
      snap.docs.forEach(d=>{const r=d.data();if(r.code===code&&!r.paid&&d.id!==uid&&!me.done['ref_'+d.id]){me.done['ref_'+d.id]=1;addReward(50,10);saveMe();dbOp(()=>F.setDoc(F.doc(db,'referrals',d.id),{paid:true},{merge:true}));toast('Referral bonus +50 🪙')}});
    },()=>{});
  }catch{setStatus(false)}
}

      <b style="color:var(--gold)">Pending Poem Requests (${poemRequests.length})</b>
      <div class="list" style="margin-top:8px">${poemRequests.map(rq=>`
        <div class="card" style="background:var(--s2)">
          <b>${esc(rq.title||'Poem Request')}</b>
          <small style="color:var(--mu)">By ${esc(rq.author||'Player')} · UID: ${esc(rq.uid)}</small>
          ${rq.text?`<div class="poem-box">${esc(rq.text)}</div>`:''}
          ${rq.photoUrl?`<img class="poem-img" src="${esc(rq.photoUrl)}" alt="Request">`:''}
          <div class="row" style="margin-top:8px">
            <button class="btn ok sm" data-approvepoem="${esc(rq.id)}" style="flex:1">Approve &amp; Upload</button>
            <button class="btn red sm" data-rejectpoem="${esc(rq.id)}">Reject</button>

  }

  const wallHtml=(poems||[]).map(p=>`

        <div class="mid"><b>${esc(p.author||'Player')}</b><small>UID: ${esc(p.uid||'—')} · ${esc(p.title||'Poem')}</small></div>

$('#poemList').onclick=e=>{
  const appId=e.target.dataset.approvepoem;
  if(appId&&devMode){
    const rq=poemRequests.find(x=>x.id===appId);
    if(!rq)return;
    const approvedItem={id:'p_'+Date.now().toString(36),uid:rq.uid,author:rq.author,avatar:rq.avatar||'🙂',frame:rq.frame||'none',title:rq.title||'Poem',text:rq.text||'',photoUrl:rq.photoUrl||'',ts:Date.now()};
    poems=[approvedItem,...poems];ls.set('sg_poems_cache',poems);
    poemRequests=poemRequests.filter(x=>x.id!==appId);ls.set('sg_poem_requests_cache',poemRequests);
    dbOp(()=>F.setDoc(F.doc(db,'poems_wall',approvedItem.id),approvedItem));
    dbOp(()=>F.deleteDoc(F.doc(db,'poem_requests',appId)));
    renderPoems();toast('Approved & uploaded to Home!');return;
  }
  const rejId=e.target.dataset.rejectpoem;
  if(rejId&&devMode){
    poemRequests=poemRequests.filter(x=>x.id!==rejId);ls.set('sg_poem_requests_cache',poemRequests);
    dbOp(()=>F.deleteDoc(F.doc(db,'poem_requests',rejId)));
    renderPoems();toast('Request removed');return;
  }
  const delId=e.target.dataset.delpoem;
  if(delId&&devMode){
    poems=poems.filter(x=>x.id!==delId);ls.set('sg_poems_cache',poems);
    dbOp(()=>F.deleteDoc(F.doc(db,'poems_wall',delId)));
    renderPoems();toast('Poem deleted from Home');
  }
};

function shrinkImg(f,max=800){return new Promise((ok,no)=>{const r=new FileReader();r.onerror=no;r.onload=()=>{const im=new Image();im.onerror=no;im.onload=()=>{const k=Math.min(1,max/Math.max(im.width,im.height)),c=document.createElement('canvas');c.width=Math.round(im.width*k);c.height=Math.round(im.height*k);c.getContext('2d').drawImage(im,0,0,c.width,c.height);ok(c.toDataURL('image/jpeg',.72))};im.src=r.result};r.readAsDataURL(f)})}

function rewardCardsHtml(){return `<div class="rw-row">${[...rankRewards].sort((a,b)=>a.rank-b.rank).map(r=>`<div class="rw-card r${r.rank}">${av({avatar:'🦊',frame:r.frameVal||'none'},38)}<b>${esc(r.title||'TOP '+r.rank)}</b><small>#${r.rank} · +${fmtNum(r.rewardCoins)} 🪙 · ${esc(r.itemLabel||'1D')}</small></div>`).join('')}</div>`}
function claimRankReward(){
  if(!online||me.banned||devMode)return;
  const y=new Date(Date.now()-864e5).toISOString().slice(0,10);if(me.rankClaimDay===y)return;
  me.rankClaimDay=y;
  const pool=allUsers().filter(u=>!isDevAccount(u)).map(u=>({uid:u.uid,p:Number(((u.uid===uid?me:u).dailyCoinsByDay||{})[y]||0)})).filter(x=>x.p>0).sort((a,b)=>b.p-a.p);
  const pos=pool.findIndex(x=>x.uid===uid),r=pos>=0&&pos<3?rankRewards.find(x=>x.rank===pos+1):null;
  if(r){addReward(r.rewardCoins||0,0,null,true);const k='frame:'+r.frameVal;me.tempUnlocks[k]=Math.max(Date.now(),Number(me.tempUnlocks[k]||0))+(r.days||1)*864e5;toast(`Yesterday's #${pos+1}! +${r.rewardCoins} 🪙 & ${r.itemLabel||'frame'}`)}
  saveMe();
}

function checkRule(rc){if(!rc)return true;const [k,v]=String(rc).split(':'),req=Number(v||1);return (stats[k]||0)>=req}
function renderTasks(){
  tasks=[...getDaily5Tasks(),...devTasks];const claimedToday=getClaimedToday();
  $('#taskList').innerHTML=tasks.map(t=>{
    const cl=claimedToday.includes(t.id), met=checkRule(t.ruleCode);
    let lbl='Claim', cls='btn sm', dis=false;
    if(cl){lbl='Claimed';cls='btn sm ghost';dis=true}else if(!met&&t.ruleCode==='ad_watch:1'){lbl='Watch Ad';cls='btn sm'}else if(!met){lbl='Locked';cls='btn sm ghost';dis=true}
    return `<div class="card task"><div class="mid"><b>${esc(t.title)}</b><p>${esc(t.description)}</p><div class="row wrap" style="margin-top:4px"><span class="chip">+${fmtNum(t.reward)} 🪙</span><span class="exp-chip">+${fmtNum(t.exp||15)} EXP</span></div></div><button class="${cls}" data-claim="${esc(t.id)}" ${dis?'disabled':''}>${lbl}</button>${devMode&&String(t.id).startsWith('dt_')?`<button class="btn red sm" data-deltask="${esc(t.id)}">✕</button>`:''}</div>`;
  }).join('');
}
$('#taskList').onclick=e=>{
  const dt=e.target.dataset.deltask;if(dt&&devMode){devTasks=devTasks.filter(x=>x.id!==dt);ls.set('sg_dev_tasks',devTasks);dbOp(()=>F.deleteDoc(F.doc(db,'dev_tasks',dt)));renderTasks();return}
  const id=e.target.dataset.claim;if(!id)return;const t=tasks.find(x=>x.id===id);if(!t||getClaimedToday().includes(id))return;
  if(t.ruleCode==='ad_watch:1'&&!checkRule(t.ruleCode)){openRewardAd(()=>{renderTasks();toast('Ad done! Tap Claim')});return}
  if(!checkRule(t.ruleCode))return;
  addReward(t.reward,t.exp||15,id);renderTasks();toast(`+${fmtNum(t.reward)} 🪙 & +${fmtNum(t.exp||15)} EXP`);

const DUEL_GAMES=[
  {name:'Math Speed Duel',icon:'🧮',questions:[{q:'(24 ÷ 3) + (6 × 5) = ?',o:['34','38','42','30'],a:1},{q:'15% of 200 = ?',o:['25','30','35','40'],a:1},{q:'14 × 6 = ?',o:['74','84','94','64'],a:1},{q:'√144 = ?',o:['10','11','12','14'],a:2},{q:'7² + 3² = ?',o:['52','58','56','62'],a:1},{q:'1/2 + 1/4 = ?',o:['3/4','2/6','1/6','2/4'],a:0},{q:'9 × 8 = ?',o:['64','72','81','78'],a:1},{q:'250 ÷ 5 = ?',o:['40','45','50','55'],a:2}]},
  {name:'Science Quiz Duel',icon:'🔬',questions:[{q:'Powerhouse of the cell?',o:['Ribosome','Mitochondria','Nucleus','Golgi'],a:1},{q:'Symbol of Sodium?',o:['So','Na','Sd','K'],a:1},{q:'SI unit of force?',o:['Joule','Watt','Newton','Pascal'],a:2},{q:'Formula of water?',o:['H2O','CO2','O2','HO'],a:0},{q:'The Red Planet?',o:['Venus','Mars','Jupiter','Mercury'],a:1},{q:'Gas absorbed by plants?',o:['Oxygen','Nitrogen','Carbon dioxide','Helium'],a:2},{q:'Hardest natural substance?',o:['Gold','Iron','Diamond','Quartz'],a:2},{q:'Bones in an adult body?',o:['206','201','212','196'],a:0}]}
];
function seededShuffle(a,seed){let h=0;for(const c of String(seed))h=(h*31+c.charCodeAt(0))>>>0;const r=()=>{h=(h*1664525+1013904223)>>>0;return h/4294967296};const b=[...a];for(let i=b.length-1;i>0;i--){const j=Math.floor(r()*(i+1));[b[i],b[j]]=[b[j],b[i]]}return b}
/* Settles once: win=36 (pot 40 - 4 fee), tie=refund 20, loss=0. Guarded by me.done so it can never pay twice. */
function settleDuel(m){
  if(m.type!=='duel'||m.settled||m.myScore==null||!me.done['bet_'+m.id])return;
  if(m.oppScore==null){
    if(Date.now()-(m.finishedAt||Date.now())>15*60000){m.settled=true;m.state='refund';if(!me.done['pay_'+m.id]){me.done['pay_'+m.id]=1;addReward(20,0,null,true)}}
    return;
  }
  m.settled=true;if(me.done['pay_'+m.id])return;me.done['pay_'+m.id]=1;
  if(m.myScore>m.oppScore){m.state='won';addReward(36,20)}
  else if(m.myScore===m.oppScore){m.state='tie';addReward(20,8,null,true)}
  else m.state='lost';
}
function sweepDuels(){let ch=false;Object.values(chats).forEach(t=>(t.messages||[]).forEach(m=>{if(m.type==='duel'&&!m.settled&&m.myScore!=null){settleDuel(m);ch=true}}));if(ch){saveChats();if(cur)renderThread()}}
function startTimedDuel(msg,peer){
  if(!online)return toast('Duels need a live connection');
  if(!msg.accepted)return toast('Friend must Accept Challenge first');
  if(msg.paid||msg.myScore!=null||me.done['bet_'+msg.id])return toast('You already played this duel');
  if(me.coins<20)return toast('Need 20 coins');
  msg.paid=true;me.done['bet_'+msg.id]=1;addReward(-20,0,null,true);saveChats();     // bet taken exactly once
  const g=DUEL_GAMES[msg.gi]||DUEL_GAMES[0],Q=seededShuffle(g.questions,msg.id);
  let qIdx=0,score=0,left=60,over=false,iv=0;
  const m=modal(`${g.icon} ${esc(g.name)} (60s)`,`<div class="row" style="justify-content:space-between;margin-bottom:8px"><span class="dur-pill">⏱ <b id="dTimer">60s</b></span><span class="chip" id="dScore">Score: 0</span></div><div id="dBody"></div>`);
  const end=txt=>{
    if(over)return;over=true;clearInterval(iv);bumpStat('games_played');
    msg.myScore=score;msg.finishedAt=Date.now();
    const rid='r_'+msg.id+'_'+uid;
    dbOp(()=>F.setDoc(F.doc(db,'dm_messages',rid),{id:rid,type:'duel_result',ref:msg.id,from:uid,to:peer,score,ts:Date.now()}));
    settleDuel(msg);saveChats();if(cur)renderThread();
    const body=$('#dBody',m);if(body)body.innerHTML=`<div class="card"><b>${esc(txt)}</b><p style="color:var(--mu);margin-top:6px">Your score: ${score}. ${msg.oppScore==null?'Result shows in chat once your friend finishes.':'Final: '+score+' vs '+msg.oppScore}</p></div>`;
  };
  const step=()=>{
    if(over)return;if(qIdx>=Q.length)return end('All questions done');
    const item=Q[qIdx];
    $('#dBody',m).innerHTML=`<p style="margin-bottom:8px"><b>${esc(item.q)}</b></p>`+item.o.map((o,i)=>`<button class="opt" data-ans="${i}">${esc(o)}</button>`).join('');
    $$('[data-ans]',m).forEach(b=>b.onclick=()=>{if(over)return;score+=(+b.dataset.ans===item.a?4:-2);$('#dScore',m).textContent='Score: '+score;qIdx++;step()});
  };
  iv=setInterval(()=>{if(over)return clearInterval(iv);left--;if($('#dTimer',m))$('#dTimer',m).textContent=left+'s';if(left<=0)end('Time up')},1000);
  m.onclose=()=>{clearInterval(iv);end('Match ended')};
  step();
}

const mid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,6);
const hasBadWord=(txt)=>BAD_WORDS.some(w=>new RegExp(`\\b${w}\\b`,'i').test(txt));
function consecutiveOutgoingCount(msgs){let c=0;for(let i=msgs.length-1;i>=0;i--){if(msgs[i].from==='me')c++;else break}return c}

function renderChats(){
  updateUnreadDots();
  const worldHtml=`<div class="world-card" data-th="world"><div class="av-wrap" style="--s:46px"><div class="av"><span>🌍</span></div></div><div class="mid"><b>World Chat</b><small>${worldMsgs.length}/100 msgs · No duels</small></div></div>`;
  const devHtml=`<div class="dev" data-th="developer">${av({uid:DEV_UID,avatar:DEV_AVATAR,frame:'dev'},46)}<div class="mid"><b>Developer</b><div class="tags"><span class="tg d">DEV</span><span class="tg l">LVL 99</span></div></div></div>`;

  if(devMode){
    $('#chatList').innerHTML=worldHtml+devHtml+Object.values(devInbox).filter(x=>x&&x.uid).map(th=>{
      const dot=(me.unreadFrom&&me.unreadFrom[th.uid])?'<span class="red-dot"></span>':'';
      return `<div class="th" data-th="inbox:${esc(th.uid)}">${av(th,40)}<div class="mid"><b>${esc(th.name||th.uid)}</b><small>${esc(th.uid)}</small></div>${dot}</div>`;
    }).join('');
    return;
  }

  const fList=Object.values(chats).filter(t=>!t.dev&&isFriend(t.uid||t.id));
  $('#chatList').innerHTML=worldHtml+devHtml+(fList.map(t=>{
    const peerUid=t.uid||t.id;
    const dot=(me.unreadFrom&&me.unreadFrom[peerUid])?'<span class="red-dot"></span>':'';
    return `<div class="th" data-th="${esc(t.id)}">${av(users.find(u=>u.uid===peerUid)||{avatar:'🙂',frame:'none'},40)}<div class="mid"><b>${esc(t.name)}</b><small>${esc(peerUid)}</small></div>${dot}</div>`;
  }).join('')||'<div class="empty">No friend chats yet.</div>');
}
$('#clearDevInboxBtn').onclick=()=>{if(!devMode)return;Object.keys(devInbox).forEach(k=>dbOp(()=>F.deleteDoc(F.doc(db,'dev_inbox',k))));devInbox={};ls.set('sg_dev_inbox',devInbox);renderChats();toast('Inbox cleared')};
$('#chatList').onclick=e=>{const c=e.target.closest('[data-th]');if(c)openThread(c.dataset.th)};

function openThread(id){
  cur=id;
  const peerKey=id.startsWith('inbox:')?id.slice(6):id;
  if(me.unreadFrom&&me.unreadFrom[peerKey]){delete me.unreadFrom[peerKey];saveMe();updateUnreadDots()}
  $('#thread').hidden=false;renderThread();
}

function renderThread(){
  if(!cur)return;
  if(cur==='world'){
    $('#thHead').className='thh';$('#thHead').innerHTML=`<button class="x" id="thBack">←</button><div class="mid"><b>🌍 World Chat</b><small>${worldMsgs.length}/100 messages</small></div>`;
    $('#thBack').onclick=()=>{$('#thread').hidden=true;cur=null;renderChats()};$('#chBtn').hidden=true;
    $('#msgs').innerHTML=worldMsgs.map(m=>`<div class="m ${m.uid===uid?'out':'in'}"><small style="color:var(--mu);font-size:10px">${esc(m.name||'Player')}</small><div class="bub ${esc(m.msgStyle||'')}">${esc(m.text)}</div><time>${new Date(m.ts||Date.now()).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</time></div>`).join('');
    $('#msgs').scrollTop=$('#msgs').scrollHeight;return;
  }
  const isInbox=cur.startsWith('inbox:'), t=isInbox?devInbox[cur.slice(6)]:chats[cur];if(!t)return;
  $('#thHead').className='thh'+(t.dev?' dv':'');
  $('#thHead').innerHTML=`<button class="x" id="thBack">←</button><div class="mid"><b>${t.dev?'<span class="anim-firetxt">Developer</span>':esc(t.name)}</b><small>${esc(t.uid||'')}</small></div>${devMode&&isInbox?`<button class="btn red sm" id="clrSingle">Clear</button>`:''}`;
  $('#thBack').onclick=()=>{$('#thread').hidden=true;cur=null;renderChats()};
  if($('#clrSingle'))$('#clrSingle').onclick=()=>{const tid=cur.slice(6);delete devInbox[tid];ls.set('sg_dev_inbox',devInbox);dbOp(()=>F.deleteDoc(F.doc(db,'dev_inbox',tid)));$('#thread').hidden=true;cur=null;renderChats()};
  $('#chBtn').hidden=!!t.dev||isInbox;
  $('#msgs').innerHTML=(t.messages||[]).map(m=>{
    const out=isInbox?(m.from==='dev'):(m.from==='me');
    if(m.type==='duel'){
      const g=DUEL_GAMES[m.gi]||DUEL_GAMES[0],mine=m.from==='me',sm='style="color:var(--mu);font-size:12px"';
      let act;
      if(m.state==='won')act=`<b style="color:var(--ok)">✅ Won 36 🪙</b> <small>(${m.myScore}–${m.oppScore})</small>`;
      else if(m.state==='tie')act='<b>🤝 Tie · 20 🪙 refunded</b>';
      else if(m.state==='lost')act=`<b style="color:var(--red)">❌ Lost (${m.myScore}–${m.oppScore})</b>`;
      else if(m.state==='refund')act='<b>↩️ Friend timed out · 20 🪙 refunded</b>';
      else if(m.myScore!=null)act=`<span ${sm}>⏳ You scored ${m.myScore} · waiting for friend</span>`;
      else if(!m.accepted)act=mine?`<span ${sm}>Waiting for friend to accept…</span>`:`<button class="btn ok sm" data-acceptduel="${m.id}">Accept Challenge</button>`;
      else act=`<button class="btn sm" data-startduel="${m.id}">Start 60s Match (20 🪙)</button>`;
      return `<div class="m ${out?'out':'in'}"><div class="chal"><b>${g.icon} ${esc(g.name)}</b><p>Bet 20+20 = 40 🪙 · Winner <span class="rw">36 🪙</span> (4 🪙 fee) · +4 right / −2 wrong</p>${act}</div><time>${new Date(m.ts).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</time></div>`;
    }
    const cls=(t.dev&&(out||devMode)||isInbox)?' fire-border':(out&&me.msgStyle?' '+me.msgStyle:'');
    return `<div class="m ${out?'out':'in'}"><div class="bub${cls}">${esc(m.text)}</div><time>${new Date(m.ts).toLocaleTimeString([],{hour:'numeric',minute:'2-digit'})}</time></div>`;
  }).join('');
  $('#msgs').scrollTop=$('#msgs').scrollHeight;
}

$('#msgs').onclick=e=>{
  const t=chats[cur];if(!t)return;
  const acc=e.target.dataset.acceptduel;
  if(acc){
    const m=t.messages.find(x=>x.id===acc);if(!m||m.from==='me'||m.accepted)return;
    if(!online)return toast('Need a live connection to accept');
    m.accepted=true;saveChats();
    dbOp(()=>F.setDoc(F.doc(db,'dm_messages','a_'+m.id),{id:'a_'+m.id,type:'duel_accept',ref:m.id,from:uid,to:t.uid,ts:Date.now()}));
    renderThread();return toast('Accepted! Both players can start now');
  }
  const st=e.target.dataset.startduel;
  if(st){const m=t.messages.find(x=>x.id===st);if(m&&m.accepted)startTimedDuel(m,t.uid)}
};

function sendMsgText(){
  const inp=$('#msgIn'), text=inp.value.trim();if(!text)return;
  if(hasBadWord(text))return toast('Error: Bad language is not allowed');
  inp.value='';

  if(cur==='world'){
    const id=mid(), item={id,uid,name:me.name,text,msgStyle:me.msgStyle||'',ts:Date.now()};
    worldMsgs=[...worldMsgs,item].slice(-100);ls.set('sg_world_msgs',worldMsgs);dbOp(()=>F.setDoc(F.doc(db,'world_chat',id),item));renderThread();return;
  }

  if(cur&&cur.startsWith('inbox:')){
    const tid=cur.slice(6), entry=devInbox[tid];if(!entry)return;
    entry.messages=entry.messages||[];entry.messages.push({id:mid(),from:'dev',type:'text',text,ts:Date.now()});syncDevInboxToCloud(tid,entry);renderThread();return;
  }

  const t=chats[cur];if(!t)return;t.messages=t.messages||[];
  if(!t.dev&&consecutiveOutgoingCount(t.messages)>=3)return toast('3 messages sent without reply');

  const msgId=mid(), nowTs=Date.now();
  const mObj={id:msgId,from:'me',type:'text',text,ts:nowTs};
  t.messages.push(mObj);saveChats();renderThread();

  if(t.dev){
    const entry=devInbox[uid]||{uid,name:me.name,avatar:me.avatar,frame:me.frame,messages:[]};
    entry.name=me.name;entry.avatar=me.avatar;entry.frame=me.frame;
    entry.messages.push({...mObj,from:'user'});
    devInbox[uid]=entry;syncDevInboxToCloud(uid,entry);
  }else if(t.uid){
    dbOp(()=>F.setDoc(F.doc(db,'dm_messages',msgId),{id:msgId,from:uid,to:t.uid,text,msgStyle:me.msgStyle||'',ts:nowTs}));
  }
}
$('#sendBtn').onclick=sendMsgText;$('#msgIn').onkeydown=e=>{if(e.key==='Enter')sendMsgText()};
$('#chBtn').onclick=()=>{
  if(cur==='world'||!cur||cur.startsWith('inbox:'))return toast('Duel only in friend chat');
  if(!online)return toast('Duels need a live connection');
  const t=chats[cur];if(!t||t.dev)return;
  const m=modal('Send 60s MCQ Duel',DUEL_GAMES.map((g,i)=>`<button class="btn ghost full" data-d="${i}">${g.icon} ${esc(g.name)} (20 🪙)</button>`).join(''));
  m.onclick=e=>{const d=e.target.dataset.d;if(d===undefined)return;t.messages=t.messages||[];if(consecutiveOutgoingCount(t.messages)>=3)return toast('3 messages sent without reply');const id=mid(),ts=Date.now();t.messages.push({id,from:'me',type:'duel',gi:+d,accepted:false,ts});saveChats();dbOp(()=>F.setDoc(F.doc(db,'dm_messages',id),{id,type:'duel',gi:+d,from:uid,to:t.uid,ts}));m.close();renderThread()};
};

$('#findBtn').onclick=()=>{
  const others=allUsers().filter(u=>u.uid!==uid&&!isDevAccount(u));
  const m=modal('Add Friend',`
    <label>Friend UID</label><input id="fUid" placeholder="Enter UID" autocomplete="off"><button class="btn full" id="fAdd">Add &amp; Chat</button>
    <div class="list" style="margin-top:12px">${others.map(u=>`<div class="th" data-prof="${esc(u.uid)}">${av(u,38)}<div class="mid"><b>${styledName(u)}</b><small>${esc(u.uid)}</small></div><button class="btn sm" data-add="${esc(u.uid)}" data-nm="${esc(u.name)}">${isFriend(u.uid)?'Chat':'Add'}</button></div>`).join('')||'<div class="empty">No other players yet.</div>'}
  `);
  const openF=(id,nm)=>{id=id.trim().toUpperCase();if(!id||id===uid)return;if(!isFriend(id)){me.friends.push(id);saveMe()}if(!chats[id])chats[id]={id,name:nm||id,uid:id,messages:[]};saveChats();m.close();renderChats();openThread(id)};
  $('#fAdd',m).onclick=()=>openF($('#fUid',m).value,'');
  m.onclick=e=>{
    const ad=e.target.closest('[data-add]');if(ad){openF(ad.dataset.add,ad.dataset.nm);return}
    const pr=e.target.closest('[data-prof]');if(pr){m.close();openPublicProfile(pr.dataset.prof)}
  };
};

function showTab(tab){
  $$('#nav button').forEach(x=>x.classList.toggle('on',x.dataset.tab===tab));
  $$('.view').forEach(v=>v.classList.toggle('on',v.id==='v-'+tab));
  $('main').scrollTop=0;
}
$('#nav').onclick=e=>{const b=e.target.closest('[data-tab]');if(b)showTab(b.dataset.tab)};
function renderAll(){renderRanking();renderTasks();renderStore();renderPoems();if(!cur)renderChats()}

/* Pinned notice (Developer) */
let notice=ls.get('sg_notice',null);
function renderNotice(){const b=$('#noticeBox');if(!notice||!notice.text){b.hidden=true;return}b.hidden=false;b.innerHTML=`📌 <span>${esc(notice.text)}</span>`}
$('#noticeBtn').onclick=()=>{
  const m=modal('📌 Pinned Notice',`<label>Short announcement shown to every user</label><textarea id="ntX" maxlength="140">${esc(notice?.text||'')}</textarea><button class="btn full" id="ntS">Publish</button><button class="btn ghost full" id="ntC">Clear notice</button>`);
  const put=txt=>{notice=txt?{text:txt,ts:Date.now()}:null;ls.set('sg_notice',notice);renderNotice();dbOp(()=>txt?F.setDoc(F.doc(db,'config','notice'),notice):F.deleteDoc(F.doc(db,'config','notice')));m.close()};
  $('#ntS',m).onclick=()=>put($('#ntX',m).value.trim());$('#ntC',m).onclick=()=>put('');
};
/* Referral: after 3 active days the referred user files a claim; the referrer's client pays +50 once */
function checkReferralPayout(){
  if(!online||me.accountType!=='account'||!me.referredBy||me.referralRewardClaimed)return;
  if(new Set(me.activeDays).size>=3){me.referralRewardClaimed=true;saveMe();dbOp(()=>F.setDoc(F.doc(db,'referrals',uid),{uid,code:me.referredBy,paid:false,ts:Date.now()}))}
}
$('#banLogin').onclick=openAuthModal;
applyTheme();applyLang();applyDevUI();checkBan();checkDailyLoginBonus();renderHome();renderGameSlots();renderNotice();buildProfile();updateHud();renderAll();sweepDuels();initFirebase();setInterval(sweepDuels,30000);
